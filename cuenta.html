<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Once Inicial · Cuenta y equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2A6B;--navy-dark:#0d1530;--gold:#C8A84B;
  --bg:#0f1624;--surface:#1e2d40;--surface2:#16233a;
  --text:#c8c0b0;--text2:#8890a0;--text3:#556070;
  --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.18);
  --radius:7px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;}
a{color:var(--gold);}

/* ── Barra de arriba (la misma de las demás pantallas) ── */
.oi-topnav{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--navy-dark);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;}
.oi-nav-left{display:flex;align-items:center;gap:10px;text-decoration:none;color:#ddd8cc;min-width:0;}
.oi-logo-circle{width:30px;height:30px;border-radius:50%;background:var(--navy);display:flex;
  align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.oi-logo-circle img{width:100%;height:100%;object-fit:contain;}
.oi-nav-text{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.oi-nav-sub{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
.oi-nav-main{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.oi-nav-sep{flex:1;}
.nav-btn{background:var(--surface);border:1px solid var(--border2);color:var(--text);
  border-radius:5px;padding:6px 11px;font-size:11px;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;}
.nav-btn:hover{border-color:var(--gold);color:var(--gold);}

/* ── Cuerpo ── */
#app{max-width:860px;margin:0 auto;padding:18px 14px 60px;}
.bloque{background:var(--surface);border:1px solid var(--border);border-radius:9px;margin-bottom:16px;overflow:hidden;}
.banda{background:var(--navy);color:var(--gold);font-family:'Barlow Condensed',sans-serif;
  font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 13px;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;}
.banda .ayuda{margin-left:auto;font-family:'Barlow',sans-serif;font-size:10.5px;font-weight:400;
  letter-spacing:0;text-transform:none;color:#9aa3b2;}
.caja{padding:13px;}
.fila{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center;margin-bottom:10px;}
.fila:last-child{margin-bottom:0;}
.et{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text2);}
input[type=text],input[type=email],input[type=password],select{
  width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:5px;
  color:var(--text);padding:7px 9px;font-size:12.5px;font-family:inherit;outline:none;}
input:focus,select:focus{border-color:var(--gold);}
input:disabled{color:var(--text3);background:rgba(0,0,0,.2);}
.btn{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:5px;
  padding:7px 13px;font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn.oro{background:var(--gold);color:#0d1530;border-color:var(--gold);}
.btn.oro:hover{background:#e0c068;color:#0d1530;}
.btn.rojo{color:#e05252;border-color:rgba(224,82,82,.4);}
.btn.rojo:hover{background:rgba(224,82,82,.12);color:#e05252;border-color:#e05252;}
.btn:disabled{opacity:.45;cursor:default;}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.nota{font-size:11px;color:var(--text3);line-height:1.6;margin-top:9px;}

/* ── Listas ── */
.item{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--border);
  border-radius:6px;margin-bottom:7px;flex-wrap:wrap;}
.item:last-child{margin-bottom:0;}
.ava{width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:13px;}
.item .quien{flex:1;min-width:150px;}
.item .n{font-weight:600;font-size:13px;color:#ddd8cc;}
.item .e{font-size:11px;color:var(--text3);}
.chapa{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.07);
  color:var(--text2);white-space:nowrap;}
.chapa.prop{background:rgba(200,168,75,.18);color:var(--gold);}
.chapa.yo{background:rgba(0,176,80,.18);color:#49c17a;}
.item select{width:auto;min-width:120px;font-size:11.5px;padding:5px 7px;}
.vacio{font-size:12px;color:var(--text3);text-align:center;padding:14px;line-height:1.6;}
.enlace{display:flex;gap:7px;align-items:center;margin-top:9px;}
.enlace input{font-size:11px;color:var(--text2);}

/* ── Avisos ── */
#aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);
  background:var(--navy);border:1px solid var(--gold);color:#ddd8cc;padding:9px 16px;border-radius:7px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:.18s;z-index:60;max-width:90vw;text-align:center;}
#aviso.ver{opacity:1;transform:translateX(-50%) translateY(0);}
#aviso.mal{border-color:#e05252;}
.cargando{text-align:center;color:var(--text3);font-size:12px;padding:20px;}
@media(max-width:620px){
  .fila{grid-template-columns:1fr;gap:4px;}
  #app{padding:12px 10px 50px;}
}
</style>
<script src="/oi-sesion.js"></script>
</head>
<body>

<div class="oi-topnav">
  <a href="inicio.html" class="oi-nav-left">
    <div class="oi-logo-circle"><img src="logo.png" alt=""></div>
    <div class="oi-nav-text">
      <span class="oi-nav-sub">El Once Inicial</span>
      <span class="oi-nav-main">Cuenta y equipo</span>
    </div>
  </a>
  <div class="oi-nav-sep"></div>
  <a class="nav-btn" href="inicio.html">Volver al inicio</a>
</div>

<div id="app"><div class="cargando">Cargando…</div></div>
<div id="aviso"></div>

<script>
// ══════════════════════════════════════════════════════════════
//  CUENTA Y EQUIPO
//  Todo lo que es "de quién es esto y quién puede tocarlo":
//    · mi cuenta (nombre, contraseña),
//    · el espacio en el que estoy trabajando (nombre, club, escudo),
//    · quién más está dentro y con qué permisos,
//    · y mis espacios, para cambiar de uno a otro o crear otro.
//
//  Los permisos no se inventan aquí: los pone la base de datos con sus
//  reglas por fila. Esta pantalla sólo enseña u oculta lo que, de todas
//  formas, el servidor dejaría o no hacer. Mandar siempre manda él.
// ══════════════════════════════════════════════════════════════

const ROLES = [
  ['propietario', 'Propietario',  'Todo, incluido invitar y quitar gente'],
  ['entrenador',  'Entrenador',   'Crear y editar'],
  ['analista',    'Analista',     'Crear y editar'],
  ['invitado',    'Invitado',     'Sólo mirar']
];
const ROL_LB = {}; ROLES.forEach(r=>ROL_LB[r[0]]=r[1]);

let yo = null;        // {id, email, nombre}
let espacio = null;   // {id, nombre, rol, ...}
let misEspacios = [];
let miembros = [];
let pendientes = [];

function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function avisa(t, mal){
  const a=document.getElementById('aviso');
  a.textContent=t; a.classList.toggle('mal',!!mal); a.classList.add('ver');
  clearTimeout(avisa._t); avisa._t=setTimeout(()=>a.classList.remove('ver'), mal?4200:2200);
}
function soyPropietario(){ return espacio && espacio.rol==='propietario'; }

// ── Hablar con la nube, con la sesión que ya hay ──
async function api(ruta, opts){
  const S = window.OISesion;
  if(!S){ throw new Error('Esta pantalla necesita la sesión'); }
  const tok = await S.testigo();
  if(!tok) throw new Error('Hay que volver a entrar');
  const o = Object.assign({}, opts||{});
  o.headers = Object.assign({
    'apikey': S.KEY, 'Authorization':'Bearer '+tok, 'Content-Type':'application/json'
  }, o.headers||{});
  const r = await fetch(S.URL + ruta, o);
  const txt = await r.text();
  let d=null; if(txt){ try{ d=JSON.parse(txt); }catch(e){ d=txt; } }
  if(!r.ok){
    const m = (d && (d.message||d.msg||d.error_description||d.error||d.hint)) || ('Error '+r.status);
    const e = new Error(m); e.estado=r.status; throw e;
  }
  return d;
}
const rpc = (nombre, args) => api('/rest/v1/rpc/'+nombre, {method:'POST', body:JSON.stringify(args||{})});

// ── Traer todo lo que hace falta ──
async function carga(){
  const S = window.OISesion;
  if(!S || !S.datos().ses){
    document.getElementById('app').innerHTML =
      '<div class="bloque"><div class="caja vacio">Entra con tu cuenta para ver esta pantalla.</div></div>';
    return;
  }
  const u = await api('/auth/v1/user');
  yo = {id:u.id, email:u.email, nombre:''};
  const perf = await api('/rest/v1/perfiles?id=eq.'+yo.id+'&select=id,email,nombre');
  if(perf && perf[0]) yo.nombre = perf[0].nombre||'';

  misEspacios = await rpc('mis_espacios') || [];
  const guardado = S.datos().espacio;
  espacio = (guardado && misEspacios.find(e=>e.id===guardado.id)) || misEspacios[0] || null;

  miembros = []; pendientes = [];
  if(espacio){
    const ms = await api('/rest/v1/miembros?espacio_id=eq.'+espacio.id+'&select=perfil_id,rol,creado_en');
    const ids = (ms||[]).map(m=>m.perfil_id);
    let perfiles = [];
    if(ids.length) perfiles = await api('/rest/v1/perfiles?id=in.('+ids.join(',')+')&select=id,email,nombre') || [];
    miembros = (ms||[]).map(m=>{
      const p = perfiles.find(x=>x.id===m.perfil_id) || {};
      return {id:m.perfil_id, rol:m.rol, desde:m.creado_en, email:p.email||'—', nombre:p.nombre||''};
    }).sort((a,b)=> (a.rol==='propietario'?0:1)-(b.rol==='propietario'?0:1) ||
                    String(a.nombre||a.email).localeCompare(String(b.nombre||b.email),'es'));
    if(espacio.rol==='propietario'){
      try{
        pendientes = await api('/rest/v1/invitaciones?espacio_id=eq.'+espacio.id+
          '&aceptada_en=is.null&select=id,email,rol,token,caduca_en,creado_en&order=creado_en.desc') || [];
      }catch(e){ pendientes = []; }
    }
  }
  pinta();
}

// ══════════════ LO QUE SE VE ══════════════
function pinta(){
  const app=document.getElementById('app');
  app.innerHTML = hojaCuenta() + hojaEspacio() + hojaMiembros() + hojaEspacios();
}

// ── Mi cuenta ──
function hojaCuenta(){
  return '<div class="bloque"><div class="banda">Mi cuenta</div><div class="caja">'
    +'<div class="fila"><div class="et">Correo</div>'
      +'<input type="email" value="'+esc(yo.email)+'" disabled title="El correo con el que entras no se cambia desde aquí"></div>'
    +'<div class="fila"><div class="et">Tu nombre</div>'
      +'<input type="text" id="c-nombre" value="'+esc(yo.nombre)+'" placeholder="Como quieres que te vean los demás"></div>'
    +'<div class="acciones"><button class="btn oro" data-a="guardaNombre">Guardar nombre</button></div>'
    +'<div class="fila" style="margin-top:16px;"><div class="et">Contraseña nueva</div>'
      +'<input type="password" id="c-pw1" placeholder="Mínimo 8 caracteres" autocomplete="new-password"></div>'
    +'<div class="fila"><div class="et">Repítela</div>'
      +'<input type="password" id="c-pw2" placeholder="Otra vez" autocomplete="new-password"></div>'
    +'<div class="acciones"><button class="btn" data-a="cambiaClave">Cambiar contraseña</button>'
      +'<button class="btn rojo" data-a="salir">Cerrar sesión</button></div>'
    +'</div></div>';
}

// ── El espacio ──
//   El nombre del club y el escudo no son columnas nuevas: son los que ya
//   usan la planilla de sesión y Datos, y suben a la nube con todo lo demás.
function hojaEspacio(){
  if(!espacio) return '';
  const puedo = soyPropietario();
  const club = localStorage.getItem('pz_plantilla_nombre')||'';
  const escudo = localStorage.getItem('oi_team_crest')||'';
  return '<div class="bloque"><div class="banda">El espacio'
    +'<span class="ayuda">'+(puedo?'Eres el propietario':'Sólo el propietario puede cambiarlo')+'</span></div>'
    +'<div class="caja">'
    +'<div class="fila"><div class="et">Nombre del espacio</div>'
      +'<input type="text" id="c-esp" value="'+esc(espacio.nombre)+'" '+(puedo?'':'disabled')
      +' placeholder="2026-2027, Cuerpo técnico…"></div>'
    +'<div class="fila"><div class="et">Equipo o club</div>'
      +'<input type="text" id="c-club" value="'+esc(club)+'" placeholder="CD Alcoyano"></div>'
    +'<div class="fila"><div class="et">Escudo</div><div style="display:flex;align-items:center;gap:10px;">'
      +(escudo?'<img src="'+escudo+'" alt="" style="width:34px;height:34px;object-fit:contain;">':'<span class="e" style="color:var(--text3);font-size:11px;">Sin escudo</span>')
      +'<button class="btn" data-a="escudo">'+(escudo?'Cambiar':'Poner escudo')+'</button>'
      +(escudo?'<button class="btn rojo" data-a="quitaEscudo">Quitar</button>':'')
      +'</div></div>'
    +'<div class="acciones"><button class="btn oro" data-a="guardaEspacio">Guardar</button></div>'
    +'<div class="nota">El nombre del espacio es el de la temporada o el grupo de trabajo. '
      +'El equipo y el escudo son los que salen en las sesiones, en los informes y al imprimir.</div>'
    +'</div></div>';
}

// ── Miembros ──
function hojaMiembros(){
  if(!espacio) return '';
  const puedo = soyPropietario();
  let h='<div class="bloque"><div class="banda">Quién está dentro'
    +'<span class="ayuda">'+miembros.length+(miembros.length===1?' persona':' personas')+'</span></div><div class="caja">';
  h += miembros.map(m=>{
    const soyYo = m.id===yo.id;
    const ini = (m.nombre||m.email||'?').trim().charAt(0).toUpperCase();
    let der;
    if(puedo && !soyYo){
      der = '<select data-rol="'+esc(m.id)+'">'+ROLES.map(r=>'<option value="'+r[0]+'"'+
        (m.rol===r[0]?' selected':'')+'>'+r[1]+' · '+r[2]+'</option>').join('')+'</select>'
        +'<button class="btn rojo" data-a="quita" data-id="'+esc(m.id)+'" data-n="'+esc(m.nombre||m.email)+'">Quitar</button>';
    } else {
      der = '<span class="chapa'+(m.rol==='propietario'?' prop':'')+'">'+esc(ROL_LB[m.rol]||m.rol)+'</span>';
    }
    return '<div class="item"><div class="ava">'+esc(ini)+'</div>'
      +'<div class="quien"><div class="n">'+esc(m.nombre||m.email)+(soyYo?' <span class="chapa yo">tú</span>':'')+'</div>'
      +'<div class="e">'+esc(m.email)+'</div></div>'+der+'</div>';
  }).join('');

  if(puedo){
    h += '<div style="margin-top:14px;padding-top:13px;border-top:1px solid var(--border);">'
      +'<div class="et" style="margin-bottom:8px;">Invitar a alguien</div>'
      +'<div class="fila" style="grid-template-columns:1fr 200px;">'
        +'<input type="email" id="c-inv-mail" placeholder="correo@ejemplo.com">'
        +'<select id="c-inv-rol">'+ROLES.filter(r=>r[0]!=='propietario')
          .map(r=>'<option value="'+r[0]+'">'+r[1]+' · '+r[2]+'</option>').join('')+'</select>'
      +'</div>'
      +'<div class="acciones"><button class="btn oro" data-a="invita">Crear invitación</button></div>'
      +'<div class="nota">Le llega un correo para ponerse su contraseña y, al entrar, ya está dentro del espacio '
        +'con el rol que le hayas puesto. El enlace caduca a los 14 días y <b>sólo sirve para ese correo</b>. '
        +'Se copia también al portapapeles, por si prefieres mandárselo tú.</div>'
      +'</div>';

    if(pendientes.length){
      h += '<div style="margin-top:14px;padding-top:13px;border-top:1px solid var(--border);">'
        +'<div class="et" style="margin-bottom:8px;">Invitaciones sin usar ('+pendientes.length+')</div>'
        + pendientes.map(p=>{
            const dias = Math.ceil((new Date(p.caduca_en) - new Date())/86400000);
            return '<div class="item"><div class="ava">✉</div>'
              +'<div class="quien"><div class="n">'+esc(p.email)+'</div>'
              +'<div class="e">'+esc(ROL_LB[p.rol]||p.rol)+' · '
              +(dias>0?('caduca en '+dias+(dias===1?' día':' días')):'caducada')+'</div></div>'
              +'<button class="btn" data-a="copia" data-t="'+esc(p.token)+'">Copiar enlace</button>'
              +'<button class="btn rojo" data-a="revoca" data-id="'+esc(p.id)+'" data-n="'+esc(p.email)+'">Revocar</button>'
              +'</div>';
          }).join('')
        +'</div>';
    }
  } else {
    h += '<div class="nota">Para invitar a alguien o cambiar permisos hace falta ser el propietario del espacio.</div>';
  }
  return h + '</div></div>';
}

// ── Mis espacios ──
function hojaEspacios(){
  let h='<div class="bloque"><div class="banda">Mis espacios'
    +'<span class="ayuda">Un espacio por equipo, club o temporada</span></div><div class="caja">';
  if(!misEspacios.length) h+='<div class="vacio">Todavía no tienes ningún espacio.</div>';
  else h += misEspacios.map(e=>{
    const activo = espacio && e.id===espacio.id;
    return '<div class="item"'+(activo?' style="border-color:rgba(200,168,75,.45);"':'')+'>'
      +'<div class="ava">'+esc((e.nombre||'?').trim().charAt(0).toUpperCase())+'</div>'
      +'<div class="quien"><div class="n">'+esc(e.nombre)+(activo?' <span class="chapa yo">en uso</span>':'')+'</div>'
      +'<div class="e">'+esc(ROL_LB[e.rol]||e.rol)+' · '+e.miembros+(e.miembros===1?' miembro':' miembros')+'</div></div>'
      +(activo?'' :'<button class="btn" data-a="cambia" data-id="'+esc(e.id)+'" data-n="'+esc(e.nombre)
         +'" data-r="'+esc(e.rol)+'">Trabajar aquí</button>')
      +(e.rol!=='propietario'?'<button class="btn rojo" data-a="salirEspacio" data-id="'+esc(e.id)+'" data-n="'+esc(e.nombre)+'">Salirme</button>':'')
      +'</div>';
  }).join('');
  h += '<div style="margin-top:14px;padding-top:13px;border-top:1px solid var(--border);">'
    +'<div class="et" style="margin-bottom:8px;">Crear otro espacio</div>'
    +'<div class="fila" style="grid-template-columns:1fr auto;">'
      +'<input type="text" id="c-esp-nuevo" placeholder="2027-2028, Filial, Otro club…">'
      +'<button class="btn oro" data-a="creaEspacio">Crear</button></div>'
    +'<div class="nota">Cada espacio tiene sus propios informes, sesiones, tareas y jugadores, y su propia gente. '
      +'Nada se mezcla entre uno y otro. Del que creas eres el propietario.</div>'
    +'</div>';
  return h + '</div></div>';
}

// ══════════════ LO QUE HACEN LOS BOTONES ══════════════
// Los botones se escuchan UNA vez desde el contenedor: la hoja se
// repinta entera a cada cambio, así que enganchar botón a botón
// dejaría oyentes muertos por el camino.
function engancha(){
  const app=document.getElementById('app');
  app.addEventListener('click', async function(ev){
    const b = ev.target.closest('[data-a]'); if(!b) return;
    try{ await accion(b.getAttribute('data-a'), b); }
    catch(e){ avisa(e && e.message ? e.message : 'No se ha podido', true); }
  });
  app.addEventListener('change', async function(ev){
    const s = ev.target.closest('[data-rol]'); if(!s || !espacio) return;
    try{
      await api('/rest/v1/miembros?espacio_id=eq.'+espacio.id+'&perfil_id=eq.'+s.getAttribute('data-rol'),
        {method:'PATCH', headers:{Prefer:'return=minimal'}, body:JSON.stringify({rol:s.value})});
      avisa('Permisos cambiados');
    }catch(e){ avisa(e.message||'No se ha podido cambiar el rol', true); }
    await carga();
  });
}

async function accion(a, b){
  if(a==='guardaNombre'){
    const n=(document.getElementById('c-nombre').value||'').trim();
    await api('/rest/v1/perfiles?id=eq.'+yo.id,
      {method:'PATCH', headers:{Prefer:'return=minimal'}, body:JSON.stringify({nombre:n})});
    yo.nombre=n; avisa('Nombre guardado'); return carga();
  }
  if(a==='cambiaClave'){
    const p1=document.getElementById('c-pw1').value||'', p2=document.getElementById('c-pw2').value||'';
    if(p1.length<8){ avisa('La contraseña necesita 8 caracteres como mínimo', true); return; }
    if(p1!==p2){ avisa('Las dos contraseñas no coinciden', true); return; }
    await api('/auth/v1/user', {method:'PUT', body:JSON.stringify({password:p1})});
    document.getElementById('c-pw1').value=''; document.getElementById('c-pw2').value='';
    avisa('Contraseña cambiada'); return pinta();
  }
  if(a==='salir'){
    if(!confirm('¿Cerrar sesión en este dispositivo?')) return pinta();
    if(window.OISesion && window.OISesion.salir) await window.OISesion.salir();
    location.reload(); return;
  }

  if(a==='guardaEspacio'){
    const club=(document.getElementById('c-club').value||'').trim();
    localStorage.setItem('pz_plantilla_nombre', club);
    if(soyPropietario()){
      const n=(document.getElementById('c-esp').value||'').trim();
      if(!n){ avisa('El espacio necesita un nombre', true); return pinta(); }
      await api('/rest/v1/espacios?id=eq.'+espacio.id,
        {method:'PATCH', headers:{Prefer:'return=minimal'}, body:JSON.stringify({nombre:n})});
      const g=window.OISesion.datos().espacio||{};
      localStorage.setItem('oi_nube_espacio', JSON.stringify(Object.assign({}, g, {id:espacio.id, nombre:n, rol:espacio.rol})));
    }
    avisa('Guardado'); return carga();
  }
  if(a==='escudo'){ pideEscudo(); return; }
  if(a==='quitaEscudo'){
    if(!confirm('¿Quitar el escudo del equipo?')) return pinta();
    localStorage.removeItem('oi_team_crest'); avisa('Escudo quitado'); return pinta();
  }

  if(a==='invita'){
    const em=(document.getElementById('c-inv-mail').value||'').trim();
    const rol=document.getElementById('c-inv-rol').value;
    if(!em || em.indexOf('@')<0){ avisa('Pon un correo válido', true); return pinta(); }
    b.disabled=true; b.textContent='Invitando…';
    try{
      const r = await invitaDeVerdad(em, rol);
      await copia(r.enlace);
      if(r.correo)        avisa('Invitación enviada a '+em+' · enlace copiado por si acaso');
      else if(r.yaTenia)  avisa(em+' ya tenía cuenta: mándale el enlace, que está copiado');
      else                avisa('Invitación creada y enlace copiado'+(r.aviso?' · el correo no salió: '+r.aviso:''));
    } finally { b.disabled=false; b.textContent='Crear invitación'; }
    return carga();
  }
  if(a==='copia'){ await copia(enlaceDe(b.getAttribute('data-t'))); avisa('Enlace copiado'); return; }
  if(a==='revoca'){
    if(!confirm('¿Revocar la invitación de '+b.getAttribute('data-n')+'?\nEl enlace que le mandaste dejará de valer.')) return pinta();
    await api('/rest/v1/invitaciones?id=eq.'+b.getAttribute('data-id'), {method:'DELETE'});
    avisa('Invitación revocada'); return carga();
  }
  if(a==='quita'){
    if(!confirm('¿Sacar a '+b.getAttribute('data-n')+' del espacio?\nDejará de ver todo lo de este espacio. Su trabajo no se borra.')) return pinta();
    await api('/rest/v1/miembros?espacio_id=eq.'+espacio.id+'&perfil_id=eq.'+b.getAttribute('data-id'), {method:'DELETE'});
    avisa('Ya no está en el espacio'); return carga();
  }

  if(a==='cambia'){
    localStorage.setItem('oi_nube_espacio', JSON.stringify({id:b.getAttribute('data-id'),
      nombre:b.getAttribute('data-n'), rol:b.getAttribute('data-r')}));
    location.reload(); return;
  }
  if(a==='salirEspacio'){
    if(!confirm('¿Salirte de "'+b.getAttribute('data-n')+'"?\nDejarás de ver su contenido. Para volver, tendrán que invitarte otra vez.')) return pinta();
    await api('/rest/v1/miembros?espacio_id=eq.'+b.getAttribute('data-id')+'&perfil_id=eq.'+yo.id, {method:'DELETE'});
    const g=window.OISesion.datos().espacio;
    if(g && g.id===b.getAttribute('data-id')) localStorage.removeItem('oi_nube_espacio');
    avisa('Te has salido del espacio'); return carga();
  }
  if(a==='creaEspacio'){
    const n=(document.getElementById('c-esp-nuevo').value||'').trim();
    if(!n){ avisa('Ponle nombre al espacio', true); return pinta(); }
    const id = await rpc('crear_espacio', {p_nombre:n});
    avisa('Espacio creado');
    if(confirm('Espacio "'+n+'" creado.\n¿Quieres trabajar ya en él?\n\nOjo: empieza vacío, con sus propias tareas, sesiones e informes.')){
      localStorage.setItem('oi_nube_espacio', JSON.stringify({id:id, nombre:n, rol:'propietario'}));
      location.reload(); return;
    }
    return carga();
  }
  pinta();
}

function enlaceDe(token){
  return location.origin + '/analisis.html?invitacion=' + token;
}
// Invitar de verdad: lo hace la función de servidor, que es la única que
// puede crearle la cuenta a alguien y mandarle el correo. Si todavía no
// está puesta (o se cae), no se deja a medias: se crea igualmente la
// invitación contra la base de datos y queda el enlace para mandarlo a
// mano, que es como funcionaba antes.
async function invitaDeVerdad(email, rol){
  try{
    const tok = await (window.OISesion ? window.OISesion.testigo() : null);
    const r = await fetch('/api/invitar', {method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+tok},
      body: JSON.stringify({espacio_id:espacio.id, email:email, rol:rol})});
    const d = await r.json().catch(()=>null);
    if(r.ok && d && d.ok) return d;
    // 404 = la función no está desplegada; 503 = falta la clave en Vercel
    if(r.status===404 || r.status===503 || !d) throw new Error('sin-funcion');
    throw new Error((d && d.error) || ('Error '+r.status));
  }catch(e){
    if(e && e.message && e.message!=='sin-funcion' && !/Failed to fetch|NetworkError/i.test(e.message)) throw e;
    const tok = await rpc('invitar', {p_espacio:espacio.id, p_email:email, p_rol:rol});
    return {enlace:enlaceDe(tok), correo:false, yaTenia:false, aviso:''};
  }
}
async function copia(txt){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){
    const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t);
    t.select(); try{ document.execCommand('copy'); }catch(e2){} t.remove();
  }
}

// ── Escudo del equipo (el mismo que usan las demás pantallas) ──
function pideEscudo(){
  let inp=document.getElementById('c-file');
  if(!inp){
    inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.id='c-file'; inp.style.display='none'; document.body.appendChild(inp);
    inp.addEventListener('change', function(ev){
      const f=ev.target.files&&ev.target.files[0]; ev.target.value='';
      if(!f) return;
      const r=new FileReader();
      r.onload=e=>{
        const im=new Image();
        im.onload=()=>{
          const max=320, k=Math.min(1, max/Math.max(im.width,im.height));
          const c=document.createElement('canvas');
          c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          try{
            localStorage.setItem('oi_team_crest', c.toDataURL('image/png'));
            avisa('Escudo puesto'); pinta();
          }catch(err){ avisa('La imagen es demasiado grande', true); }
        };
        im.onerror=()=>avisa('No se ha podido leer la imagen', true);
        im.src=e.target.result;
      };
      r.readAsDataURL(f);
    });
  }
  inp.click();
}

// ── Arranque ──
// oi-sesion.js pone su puerta antes: si no hay sesión, aquí no se llega.
(function arranca(){
  const espera = setInterval(()=>{
    if(!window.OISesion) return;
    clearInterval(espera);
    engancha();
    carga().catch(e=>{
      document.getElementById('app').innerHTML =
        '<div class="bloque"><div class="caja vacio">No se ha podido cargar: '+esc(e.message||e)+
        '<br><button class="btn" onclick="location.reload()" style="margin-top:10px;">Reintentar</button></div></div>';
    });
  }, 120);
  setTimeout(()=>clearInterval(espera), 8000);
})();
