<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Análisis — El Once Inicial</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#1B2A6B;--navy2:#0d1530;--gold:#C8A84B;
  --bg:#0f1624;--surface:#1e2d40;
  --text:#ddd8cc;--text2:#a09890;--border:rgba(200,168,75,0.15);
  --red:#e05252;--red2:#7a1a1a;
  --fc:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);overflow:hidden;display:flex;flex-direction:column;}

/* NAV */
.topnav{height:52px;background:var(--navy2);border-bottom:2px solid var(--gold);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;}
.nav-back{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);}
.nav-back:hover{color:var(--gold);}
.nav-logo-circle{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy2));border:1.5px solid rgba(200,168,75,0.5);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.nav-logo-circle img{width:100%;height:100%;object-fit:contain;}
.nav-logo-text{display:flex;flex-direction:column;line-height:1.15;}
.nav-logo-sub{font-size:8px;letter-spacing:2px;color:var(--gold);font-family:var(--fc);text-transform:uppercase;}
.nav-logo-main{font-size:14px;font-weight:700;letter-spacing:1.5px;color:var(--text);font-family:var(--fc);text-transform:uppercase;}
.nav-sep{flex:1;}
.nav-crest{width:36px;height:36px;border-radius:6px;border:1.5px solid rgba(200,168,75,0.3);display:flex;align-items:center;justify-content:center;background:rgba(200,168,75,0.05);overflow:hidden;}
.nav-crest img{width:100%;height:100%;object-fit:contain;display:none;}

/* TOOLBAR */
.toolbar{background:var(--navy2);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.btn{padding:7px 14px;border-radius:5px;cursor:pointer;font-family:var(--fc);font-size:12px;font-weight:700;letter-spacing:1px;border:none;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all 0.15s;}
.btn-gold{background:var(--gold);color:var(--navy2);}
.btn-gold:hover{filter:brightness(1.1);}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn-red{background:rgba(122,26,26,0.5);color:#ff8888;border:1px solid rgba(180,60,60,0.3);}
.sep{flex:1;}
.search{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:5px;font-family:var(--fc);font-size:12px;outline:none;width:190px;}
.search:focus{border-color:var(--gold);}

/* LAYOUT */
.main{flex:1;overflow:hidden;display:flex;}
.sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);}
.sidebar-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sidebar-title{font-family:var(--fc);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.informe-list{flex:1;overflow-y:auto;padding:6px;}
.inf-item{padding:9px 12px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;transition:all 0.12s;}
.inf-item:hover{background:rgba(200,168,75,0.06);border-color:var(--border);}
.inf-item.active{background:rgba(200,168,75,0.1);border-color:rgba(200,168,75,0.35);}
.inf-nombre{font-family:var(--fc);font-size:13px;font-weight:700;color:var(--text);cursor:pointer;}
.inf-nombre:hover{color:var(--gold);}
.inf-sub{font-size:10px;color:var(--text2);font-family:var(--fc);margin-top:1px;}
.inf-meta{font-size:10px;color:var(--text2);margin-top:2px;font-family:var(--fc);}
.inf-badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;margin-top:2px;font-family:var(--fc);font-weight:700;background:rgba(200,168,75,0.15);color:var(--gold);}
.inf-empty{padding:20px;text-align:center;color:var(--text2);font-size:11px;font-family:var(--fc);letter-spacing:1px;}

/* EDITOR */
.editor{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.editor-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text2);opacity:0.5;}
.editor-empty p{font-family:var(--fc);font-size:13px;letter-spacing:1px;}
.editor-content{padding:16px;display:flex;flex-direction:column;gap:14px;}

/* SECCIONES */
.sec{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.sec-hdr{padding:10px 14px;background:rgba(200,168,75,0.06);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.sec-title{font-family:var(--fc);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.sec-body{padding:14px;}

/* PORTADA */
.vs-row{display:flex;align-items:center;justify-content:center;gap:20px;padding:8px 0 14px;}
.esc-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.esc-box{width:80px;height:80px;cursor:pointer;border-radius:8px;overflow:hidden;border:2px dashed rgba(200,168,75,0.3);background:rgba(200,168,75,0.05);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;color:var(--text2);gap:2px;transition:all 0.15s;}
.esc-box:hover{border-color:var(--gold);background:rgba(200,168,75,0.1);}
.esc-box img{width:100%;height:100%;object-fit:contain;display:none;}
.esc-box small{font-size:8px;font-family:var(--fc);letter-spacing:0.5px;}
.vs-txt{font-family:var(--fc);font-size:34px;font-weight:900;color:var(--gold);letter-spacing:4px;}
.team-name{font-family:var(--fc);font-size:12px;font-weight:700;color:var(--text);text-align:center;cursor:pointer;max-width:90px;}
.team-name:hover{color:var(--gold);}
.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.meta-f{display:flex;flex-direction:column;gap:3px;}
.meta-l{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);font-family:var(--fc);}
.meta-i,.meta-s{background:var(--navy2);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:6px 8px;font-family:var(--fc);font-size:12px;outline:none;width:100%;}
.meta-i:focus,.meta-s:focus{border-color:var(--gold);}
.meta-s option{background:var(--navy2);}
.resultado-inp{font-size:20px;font-weight:900;text-align:center;color:var(--gold);}

/* ══ CAMPO EDITOR ══ */
/* campo-wrapper: el contenedor con fondo = campo.png */
.campo-wrap{position:relative;overflow:hidden;border-radius:0 0 6px 6px;background:#2a7a2a;cursor:crosshair;}
/* XI: horizontal. La imagen de campo es vertical (portrait), la rotamos via SVG */
.campo-wrap.xi-mode{width:100%;}
/* SVG ocupa todo el wrap */
.campo-svg{width:100%;height:100%;display:block;position:absolute;top:0;left:0;touch-action:none;}
/* image tag dentro del SVG como background */

/* TOOLBAR CAMPO */
.campo-toolbar{padding:8px 12px;background:var(--navy2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ct-btn{padding:4px 10px;border-radius:4px;cursor:pointer;font-family:var(--fc);font-size:10px;font-weight:700;letter-spacing:0.5px;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all 0.12s;white-space:nowrap;}
.ct-btn:hover{border-color:var(--gold);color:var(--gold);}
.ct-btn.active{background:rgba(200,168,75,0.2);border-color:var(--gold);color:var(--gold);}
.ct-btn.red-btn{border-color:rgba(200,80,80,0.4);color:#ff9090;}
.ct-btn.red-btn:hover,.ct-btn.red-btn.active{background:rgba(200,80,80,0.2);border-color:var(--red);}
.ct-sep{width:1px;height:18px;background:var(--border);flex-shrink:0;margin:0 2px;}
.ct-pick{width:24px;height:20px;border-radius:3px;border:1px solid var(--border);cursor:pointer;padding:1px;background:transparent;}
.ct-label{font-size:9px;color:var(--text2);font-family:var(--fc);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;}
.ct-sel{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:3px 7px;border-radius:4px;font-family:var(--fc);font-size:11px;outline:none;cursor:pointer;}
.ct-sel option{background:var(--navy2);}

/* PANEL LATERAL JUGADORES */
.xi-layout{display:flex;gap:0;}
.xi-campo-col{flex:1;display:flex;flex-direction:column;min-width:0;}
.xi-right-col{width:200px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--navy2);overflow-y:auto;max-height:600px;}
.panel-section{padding:10px 12px;border-bottom:1px solid var(--border);}
.panel-title{font-family:var(--fc);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.player-list{display:flex;flex-direction:column;gap:3px;max-height:160px;overflow-y:auto;}
.player-row{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent;transition:all 0.1s;}
.player-row:hover{background:rgba(200,168,75,0.06);}
.player-row.sel{background:rgba(200,168,75,0.12);border-color:rgba(200,168,75,0.35);}
.player-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fc);font-size:9px;font-weight:900;color:white;flex-shrink:0;border:1.5px solid #C8A84B;}
.player-name-inp{flex:1;background:transparent;border:none;outline:none;border-bottom:1px solid transparent;color:var(--text);font-family:var(--fc);font-size:11px;padding:1px 2px;min-width:0;}
.player-name-inp:focus{border-bottom-color:var(--gold);}
.player-row.sel .player-name-inp{border-bottom-color:rgba(200,168,75,0.3);}

/* PANEL EDICIÓN JUGADOR */
.edit-panel{padding:10px 12px;}
.edit-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.edit-label{font-size:9px;color:var(--text2);font-family:var(--fc);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;}
.edit-inp{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:3px;padding:4px 6px;font-family:var(--fc);font-size:11px;outline:none;width:100%;}
.edit-inp:focus{border-color:var(--gold);}
.edit-inp.small{width:45px;}
.size-slider{flex:1;cursor:pointer;accent-color:var(--gold);}
.color-pick-sm{width:22px;height:18px;border-radius:2px;border:1px solid var(--border);cursor:pointer;padding:1px;background:transparent;flex-shrink:0;}

/* ICONOS GRID */
.iconos-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.ico-btn{padding:3px 6px;border-radius:3px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:var(--fc);font-size:9px;display:flex;align-items:center;gap:3px;transition:all 0.1s;}
.ico-btn:hover{border-color:var(--gold);}
.ico-btn.sel{background:rgba(200,168,75,0.15);border-color:var(--gold);color:var(--gold);}
.ico-emoji{font-size:11px;width:14px;text-align:center;}

/* MOMENTOS */
.mom-tabs{display:flex;gap:3px;padding:8px 12px 0;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
.mom-tab{padding:6px 10px;border-radius:5px 5px 0 0;cursor:pointer;font-family:var(--fc);font-size:10px;font-weight:700;letter-spacing:0px;border:1px solid var(--border);border-bottom:none;color:var(--text2);background:transparent;white-space:nowrap;transition:all 0.12s;flex-shrink:0;overflow:visible;min-width:fit-content;}
.mom-tab.active{background:var(--gold);color:var(--navy2);border-color:var(--gold);}
.mom-tab:hover:not(.active){border-color:var(--gold);color:var(--gold);}
.mom-panel{display:none;padding:12px;}
.mom-panel.active{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mom-col{display:flex;flex-direction:column;gap:6px;}
.mom-title-inp{background:transparent;border:none;outline:none;border-bottom:1px solid var(--border);color:var(--gold);font-family:var(--fc);font-size:11px;font-weight:700;letter-spacing:1px;width:100%;padding:3px 0;text-transform:uppercase;}
.mom-title-inp::placeholder{color:rgba(200,168,75,0.3);}
.mom-desc{background:var(--navy2);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:8px;font-family:var(--fb);font-size:11px;outline:none;resize:vertical;min-height:55px;width:100%;}
.mom-desc:focus{border-color:var(--gold);}
.mom-desc::placeholder{color:rgba(160,152,144,0.2);}
/* Mini campos en momentos: proporción real campo portrait */
.mini-campo-wrap{position:relative;overflow:hidden;border-radius:4px;border:1px solid var(--border);background:#2a7a2a;}

.mini-toolbar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--navy2);border:1px solid var(--border);border-bottom:none;border-radius:4px 4px 0 0;flex-wrap:wrap;}
/* ALINEACIONES */
.alins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;}
.alin-card{background:var(--navy2);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.alin-card-hdr{padding:6px 8px;display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--border);}
.alin-inp{background:transparent;border:none;outline:none;border-bottom:1px solid transparent;color:var(--text);font-family:var(--fc);font-size:11px;padding:1px 2px;}
.alin-inp:focus{border-bottom-color:var(--gold);}
.alin-inp.jornada{width:35px;color:var(--gold);font-weight:700;}
.alin-inp.resultado{flex:1;text-align:center;font-weight:700;font-size:12px;}
.alin-inp.rival{display:block;padding:4px 8px;font-size:10px;color:var(--text2);border-bottom:1px solid var(--border);width:100%;}
.alin-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;margin-left:auto;padding:0 2px;}
.alin-del:hover{color:#ff6060;}
.alin-add{background:rgba(200,168,75,0.05);border:1px dashed rgba(200,168,75,0.25);border-radius:6px;min-height:80px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--fc);font-size:11px;color:var(--text2);transition:all 0.15s;gap:4px;}
.alin-add:hover{border-color:var(--gold);color:var(--gold);}

/* NOTAS */
.notas-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.nota-item{display:flex;flex-direction:column;gap:4px;}
.nota-label{font-size:9px;letter-spacing:1.5px;color:var(--text2);font-family:var(--fc);text-transform:uppercase;}
.nota-ta{background:var(--navy2);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:8px;font-family:var(--fb);font-size:11px;outline:none;resize:vertical;min-height:60px;width:100%;}
.nota-ta:focus{border-color:var(--gold);}
.nota-ta::placeholder{color:rgba(160,152,144,0.2);}

/* MODAL CALENDARIO */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:500;display:none;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,0.7);}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-title{font-family:var(--fc);font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;line-height:1;}
.cal-item{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;}
.cal-item:hover{background:rgba(200,168,75,0.06);}
.cal-teams{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.cal-teams img{width:24px;height:24px;object-fit:contain;border-radius:2px;}
.cal-team-name{font-family:var(--fc);font-size:12px;font-weight:700;color:var(--text);}
.cal-vs{font-family:var(--fc);font-size:11px;color:var(--gold);font-weight:700;margin:0 4px;}
.cal-meta{font-size:10px;color:var(--text2);font-family:var(--fc);}

/* MULTI-SELECT */
.jug-g.multi-sel circle:first-of-type{filter:drop-shadow(0 0 2px white);}
</style>
</head>

/* ════════════════════════════════════════════

function init(){

  if(c){var i=document.getElementById('crest-nav-img');if(i){i.src=c;i.style.display='block';if(i.previousElementSibling)i.previousElementSibling.style.display='none';}}

/* ════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════ */
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function saveInformes(){localStorage.setItem('oi_informes_v2',JSON.stringify(informes));}
function saveCampos()  {localStorage.setItem('oi_campos_v2',JSON.stringify(campos));}
function getInf(id)    {return informes.find(function(i){return i.id===id;});}
function getCampo(ck)  {
  if(!campos[ck]) campos[ck]={jugs:[],arrows:[]};
  if(Array.isArray(campos[ck])) campos[ck]={jugs:campos[ck],arrows:[]};
  return campos[ck];
}
function getJugs(ck)   {return getCampo(ck).jugs;}
function isSelected(ck,ji){return selSet.some(function(s){return s.campoKey===ck&&s.idx===ji;});}
function clearSel()    {selSet=[];}
function addSel(ck,ji) {if(!isSelected(ck,ji))selSet.push({campoKey:ck,idx:ji});}
function removeSel(ck,ji){selSet=selSet.filter(function(s){return !(s.campoKey===ck&&s.idx===ji);});}
function toggleSel(ck,ji){if(isSelected(ck,ji))removeSel(ck,ji);else addSel(ck,ji);}

/* ════════════════════════════════════════════
   SIDEBAR
════════════════════════════════════════════ */
function renderSidebar(filter){
  var list=document.getElementById('informe-list');
  document.getElementById('inf-count').textContent=informes.length;
  var items=filter?informes.filter(function(i){return((i.nombre||i.rival||'').toLowerCase()).includes(filter.toLowerCase());}):informes;
  if(!items.length){list.innerHTML='<div class="inf-empty">'+(filter?'Sin resultados':'Sin informes. Crea uno.')+'</div>';return;}
  list.innerHTML=items.map(function(inf){
    var active=inf.id===currentId?' active':'';
    var titulo=inf.nombre||inf.rival||'Sin nombre';
    var sub=inf.nombre&&inf.rival?'vs '+esc(inf.rival):'';
    var res=inf.resultado?' · '+inf.resultado:'';
    return '<div class="inf-item'+active+'" data-id="'+inf.id+'" onclick="abrirInforme(this.dataset.id)">'
      +'<div class="inf-nombre" data-id="'+inf.id+'" onclick="event.stopPropagation();editarNombre(this.dataset.id)">'+esc(titulo)+' ✏️</div>'
      +(sub?'<div class="inf-sub">'+sub+'</div>':'')
      +'<div class="inf-meta">'+(inf.fecha||'Sin fecha')+res+'</div>'
      +'<span class="inf-badge">'+(inf.competicion||'Amistoso')+'</span>'
      +'</div>';
  }).join('');
}
function filtrar(v){renderSidebar(v);}
function editarNombre(id){
  var inf=getInf(id);if(!inf)return;
  var v=prompt('Nombre del informe:',inf.nombre||inf.rival||'');
  if(v===null)return;inf.nombre=v.trim();saveInformes();renderSidebar();
}

function nuevoInforme(){
  var id='inf_'+Date.now();
  informes.unshift({id:id,nombre:'',rival:'',localName:'',localCrest:null,escudoRival:null,
    nuestroEquipo:true,fecha:'',hora:'',jornada:'',competicion:'Amistoso',sede:'Local',
    campo:'',resultado:'',momentos:{},notas:{},alineaciones:[]});
  saveInformes();abrirInforme(id);
}
function eliminarInforme(){
  if(!currentId||!confirm('¿Eliminar este informe?'))return;
  informes=informes.filter(function(i){return i.id!==currentId;});
  saveInformes();currentId=null;
  document.getElementById('editor-empty').style.display='';
  document.getElementById('editor-content').style.display='none';
  document.getElementById('btn-print').style.display='none';
  document.getElementById('btn-del').style.display='none';
  renderSidebar();
}
function abrirInforme(id){
  currentId=id;clearSel();
  document.getElementById('editor-empty').style.display='none';
  document.getElementById('editor-content').style.display='';
  document.getElementById('btn-print').style.display='';
  document.getElementById('btn-del').style.display='';
  renderSidebar();renderEditor();
}

/* ════════════════════════════════════════════
   RENDER EDITOR
════════════════════════════════════════════ */
function renderEditor(){
  var inf=getInf(currentId);if(!inf)return;
  var el=document.getElementById('editor-content');
  el.innerHTML=secPortada(inf)+secXI(inf)+secAlineaciones(inf)+secMomentos(inf)+secNotas(inf);
  /* cargar escudos */
  _loadEsc('esc-local',inf.nuestroEquipo!==false?localStorage.getItem('oi_team_crest'):inf.localCrest);
  _loadEsc('esc-rival',inf.escudoRival);
  /* bind meta fields */
  setTimeout(bindMeta,30);
  /* render campos */
  setTimeout(renderAllCampos,50);
}
function _loadEsc(id,src){
  if(!src)return;
  var box=document.getElementById(id);if(!box)return;
  var img=box.querySelector('img');if(!img)return;
  img.src=src;img.style.display='block';
  box.style.border='none';box.style.background='transparent';
  /* hide emoji+text */
  Array.from(box.childNodes).forEach(function(n){if(n.nodeType===3||n.tagName==='SMALL')n.remove?n.remove():null;});
  if(box.firstChild&&box.firstChild.nodeType===3)box.removeChild(box.firstChild);
}
function bindMeta(){
  document.querySelectorAll('.pf').forEach(function(el){
    el.onchange=el.oninput=function(){autoGuardar(this.dataset.k,this.value);};
  });
}
function autoGuardar(k,v){
  var inf=getInf(currentId);if(!inf)return;
  inf[k]=v;saveInformes();renderSidebar();
}

function buildEditPanel(key, sel){
  var selForKey = sel.filter(function(s){return s.campoKey===key;});
  if(!selForKey.length) return '';
  var firstSel = selForKey[0];
  var selJug = getJugs(key)[firstSel.idx];
  if(!selJug) return '';
  var count = selForKey.length;
  var h = [];
  h.push('<div class="edit-panel">');
  h.push('<div class="panel-title">&#9999;&#65039; Editar '+(count>1?count+' jugadores':'jugador')+'</div>');
  h.push('<div class="edit-row">');
  h.push('<label class="edit-label">Fondo:</label>');
  h.push('<input type="color" class="color-pick-sm" value="'+(selJug.fill||'#1B2A6B')+'" data-ck="'+key+'" data-prop="fill" oninput="setSelPropEl(this,this.value)">');
  h.push('<label class="edit-label" style="margin-left:4px;">Borde:</label>');
  h.push('<input type="color" class="color-pick-sm" value="'+(selJug.stroke||'#C8A84B')+'" data-ck="'+key+'" data-prop="stroke" oninput="setSelPropEl(this,this.value)">');
  h.push('</div>');
  h.push('<div class="edit-row">');
  h.push('<label class="edit-label">Tam.:</label>');
  h.push('<input type="range" class="size-slider" min="0.5" max="2.5" step="0.1" value="'+(selJug.sizeF||1)+'" data-ck="'+key+'" data-prop="sizeF" oninput="setSelPropEl(this,parseFloat(this.value))">');
  h.push('</div>');
  h.push('<div class="edit-row">');
  h.push('<label class="edit-label">#:</label>');
  h.push('<input type="color" class="color-pick-sm" value="'+(selJug.textColor||'#ffffff')+'" data-ck="'+key+'" data-prop="textColor" oninput="setSelPropEl(this,this.value)" title="Color dorsal">');
  h.push('<label class="edit-label" style="margin-left:4px;">Nombre:</label>');
  h.push('<input type="color" class="color-pick-sm" value="'+(selJug.nameColor||'#ffffff')+'" data-ck="'+key+'" data-prop="nameColor" oninput="setSelPropEl(this,this.value)" title="Color nombre">');
  h.push('</div>');
  h.push('<div class="panel-title" style="margin-top:6px;">Características</div>');
  h.push('<div class="iconos-grid">');

    h.push('<span style="font-size:9px;">'+ico[2]+'</span></div>');
  });
  h.push('</div></div>');
  return h.join('');
}

function miniActionEl(btn){ miniAction(btn, btn.dataset.action); }
function miniAction(btn, action){
  var toolbar=btn.closest('.mini-toolbar');
  if(!toolbar)return;
  var ck=toolbar.dataset.ckey;
  if(!ck)return;
  var cjEl=toolbar.querySelector('[data-role=cj]');
  var cfEl=toolbar.querySelector('[data-role=cf]');
  var acEl=toolbar.querySelector('[data-role=arrowcol]');
  var cj=cjEl?cjEl.value:'#C8A84B';
  var cf=cfEl?cfEl.value:'#1B2A6B';
  var ac=acEl?acEl.value:'#ff3333';
  if(action==='addjug'){
    var d=getCampo(ck);
    var VW=68,VH=105,P=3;
    d.jugs.push({x:parseFloat((VW/2).toFixed(1)),y:parseFloat((VH/2).toFixed(1)),
      num:String(d.jugs.length+1),stroke:cj,fill:cf,nombre:'',iconos:[],sizeF:1});
    clearSel();addSel(ck,d.jugs.length-1);
    saveCampos();renderCampo(ck);
  } else if(action==='sistema'){
    var sys=prompt('Sistema (ej: 1-4-3-3):','1-4-3-3');
    if(!sys||!SISTEMAS[sys]){return;}
    var d=getCampo(ck);d.jugs=[];
    var rows=SISTEMAS[sys],VW=68,VH=105,P=3,fw=VW-P*2,fh=VH-P*2;
    var di=0;
    rows.forEach(function(row,ri){
      var yPct=0.07+ri*(0.86/(rows.length-1));
      var fy=parseFloat((P+fh*yPct).toFixed(2));
      row.forEach(function(_,ci){
        var fx=parseFloat((P+fw*((ci+1)/(row.length+1))).toFixed(2));
        d.jugs.push({x:fx,y:fy,num:String(DORSAL[di]||di+1),stroke:cj,fill:cf,nombre:'',iconos:[],sizeF:1});
        di++;
      });
    });
    saveCampos();renderCampo(ck);
  } else if(action==='delarrow'){
    delLastArrow(ck);
  } else if(action==='delsel'){
    var idxs=selSet.filter(function(ss){return ss.campoKey===ck;}).map(function(ss){return ss.idx;}).sort(function(a,b){return b-a;});
    var d=getCampo(ck);
    idxs.forEach(function(idx){d.jugs.splice(idx,1);});
    clearSel();saveCampos();renderCampo(ck);
  } else if(action==='draw-solid'||action==='draw-dashed'){
    var mode=action.replace('draw-','');
    _miniDrawMode[ck]=mode;
    /* highlight active button */
    toolbar.querySelectorAll('.ct-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
  } else if(action==='draw-off'){
    _miniDrawMode[ck]=null;
    toolbar.querySelectorAll('.ct-btn').forEach(function(b){b.classList.remove('active');});
  }
}

/* ════════════════════════════════════════════
   CAMPO SVG — genera SVG dentro de #cw_{key}
════════════════════════════════════════════ */
function renderCampo(campoKey){
  var wrap=document.getElementById('cw_'+campoKey);
  if(!wrap)return;
  var isXI=campoKey.endsWith('_xi');
  /* ViewBox: campo real 105×68. XI→landscape: 105×68. Mini→portrait: 68×105 */
  var VW=isXI?105:68, VH=isXI?68:105;
  var data=getCampo(campoKey);
  var jugs=data.jugs||[], arrows=data.arrows||[];

  /* factor escala: radio base en unidades de campo */
  var rBase=isXI?(VH*0.048):(VH*0.032);

  var o=[];
  o.push('<svg id="svg_'+campoKey+'" viewBox="0 0 '+VW+' '+VH+'"'
    +' xmlns="http://www.w3.org/2000/svg"'
    +' style="position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;"'
    +' data-ck="'+campoKey+'">');

  /* background = campo.png via image tag */
  /* Campo imagen de fondo — para XI rotamos 90° dentro del SVG */
  if(isXI){
    /* Rotar imagen portrait→landscape: la imagen se coloca centrada y rotada */
    var imgSize=Math.max(VW,VH);
    o.push('<g transform="translate('+VW/2+','+VH/2+') rotate(-90) translate('+(-VH/2)+','+(-VW/2)+')">'
      +'<image href="'+CAMPO_IMG+'" x="0" y="0" width="'+VH+'" height="'+VW+'" preserveAspectRatio="none"/>'
      +'</g>');
  } else {
    o.push('<image href="'+CAMPO_IMG+'" x="0" y="0" width="'+VW+'" height="'+VH+'" preserveAspectRatio="none"/>');
  }

  /* Si el campo es XI (landscape), la imagen de campo es portrait, hay que rotarla */
  /* Usamos un rect con clipPath o directamente rotamos la imagen */

  /* Líneas campo */
  var lc='rgba(255,255,255,0.8)', lw=isXI?0.4:0.5;
  var P=isXI?4:3, fw=VW-P*2, fh=VH-P*2;
  var sc='stroke="'+lc+'" stroke-width="'+lw+'" fill="none"';

  /* borde */
  o.push('<rect x="'+P+'" y="'+P+'" width="'+fw+'" height="'+fh+'" '+sc+'/>');

  if(isXI){
    var mx=VW/2, my=VH/2;
    /* línea central */
    o.push('<line x1="'+mx+'" y1="'+P+'" x2="'+mx+'" y2="'+(VH-P)+'" '+sc+'/>');
    /* círculo central */
    var ccr=(fh*0.146).toFixed(2);
    o.push('<circle cx="'+mx+'" cy="'+my+'" r="'+ccr+'" '+sc+'/>');
    o.push('<circle cx="'+mx+'" cy="'+my+'" r="0.5" fill="'+lc+'"/>');
    /* áreas grandes */
    var aH=fh*0.618, aW=fw*0.13;
    var ay=(my-aH/2).toFixed(2);
    o.push('<rect x="'+P+'" y="'+ay+'" width="'+aW.toFixed(2)+'" height="'+aH.toFixed(2)+'" '+sc+'/>');
    o.push('<rect x="'+(VW-P-aW).toFixed(2)+'" y="'+ay+'" width="'+aW.toFixed(2)+'" height="'+aH.toFixed(2)+'" '+sc+'/>');
    /* áreas pequeñas */
    var sH=fh*0.353, sW=fw*0.057;
    var sy=(my-sH/2).toFixed(2);
    o.push('<rect x="'+P+'" y="'+sy+'" width="'+sW.toFixed(2)+'" height="'+sH.toFixed(2)+'" '+sc+'/>');
    o.push('<rect x="'+(VW-P-sW).toFixed(2)+'" y="'+sy+'" width="'+sW.toFixed(2)+'" height="'+sH.toFixed(2)+'" '+sc+'/>');
    /* puntos penalti + arcos */
    var px1=P+fw*0.11, px2=VW-P-fw*0.11, cr=parseFloat(ccr);
    o.push('<circle cx="'+px1.toFixed(2)+'" cy="'+my+'" r="0.5" fill="'+lc+'"/>');
    o.push('<circle cx="'+px2.toFixed(2)+'" cy="'+my+'" r="0.5" fill="'+lc+'"/>');
    var ae1=P+aW, cosA=(ae1-px1)/cr;
    if(Math.abs(cosA)<=1){var a=Math.acos(cosA),y1=(my-Math.sin(a)*cr).toFixed(2),y2=(my+Math.sin(a)*cr).toFixed(2);o.push('<path d="M '+ae1.toFixed(2)+' '+y1+' A '+cr+' '+cr+' 0 0 1 '+ae1.toFixed(2)+' '+y2+'" '+sc+'/>');}
    var ae2=VW-P-aW, cosA2=(px2-ae2)/cr;
    if(Math.abs(cosA2)<=1){var a2=Math.acos(cosA2),y3=(my-Math.sin(a2)*cr).toFixed(2),y4=(my+Math.sin(a2)*cr).toFixed(2);o.push('<path d="M '+ae2.toFixed(2)+' '+y3+' A '+cr+' '+cr+' 0 0 0 '+ae2.toFixed(2)+' '+y4+'" '+sc+'/>');}
    /* porterías */
    var gH=fh*0.147,gW=fw*0.02,gy=(my-gH/2).toFixed(2);
    o.push('<rect x="'+(P-gW).toFixed(2)+'" y="'+gy+'" width="'+gW.toFixed(2)+'" height="'+gH.toFixed(2)+'" '+sc+'/>');
    o.push('<rect x="'+VW.toFixed(2)+'" y="'+gy+'" width="'+gW.toFixed(2)+'" height="'+gH.toFixed(2)+'" '+sc+'/>');
  } else {
    /* VERTICAL */
    var mx=VW/2, my=VH/2;
    o.push('<line x1="'+P+'" y1="'+my+'" x2="'+(VW-P)+'" y2="'+my+'" '+sc+'/>');
    var ccr2=(fw*0.146).toFixed(2);
    o.push('<circle cx="'+mx+'" cy="'+my+'" r="'+ccr2+'" '+sc+'/>');
    o.push('<circle cx="'+mx+'" cy="'+my+'" r="0.5" fill="'+lc+'"/>');
    var aW2=fw*0.618, aH2=fh*0.13;
    var ax2=(mx-aW2/2).toFixed(2);
    o.push('<rect x="'+ax2+'" y="'+P+'" width="'+aW2.toFixed(2)+'" height="'+aH2.toFixed(2)+'" '+sc+'/>');
    o.push('<rect x="'+ax2+'" y="'+(VH-P-aH2).toFixed(2)+'" width="'+aW2.toFixed(2)+'" height="'+aH2.toFixed(2)+'" '+sc+'/>');
    var sW2=fw*0.353, sH2=fh*0.057;
    var sx2=(mx-sW2/2).toFixed(2);
    o.push('<rect x="'+sx2+'" y="'+P+'" width="'+sW2.toFixed(2)+'" height="'+sH2.toFixed(2)+'" '+sc+'/>');
    o.push('<rect x="'+sx2+'" y="'+(VH-P-sH2).toFixed(2)+'" width="'+sW2.toFixed(2)+'" height="'+sH2.toFixed(2)+'" '+sc+'/>');
    var py1=P+fh*0.11, py2=VH-P-fh*0.11, cr2=parseFloat(ccr2);
    o.push('<circle cx="'+mx+'" cy="'+py1.toFixed(2)+'" r="0.5" fill="'+lc+'"/>');
    o.push('<circle cx="'+mx+'" cy="'+py2.toFixed(2)+'" r="0.5" fill="'+lc+'"/>');
    var ae3=P+aH2, cosB=(ae3-py1)/cr2;
    if(Math.abs(cosB)<=1){var b=Math.acos(cosB),x1=(mx-Math.sin(b)*cr2).toFixed(2),x2=(mx+Math.sin(b)*cr2).toFixed(2);o.push('<path d="M '+x1+' '+ae3.toFixed(2)+' A '+cr2+' '+cr2+' 0 0 0 '+x2+' '+ae3.toFixed(2)+'" '+sc+'/>');}
    var ae4=VH-P-aH2, cosB2=(py2-ae4)/cr2;
    if(Math.abs(cosB2)<=1){var b2=Math.acos(cosB2),x3=(mx-Math.sin(b2)*cr2).toFixed(2),x4=(mx+Math.sin(b2)*cr2).toFixed(2);o.push('<path d="M '+x3+' '+ae4.toFixed(2)+' A '+cr2+' '+cr2+' 0 0 1 '+x4+' '+ae4.toFixed(2)+'" '+sc+'/>');}
    var gW2=fw*0.147,gH2=fh*0.02,gx2=(mx-gW2/2).toFixed(2);
    o.push('<rect x="'+gx2+'" y="'+(P-gH2).toFixed(2)+'" width="'+gW2.toFixed(2)+'" height="'+gH2.toFixed(2)+'" '+sc+'/>');
    o.push('<rect x="'+gx2+'" y="'+(VH-P).toFixed(2)+'" width="'+gW2.toFixed(2)+'" height="'+gH2.toFixed(2)+'" '+sc+'/>');
  }

  /* defs marcadores flecha */
  o.push('<defs>');
  ['ff3333','C8A84B','ffffff','3399ff','ffff00'].forEach(function(c){
    o.push('<marker id="mh_'+campoKey+'_'+c+'" markerWidth="4" markerHeight="3" refX="3.5" refY="1.5" orient="auto">');
    o.push('<polygon points="0 0, 4 1.5, 0 3" fill="#'+c+'"/>');
    o.push('</marker>');
  });
  o.push('</defs>');

  /* flechas */
  arrows.forEach(function(arr){
    if(arr.x1==null)return;
    var clr=(arr.color||'#ff3333').replace('#','');
    var sw=arr.sw||0.7;
    var dash=arr.type==='dashed'?'stroke-dasharray="2 1.2"':arr.type==='dotted'?'stroke-dasharray="0.4 1"':'';
    o.push('<line x1="'+arr.x1+'" y1="'+arr.y1+'" x2="'+arr.x2+'" y2="'+arr.y2+'"'
      +' stroke="#'+clr+'" stroke-width="'+sw+'" '+dash
      +' marker-end="url(#mh_'+campoKey+'_'+clr+')" stroke-linecap="round"/>');
  });

  /* jugadores */
  jugs.forEach(function(jug,ji){
    if(jug.x==null||jug.y==null)return;
    var sel=isSelected(campoKey,ji);
    var fill=jug.fill||'#1B2A6B', stroke=jug.stroke||'#C8A84B';
    var sf=jug.sizeF||1;
    var r=(rBase*sf).toFixed(2);
    var rf=parseFloat(r);
    var textC=jug.textColor||'#ffffff', nameC=jug.nameColor||'#ffffff';
    o.push('<g class="jug-g" data-ji="'+ji+'" style="cursor:grab;">');
    if(sel)o.push('<circle cx="'+jug.x+'" cy="'+jug.y+'" r="'+(rf+1.5).toFixed(2)+'" fill="rgba(255,255,255,0.22)" stroke="white" stroke-width="0.4"/>');
    o.push('<circle cx="'+jug.x+'" cy="'+jug.y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(rf*0.22).toFixed(2)+'"/>');
    if(jug.num)o.push('<text x="'+jug.x+'" y="'+(parseFloat(jug.y)+rf*0.38).toFixed(2)+'" text-anchor="middle" fill="'+textC+'" font-size="'+(rf*0.95).toFixed(1)+'" font-weight="900" font-family="Barlow Condensed,sans-serif" style="pointer-events:none;">'+jug.num+'</text>');
    /* nombre encima */
    if(isXI&&jug.nombre&&jug.nombre.trim()){
      o.push('<text x="'+jug.x+'" y="'+(parseFloat(jug.y)-rf-0.8).toFixed(2)+'" text-anchor="middle" fill="'+nameC+'" font-size="'+(rf*0.68).toFixed(1)+'" font-weight="700" font-family="Barlow Condensed,sans-serif" style="pointer-events:none;" paint-order="stroke" stroke="rgba(0,0,0,0.85)" stroke-width="0.6">'+jug.nombre.toUpperCase()+'</text>');
    }
    /* iconos debajo — en filas de 4 */
    if(jug.iconos&&jug.iconos.length){
      var IMAP={capitan:'C',goleador:'⚽',desequil:'⚡',potente:'>>',aereo:'↑',buen_pie:'~',box2box:'↔',abp:'🎯',presion:'X',movilidad:'∞',temperamental:'🔥',destac:'★'};
      var icos=jug.iconos;
      for(var row=0;row*4<icos.length;row++){
        var rowIcos=icos.slice(row*4,(row+1)*4).map(function(k){return IMAP[k]||k;}).join(' ');
        o.push('<text x="'+jug.x+'" y="'+(parseFloat(jug.y)+rf+1.5+row*(rf*0.7)).toFixed(2)+'" text-anchor="middle" fill="'+stroke+'" font-size="'+(rf*0.6).toFixed(1)+'" font-family="sans-serif" style="pointer-events:none;">'+rowIcos+'</text>');
      }
    }
    o.push('</g>');
  });

  o.push('</svg>');
  wrap.innerHTML=o.join('');

  /* bind events */
  var svg=wrap.querySelector('svg');
  if(svg){
    svg.addEventListener('mousedown',onSvgDown,{passive:false});
    svg.addEventListener('mousemove',onSvgMove,{passive:false});
    svg.addEventListener('mouseup',onSvgUp,{passive:false});
    svg.addEventListener('mouseleave',onSvgUp,{passive:false});
    svg.addEventListener('touchstart',function(e){e.preventDefault();onSvgDown(e);},{passive:false});
    svg.addEventListener('touchmove',function(e){e.preventDefault();onSvgMove(e);},{passive:false});
    svg.addEventListener('touchend',function(e){e.preventDefault();onSvgUp(e);},{passive:false});
  }
}

/* ════════════════════════════════════════════
   SVG COORDS
════════════════════════════════════════════ */
function svgPt(e,svg){
  var pt=svg.createSVGPoint();
  var src=e.touches?e.touches[0]:e;
  pt.x=src.clientX;pt.y=src.clientY;
  var inv=svg.getScreenCTM().inverse();
  return pt.matrixTransform(inv);
}

/* ════════════════════════════════════════════
   EVENTOS CAMPO
════════════════════════════════════════════ */
function onSvgDown(e){
  var svg=e.currentTarget||e.target.closest('svg');if(!svg)return;
  var ck=svg.dataset.ck;if(!ck)return;
  var pt=svgPt(e,svg);

  /* MODO DIBUJO */
  if(drawMode){
    e.preventDefault();
    drawStart={x:pt.x,y:pt.y,campoKey:ck};
    return;
  }

  /* MODO SELECT */
  e.preventDefault();
  var g=e.target.closest('.jug-g');
  if(g){
    var ji=parseInt(g.dataset.ji);
    var multiKey=e.shiftKey||e.ctrlKey||e.metaKey;
    if(multiKey){
      toggleSel(ck,ji);
    } else {
      if(!isSelected(ck,ji)){clearSel();addSel(ck,ji);}
    }
    /* init drag */
    var jugs=getJugs(ck);
    var origPositions=selSet.filter(function(s){return s.campoKey===ck;}).map(function(s){
      return {idx:s.idx,x:jugs[s.idx].x,y:jugs[s.idx].y};
    });
    dragState={campoKey:ck,startX:pt.x,startY:pt.y,origPositions:origPositions};
    /* re-render sidebar edit panel */
    _refreshEditPanel(ck);
    renderCampo(ck);
  } else {
    /* click en vacío — deselect */
    if(!e.shiftKey&&!e.ctrlKey&&!e.metaKey){clearSel();}
    dragState=null;
    _refreshEditPanel(ck);
    renderCampo(ck);
  }
}

function onSvgMove(e){
  if(!dragState&&!drawStart)return;
  var svg=e.currentTarget||e.target.closest('svg');if(!svg)return;
  var pt=svgPt(e,svg);
  e.preventDefault();

  if(dragState&&dragState.campoKey===svg.dataset.ck){
    var dx=pt.x-dragState.startX, dy=pt.y-dragState.startY;
    var jugs=getJugs(dragState.campoKey);
    dragState.origPositions.forEach(function(op){
      if(jugs[op.idx]){
        jugs[op.idx].x=parseFloat((op.x+dx).toFixed(2));
        jugs[op.idx].y=parseFloat((op.y+dy).toFixed(2));
      }
    });
    renderCampo(dragState.campoKey);
  }
}

function onSvgUp(e){
  var svg=e.currentTarget||e.target.closest('svg');
  var ck=svg?svg.dataset.ck:null;

  if(drawStart&&ck===drawStart.campoKey){
    var src=e.touches&&e.touches[0]?e.touches[0]:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e);
    if(svg){
      var pt=svgPt({clientX:src.clientX,clientY:src.clientY},svg);
      var dx=pt.x-drawStart.x,dy=pt.y-drawStart.y;
      if(Math.sqrt(dx*dx+dy*dy)>2){
        var d=getCampo(ck);
        var colorEl=document.getElementById('xi-arrowcol');
        d.arrows=d.arrows||[];
        d.arrows.push({x1:parseFloat(drawStart.x.toFixed(2)),y1:parseFloat(drawStart.y.toFixed(2)),
          x2:parseFloat(pt.x.toFixed(2)),y2:parseFloat(pt.y.toFixed(2)),
          type:drawMode,color:colorEl?colorEl.value:'#ff3333',sw:0.7});
        saveCampos();renderCampo(ck);
      }
    }
    drawStart=null;return;
  }

  if(dragState){saveCampos();}
  dragState=null;
}

/* ════════════════════════════════════════════
   DRAW MODE
════════════════════════════════════════════ */
function setDrawMode(mi){
  var modes=[null,'solid','dashed','dotted'];
  drawMode=typeof mi==='number'?modes[mi]||null:mi;
  drawStart=null;
  ['solid','dashed','dotted'].forEach(function(m){
    var b=document.getElementById('btn-draw-'+m);
    if(b)b.classList.toggle('active',drawMode===m);
  });
}

function delLastArrow(ck){
  var d=getCampo(ck);if(d.arrows&&d.arrows.length){d.arrows.pop();saveCampos();renderCampo(ck);}
}

/* ════════════════════════════════════════════
   JUGADORES
════════════════════════════════════════════ */
function aplicarSistemaXI(isRival){
  var inf=getInf(currentId);if(!inf)return;
  var key=inf.id+'_xi';
  var isXI=true;
  var VW=105,VH=68,P=4,fw=VW-P*2,fh=VH-P*2;
  var sys=document.getElementById('xi-sys').value;
  var rows=SISTEMAS[sys];if(!rows)return;
  var cj=document.getElementById(isRival?'xi-cjr':'xi-cj').value;
  var cf=document.getElementById(isRival?'xi-cfr':'xi-cf').value;
  var d=getCampo(key);
  if(!isRival)d.jugs=d.jugs.filter(function(j){return !(j.fill===cf&&j.stroke===cj);});
  var startD=isRival?d.jugs.length:0;
  var di=0;
  rows.forEach(function(row,ri){
    var xPct=0.07+ri*(0.86/(rows.length-1));
    var fx=parseFloat((P+fw*xPct).toFixed(2));
    row.forEach(function(_,ci){
      var fy=parseFloat((P+fh*((ci+1)/(row.length+1))).toFixed(2));
      d.jugs.push({x:fx,y:fy,num:String(DORSAL[startD+di]||startD+di+1),stroke:cj,fill:cf,nombre:'',iconos:[],sizeF:1});
      di++;
    });
  });
  clearSel();saveCampos();renderEditor();
}

function addJugador(key,modo){
  var isXI=modo==='xi';
  var VW=isXI?105:68,VH=isXI?68:105;
  var d=getCampo(key);
  var jug={x:parseFloat((VW/2).toFixed(1)),y:parseFloat((VH/2).toFixed(1)),
    num:String(d.jugs.length+1),stroke:'#C8A84B',fill:'#1B2A6B',nombre:'',iconos:[],sizeF:1};
  d.jugs.push(jug);
  clearSel();addSel(key,d.jugs.length-1);
  saveCampos();renderEditor();
}

function delSelJugs(key){
  var d=getCampo(key);
  var idxs=selSet.filter(function(s){return s.campoKey===key;}).map(function(s){return s.idx;}).sort(function(a,b){return b-a;});
  idxs.forEach(function(idx){d.jugs.splice(idx,1);});
  clearSel();saveCampos();renderEditor();
}

function selectPlayer(key,ji,e){
  if(e&&(e.shiftKey||e.ctrlKey||e.metaKey)){toggleSel(key,ji);}
  else{clearSel();addSel(key,ji);}
  renderEditor();
}

function savePlayerName(inp){
  var ck=inp.dataset.ck,ji=parseInt(inp.dataset.ji);
  var jugs=getJugs(ck);
  if(jugs[ji])jugs[ji].nombre=inp.value.trim().toUpperCase();
  saveCampos();renderCampo(ck);
}

function setSelProp(key,prop,val){
  selSet.filter(function(s){return s.campoKey===key;}).forEach(function(s){
    var jug=getJugs(key)[s.idx];if(jug)jug[prop]=val;
  });
  saveCampos();renderEditor();
}

function toggleIcono(btn){
  var ck=btn.dataset.ck,k=btn.dataset.ikey;
  selSet.filter(function(s){return s.campoKey===ck;}).forEach(function(s){
    var jug=getJugs(ck)[s.idx];if(!jug)return;
    if(!jug.iconos)jug.iconos=[];
    var idx=jug.iconos.indexOf(k);
    if(idx>=0)jug.iconos.splice(idx,1);else jug.iconos.push(k);
  });
  saveCampos();renderEditor();
}

function _refreshEditPanel(ck){
  /* Called after selection change — just re-render editor for now */
  renderEditor();
}

/* ════════════════════════════════════════════
   MOMENTOS / NOTAS / ALINEACIONES
════════════════════════════════════════════ */
function switchMom(btn){
  document.querySelectorAll('.mom-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.mom-panel').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  var p=document.getElementById('mpanel-'+btn.dataset.mk);if(p)p.classList.add('active');
  /* render campos del panel activo */
  if(currentId){
    var mk=btn.dataset.mk;
    renderCampo(currentId+'_mom_'+mk+'_1');
    renderCampo(currentId+'_mom_'+mk+'_2');
  }
}
function saveMom(el){
  var inf=getInf(currentId);if(!inf)return;
  if(!inf.momentos)inf.momentos={};
  if(!inf.momentos[el.dataset.mk])inf.momentos[el.dataset.mk]={};
  inf.momentos[el.dataset.mk][el.dataset.mf]=el.value;
  saveInformes();
}
function saveNota(el){var inf=getInf(currentId);if(!inf)return;if(!inf.notas)inf.notas={};inf.notas[el.dataset.nk]=el.value;saveInformes();}
function saveAlin(inp){var inf=getInf(currentId);if(!inf)return;var ai=parseInt(inp.dataset.ai);if(!inf.alineaciones[ai])return;inf.alineaciones[ai][inp.dataset.k]=inp.value;saveInformes();}
function addAlin(){var inf=getInf(currentId);if(!inf)return;if(!inf.alineaciones)inf.alineaciones=[];inf.alineaciones.push({jornada:'J'+(inf.alineaciones.length+1),rival:'',resultado:''});saveInformes();renderEditor();}
function delAlin(ai){var inf=getInf(currentId);if(!inf)return;inf.alineaciones.splice(ai,1);saveInformes();renderEditor();}

/* ════════════════════════════════════════════
   ESCUDOS
════════════════════════════════════════════ */
function subirEscLocal(){document.getElementById('f-esc-local').click();}
function subirEscRival(){document.getElementById('f-esc-rival').click();}
function _resizeImg(file,cb){
  var r=new FileReader();r.onload=function(ev){
    var img=new Image();img.onload=function(){
      var MAX=120,c=document.createElement('canvas');
      var w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=h*MAX/w;w=MAX;}}else{if(h>MAX){w=w*MAX/h;h=MAX;}}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/png'));
    };img.src=ev.target.result;
  };r.readAsDataURL(file);
}
function fileEscLocal(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  _resizeImg(f,function(d){
    var inf=getInf(currentId);if(!inf)return;
    if(inf.nuestroEquipo!==false){localStorage.setItem('oi_team_crest',d);}
    else{inf.localCrest=d;saveInformes();}
    _loadEsc('esc-local',d);
  });
}
function fileEscRival(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  _resizeImg(f,function(d){
    var inf=getInf(currentId);if(!inf)return;
    inf.escudoRival=d;saveInformes();_loadEsc('esc-rival',d);
  });
}
function editLocalName(){var inf=getInf(currentId);if(!inf)return;var v=prompt('Nombre equipo local:',inf.localName||'');if(v!==null){inf.localName=v.trim();saveInformes();renderEditor();}}
function editRivalName(){var inf=getInf(currentId);if(!inf)return;var v=prompt('Nombre rival:',inf.rival||'');if(v!==null){inf.rival=v.trim();saveInformes();renderSidebar();renderEditor();}}

/* ════════════════════════════════════════════
   DESDE CALENDARIO
════════════════════════════════════════════ */
function importarCalendario(){
  var evs=JSON.parse(localStorage.getItem('oi_cal_v2')||'{}');
  var partidos=[];
  Object.keys(evs).forEach(function(fecha){
    (evs[fecha]||[]).forEach(function(ev){if(ev.type&&ev.type.startsWith('partido'))partidos.push(Object.assign({},ev,{fecha:fecha}));});
  });
  var lista=document.getElementById('cal-lista');
  if(!partidos.length){lista.innerHTML='<div class="cal-meta" style="padding:20px;text-align:center;">No hay partidos en el calendario</div>';document.getElementById('modal-cal').classList.add('open');return;}
  window._calParts=partidos.sort(function(a,b){return b.fecha.localeCompare(a.fecha);});
  var oc=localStorage.getItem('oi_team_crest');
  lista.innerHTML=window._calParts.map(function(p,pi){
    var localSrc=p.nuestroEquipo!==false?oc:p.localCrest;
    var li=localSrc?'<img src="'+localSrc+'" alt="">':'<span>&#128737;</span>';
    var ri=p.rivalCrest?'<img src="'+p.rivalCrest+'" alt="">':'<span>&#128737;</span>';
    var ln=p.nuestroEquipo!==false?'Nuestro equipo':(p.localName||'Local');
    return '<div class="cal-item" onclick="crearDesdeCalendario('+pi+')">'
      +'<div class="cal-teams">'+li+'<span class="cal-team-name">'+esc(ln)+'</span><span class="cal-vs">VS</span>'+ri+'<span class="cal-team-name">'+esc(p.rival||'Visitante')+'</span></div>'
      +'<div class="cal-meta">'+(p.fecha||'')+(p.hora?' · '+p.hora:'')+' · '+(p.competicion||'')+'</div>'
      +'</div>';
  }).join('');
  document.getElementById('modal-cal').classList.add('open');
}
function crearDesdeCalendario(pi){
  var p=window._calParts[pi];if(!p)return;
  document.getElementById('modal-cal').classList.remove('open');
  var id='inf_'+Date.now();
  informes.unshift({id:id,nombre:'',rival:p.rival||'',localName:p.localName||'',
    localCrest:p.localCrest||null,escudoRival:p.rivalCrest||null,
    nuestroEquipo:p.nuestroEquipo!==false,
    fecha:p.fecha||'',hora:p.hora||'',jornada:'',
    competicion:p.competicion||'Amistoso',sede:p.sede||'Local',campo:'',resultado:'',
    momentos:{},notas:{},alineaciones:[]});
  saveInformes();abrirInforme(id);
}

function selPlRow(el,e){selectPlayer(el.dataset.ck,parseInt(el.dataset.ji),e);}

/* ── MINI CAMPO HELPERS ── */
var _miniDrawMode = {}; /* {campoKey: mode} */

function addMiniJugador(ck){
  var d=getCampo(ck);
  var VW=68,VH=105;
  d.jugs.push({x:parseFloat((VW/2).toFixed(1)),y:parseFloat((VH/2).toFixed(1)),
    num:String(d.jugs.length+1),stroke:'#C8A84B',fill:'#1B2A6B',nombre:'',iconos:[],sizeF:1});
  clearSel();addSel(ck,d.jugs.length-1);
  saveCampos();renderCampo(ck);
}

function setMiniSistema(ck){
  var sys=prompt('Sistema (ej: 1-4-3-3):','1-4-3-3');
  if(!sys||!SISTEMAS[sys]){alert('Sistema no válido');return;}
  var d=getCampo(ck);d.jugs=[];
  var rows=SISTEMAS[sys],VW=68,VH=105,P=3,fw=VW-P*2,fh=VH-P*2;
  var di=0;
  rows.forEach(function(row,ri){
    var yPct=0.07+ri*(0.86/(rows.length-1));
    var fy=parseFloat((P+fh*yPct).toFixed(2));
    row.forEach(function(_,ci){
      var fx=parseFloat((P+fw*((ci+1)/(row.length+1))).toFixed(2));
      d.jugs.push({x:fx,y:fy,num:String(DORSAL[di]||di+1),stroke:'#C8A84B',fill:'#1B2A6B',nombre:'',iconos:[],sizeF:1});
      di++;
    });
  });
  saveCampos();renderCampo(ck);
}

function setMiniDraw(ck,mode){
  _miniDrawMode[ck]=mode;
  /* Update draw state if this campo is active */
  if(drawStart&&drawStart.campoKey===ck)drawStart=null;
  drawMode=mode;
}

function delMiniLast(ck){
  delLastArrow(ck);
}

/* Override onSvgDown to use per-campo drawMode */
var _baseOnSvgDown=onSvgDown;
onSvgDown=function(e){
  var svg=e.currentTarget;
  if(!svg)return;
  var ck=svg.dataset.ck;
  if(ck&&_miniDrawMode[ck]!==undefined){
    drawMode=_miniDrawMode[ck];
  }
  _baseOnSvgDown(e);
};

init();
/* Override onSvgDown to use per-campo drawMode */
var _baseOnSvgDown=onSvgDown;
onSvgDown=function(e){
  var svg=e.currentTarget;
  if(!svg)return;
  var ck=svg.dataset.ck;
  if(ck&&_miniDrawMode[ck]!==undefined){
    drawMode=_miniDrawMode[ck];
  }
  _baseOnSvgDown(e);
};

init();
