<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Once Inicial · Datos · Objetivos Individuales</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0d1a4a;--navy2:#1B2A6B;--gold:#C8A84B;
  --surface:#0c1828;--surface2:#0f1e30;--bg:#080e1a;--bg2:#0a1020;
  --border:rgba(200,168,75,0.15);--border2:rgba(200,168,75,0.3);
  --text:#c8c0b0;--text2:#8890a0;--text3:#556070;
  --radius:6px;--radius-lg:10px;
}

@media screen{
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;}
}

/* ── BARRA SUPERIOR (igual que el resto de pantallas) ── */
.oi-topnav{
  height:52px;background:#0d1530 !important;
  border-bottom:2px solid #C8A84B !important;
  display:flex !important;align-items:center !important;
  padding:0 14px !important;gap:10px !important;
  flex-shrink:0;z-index:200;position:relative;
}
.oi-nav-left{display:flex;align-items:center;gap:10px;text-decoration:none;color:#ddd8cc;min-width:0;}
.oi-logo-circle{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#1B2A6B,#0d1530);
  border:1.5px solid rgba(200,168,75,0.5);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.oi-logo-circle img{width:26px;height:26px;object-fit:contain;}
.oi-nav-text{display:flex;flex-direction:column;line-height:1.15;}
.oi-nav-sub{font-size:8px;letter-spacing:2px;color:#C8A84B;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;}
.oi-nav-main{font-size:14px;font-weight:700;letter-spacing:1.5px;color:#ddd8cc;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;}
.oi-nav-sep{flex:1;}
.oi-nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.oi-nav-crest{
  width:36px;height:36px;border-radius:6px;flex-shrink:0;
  border:1.5px solid rgba(200,168,75,0.3);
  display:flex;align-items:center;justify-content:center;
  background:rgba(200,168,75,0.05);overflow:hidden;
}
.oi-nav-crest img{width:100%;height:100%;object-fit:contain;display:none;}
.oi-nav-crest svg{opacity:0.35;}
.nav-btn{background:rgba(200,168,75,0.1);border:1px solid var(--border2);color:var(--gold);
  padding:6px 14px;border-radius:5px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:5px;}
.nav-btn:hover{background:rgba(200,168,75,0.2);}

/* ── ESTRUCTURA ── */
#app{display:flex;height:calc(100vh - 52px);overflow:hidden;}
#panel{width:230px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;}
.panel-hdr{padding:10px 12px;border-bottom:1px solid var(--border);font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#buscador{margin:8px;padding:6px 9px;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  border-radius:5px;color:var(--text);font-size:12px;font-family:'Barlow',sans-serif;}
#buscador:focus{outline:none;border-color:var(--gold);}
#lista{flex:1;overflow-y:auto;padding:4px 6px 10px;}
.jug{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--radius);cursor:pointer;
  margin-bottom:3px;border:1px solid transparent;transition:all .15s;}
.jug:hover{background:rgba(200,168,75,0.07);border-color:var(--border);}
.jug.activo{background:rgba(27,42,107,0.5);border-color:rgba(200,168,75,0.35);}
.jug-dor{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--gold);
  min-width:22px;text-align:center;}
.jug-nom{font-size:12px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.jug-ok{width:7px;height:7px;border-radius:50%;background:#00B050;flex-shrink:0;}
#ficha{flex:1;overflow-y:auto;min-height:0;}
#vacio{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70%;gap:12px;color:var(--text3);}
#vacio .ic{font-size:46px;opacity:.3;}
#vacio .tx{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;}

/* ── LA HOJA ── */
.hoja{padding:16px 22px 40px;}
.bloque{margin-bottom:12px;}
.banda{background:var(--navy2);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:11px;
  font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:4px 4px 0 0;
  border-bottom:2px solid var(--gold);text-align:center;}
.caja{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 4px 4px;}
.fila{display:grid;align-items:stretch;border-bottom:1px solid rgba(255,255,255,0.06);}
.fila:last-child{border-bottom:none;}
.et{background:var(--navy2);color:var(--gold);font-family:'Barlow Condensed',sans-serif;font-size:10px;
  font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:7px 10px;display:flex;align-items:center;}
.et.oscura{background:#0d1530;color:#fff;}
.val{padding:7px 10px;font-size:12px;color:var(--text);outline:none;min-height:30px;line-height:1.45;}
.val:focus{background:rgba(200,168,75,0.07);}
.val:empty:before{content:attr(data-ph);color:var(--text3);font-style:italic;}
input.val{background:transparent;border:0;width:100%;box-sizing:border-box;font-family:inherit;
  font-size:12px;color:var(--text);outline:none;letter-spacing:.5px;}
input.val::placeholder{color:var(--text3);font-style:italic;letter-spacing:0;}
input.val.mal{color:#e05252;}

/* Cabecera de la ficha */
.cab{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:stretch;margin-bottom:12px;}
.cab-foto{border:1px dashed var(--border2);border-radius:var(--radius);display:flex;
  align-items:center;justify-content:center;overflow:hidden;background:rgba(200,168,75,0.04);
  min-height:112px;cursor:pointer;position:relative;}
.cab-foto img{width:100%;height:100%;object-fit:cover;}
.cab-ph{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1.5px;color:var(--text3);
  text-transform:uppercase;text-align:center;padding:6px;}
.cab-centro{display:flex;flex-direction:column;gap:6px;}
.cab-tit{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;letter-spacing:1.5px;
  color:#fff;text-align:center;text-transform:uppercase;}
.quitar-foto{position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:#7a1a1a;
  color:#fff;font-size:11px;line-height:17px;text-align:center;display:none;}
.cab-foto:hover .quitar-foto{display:block;}

/* Dos columnas de aspectos */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media screen and (max-width:1100px){ .dos{grid-template-columns:1fr;} }

/* Tablas */
table.t{width:100%;border-collapse:collapse;}
table.t th{background:var(--navy2);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:10px;
  font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:6px 9px;text-align:left;
  border-bottom:2px solid var(--gold);}
table.t td{border-bottom:1px solid rgba(255,255,255,0.06);padding:0;vertical-align:top;}
table.t td .val{min-height:28px;}
.tnum{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--gold);
  text-align:center;padding:7px 4px;}
.tabs{display:flex;gap:4px;padding:12px 22px 0;border-bottom:1px solid var(--border);}
.tab{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--text2);
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;padding:8px 18px;border-radius:6px 6px 0 0;cursor:pointer;}
.tab:hover{color:var(--text);background:rgba(200,168,75,0.06);}
.tab.sel{color:var(--gold);background:var(--surface);border-color:var(--border);
  box-shadow:inset 0 2px 0 var(--gold);}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 8px;text-align:center;}
.kpi-v{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:#fff;line-height:1;}
.kpi-p{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-top:4px;}
.est{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  padding:1px 5px;border-radius:3px;color:#fff;min-width:20px;text-align:center;}
.est-E{background:#00B050;}.est-L{background:#e05252;}.est-En{background:#27ae60;}
.est-P{background:#7f8c8d;}.est-RA{background:#e67e22;}.est-E2{background:#2980b9;}
.mini{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#fff;
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;padding:2px 7px;border-radius:3px;cursor:pointer;}
.mini:hover{background:rgba(255,255,255,0.25);}
.quitar-fila{background:none;border:none;color:#e05252;cursor:pointer;font-size:12px;padding:6px 8px;opacity:.5;}
.quitar-fila:hover{opacity:1;}

.btn{border-radius:5px;padding:6px 14px;font-size:11px;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;border:1px solid;}
.btn-gold{background:var(--gold);color:#0d1530;border-color:var(--gold);}
.btn-gold:hover{background:#e0c068;}
.btn-ghost{background:transparent;color:var(--text2);border-color:rgba(255,255,255,0.15);}
.btn-ghost:hover{border-color:rgba(255,255,255,0.3);color:var(--text);}

#aviso{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy2);
  border:1px solid var(--gold);color:var(--gold);padding:8px 18px;border-radius:6px;font-size:12px;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:300;}
#aviso.ver{opacity:1;}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(200,168,75,0.2);border-radius:3px;}

/* ══════════ IMPRESIÓN — A4 horizontal, 2 páginas ══════════ */
@media print{
  @page{ size:A4 landscape; margin:5mm; }
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  html,body{ overflow:visible !important; height:auto !important; background:#fff !important; }
  .oi-topnav,#panel,.no-print{ display:none !important; }
  #app{ display:block !important; height:auto !important; overflow:visible !important; }
  #ficha{ overflow:visible !important; height:auto !important; }
  .hoja{ padding:0 !important; }

  /* El número de objetivos es variable, así que la hoja fluye: si no caben
     en una página, siguen en la siguiente en vez de quedarse cortados.
     Lo que no se parte nunca es un bloque ni una fila de tabla. */
  .pag{ width:287mm; min-height:195mm; page-break-after:always;
        overflow:visible; border:1.2pt solid #C8A84B; padding:3mm; box-sizing:border-box; }
  .pag:last-child{ page-break-after:avoid; }
  .bloque, .obj, .cab, table.t tr{ page-break-inside:avoid !important; }
  .kpi{ background:#f3f5fa !important; border-color:rgba(27,42,107,0.25) !important; }
  .kpi-v{ color:#1B2A6B !important; font-size:13pt !important; }
  .kpi-p{ color:#555 !important; font-size:5.5pt !important; }

  /* Oscuro → claro, para no gastar tinta y que se lea */
  .caja{ background:#fff !important; border-color:rgba(27,42,107,0.3) !important; }
  .val{ color:#111 !important; font-size:8.5pt !important; }
  .val:empty:before{ content:'' !important; }
  .et{ background:#e9ecf4 !important; color:#1B2A6B !important; font-size:6.5pt !important; padding:3px 6px !important; }
  .et.oscura{ background:#1B2A6B !important; color:#fff !important; }
  .banda{ background:#1B2A6B !important; color:#fff !important; font-size:7.5pt !important; padding:3px 8px !important; }
  .cab-tit{ color:#1B2A6B !important; font-size:15pt !important; }
  .cab{ grid-template-columns:74px 1fr !important; gap:6px !important; margin-bottom:6px !important; }
  .cab-foto{ min-height:62px !important; border-style:solid !important;
    border-color:rgba(27,42,107,0.25) !important; background:#fff !important; }
  .cab-ph{ display:none !important; }
  table.t th{ background:#1B2A6B !important; color:#fff !important; font-size:6.5pt !important; padding:3px 6px !important; }
  table.t td{ border-color:rgba(27,42,107,0.18) !important; }
  table.t td .val{ min-height:14px !important; }
  .tnum{ color:#1B2A6B !important; font-size:7pt !important; padding:3px !important; }
  .bloque{ margin-bottom:4px !important; }
  /* La hoja impresa mide 287 mm (~1085 px), por debajo del corte de
     pantalla: sin esto los cuatro bloques se apilaban y el cuarto se
     salía de la página. */
  .dos{ grid-template-columns:1fr 1fr !important; gap:6px !important; }
  .fila .val{ min-height:14px !important; padding:3px 6px !important; }
}
@media screen{ .pag{ display:block; } }

/* ── Ventana (actas) ── */
#velo{position:fixed;inset:0;background:rgba(6,10,20,.74);z-index:60;display:none;align-items:center;justify-content:center;padding:16px;}
#velo.ver{display:flex;}
.mdl{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:min(560px,94vw);max-height:84vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.6);}
.mdl-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);
  font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);}
.mdl-x{background:none;border:0;color:var(--text3);font-size:21px;line-height:1;cursor:pointer;padding:0 2px;}
.mdl-x:hover{color:var(--text);}
.mdl-cnt{padding:14px;}
.acta-f{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:5px;margin-bottom:6px;font-size:12px;}
.acta-f b{font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.04em;color:var(--gold);}
.acta-f .quien{margin-left:auto;color:var(--text3);font-size:11px;}
.acta-x{background:none;border:0;color:#e05252;cursor:pointer;font-size:16px;line-height:1;padding:0 2px;}
.elige{display:flex;gap:8px;}
.elige button{flex:1;padding:10px 8px;}
@media print{ #velo{display:none !important;} }
</style>

<script>
// ══════════════════════════════════════════════════════════════
//  DATOS · OBJETIVOS INDIVIDUALES (OOII)
//  Una ficha por jugador, con la misma estructura que la planilla
//  de Excel de Iván: datos personales, a destacar / a mejorar,
//  cuatro aspectos con sus tres "por qués", reuniones con feedback
//  y seguimiento por jornada.
//  Se guarda en 'oi_ooii' (una entrada por jugador) y sube a la
//  nube con el mismo motor que la pizarra y la sesión.
// ══════════════════════════════════════════════════════════════

const K_OOII='oi_ooii';          // objetivos individuales, por jugador
const K_FICHAS='oi_fichas';      // ficha del jugador, compartida por toda la app
let jugadores=[], ooii={}, fichas={}, actual=null, tab='ficha', tGuardar=null;

function lee(k,pordef){ try{ const v=JSON.parse(localStorage.getItem(k)||'null'); return v==null?pordef:v; }catch(e){ return pordef; } }
function avisa(t){ const a=document.getElementById('aviso'); a.textContent=t; a.classList.add('ver'); setTimeout(()=>a.classList.remove('ver'),1600); }
function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function sinTildes(x){ return String(x==null?'':x).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim(); }

// ── Plantilla ──────────────────────────────────────────────────
// Se usa la misma que la planilla de sesión (pz_players). A cada
// jugador se le pone un id estable la primera vez, para que su
// ficha no se pierda si le cambias el dorsal o corriges el nombre.
function cargaPlantilla(){
  jugadores = lee('pz_players',[]) || [];
  if(!Array.isArray(jugadores)) jugadores=[];
  let nuevos=false;
  jugadores.forEach(p=>{ if(!p.id){ p.id='j'+Math.random().toString(36).slice(2,9); nuevos=true; } });
  if(nuevos) localStorage.setItem('pz_players',JSON.stringify(jugadores));
  const nom=localStorage.getItem('pz_plantilla_nombre')||'';
  document.getElementById('pl-nombre').textContent = nom || 'Plantilla';
  document.getElementById('pl-cuantos').textContent = jugadores.length;
}

function cargaOoii(){ ooii = lee(K_OOII,{}) || {}; }
function cargaFichas(){ fichas = lee(K_FICHAS,{}) || {}; }
function guardaFichas(){
  try{ localStorage.setItem(K_FICHAS,JSON.stringify(fichas)); }
  catch(e){ avisa('No se ha podido guardar: falta espacio'); }
}

// La ficha del jugador. Es la fuente única: la foto, el mote, las
// posiciones y el carácter se escriben aquí y los objetivos los leen de
// aquí, para que no haya dos versiones de lo mismo por la app.
function datosNuevos(){
  return {foto:'', mote:'', posiciones:'', hobbies:'', nacimiento:'', nacionalidad:'',
          altura:'', peso:'', pie:'', procedencia:'', telefono:'', email:'',
          defectos:'', virtudes:'', razones:'', notas:''};
}
function datosDe(id){
  if(!fichas[id]){
    fichas[id]=datosNuevos();
    // Lo que antes vivía dentro de los objetivos se trae aquí una vez.
    const v=ooii[id];
    if(v){
      ['foto','mote','posiciones','hobbies','defectos','virtudes','razones'].forEach(k=>{
        if(v[k]) fichas[id][k]=v[k];
      });
      fichas[id].__migF=true;
    }
  }
  return fichas[id];
}
function guardaOoii(){
  try{ localStorage.setItem(K_OOII,JSON.stringify(ooii)); }
  catch(e){ avisa('No se ha podido guardar: falta espacio'); }
}
function guardaPronto(){
  if(tGuardar) clearTimeout(tGuardar);
  tGuardar=setTimeout(()=>{ guardaOoii(); pintaLista(document.getElementById('buscador').value); }, 450);
}

// Ficha vacía
function fichaNueva(){
  return {
    foto:'', ct:'', temporada:'', mote:'', posiciones:'', hobbies:'',
    defectos:'', virtudes:'', razones:'',
    destJug:'', mejJug:'', destCT:'', mejCT:'',
    objetivos:[objetivoNuevo()],
    reuniones:[{fecha:'',proxima:'',feedback:''}],
    jornadas:[]
  };
}
function vacioAspecto(){ return {titulo:'',a:'',b:'',c:''}; }
function hoyISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function objetivoNuevo(){
  return {id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
          titulo:'',a:'',b:'',c:'',estado:'activo',alta:hoyISO(),logro:'',nota:''};
}
function fichaDe(id){
  if(!ooii[id]) ooii[id]=fichaNueva();
  const f=ooii[id];
  // Las fichas antiguas tenían cuatro aspectos fijos; se pasan a la lista
  // de objetivos sin tocar el campo viejo, por si acaso.
  if(!Array.isArray(f.objetivos)){
    const v=(Array.isArray(f.aspectos)?f.aspectos:[])
      .filter(a=>a && ((a.titulo||'')+(a.a||'')+(a.b||'')+(a.c||'')).trim())
      .map(a=>Object.assign(objetivoNuevo(),{titulo:a.titulo||'',a:a.a||'',b:a.b||'',c:a.c||''}));
    f.objetivos = v.length?v:[objetivoNuevo()];
    f.__mig = true;   // para guardarlo en cuanto se abra la ficha
  }
  f.objetivos.forEach(o=>{ if(!o.id) o.id='o'+Math.random().toString(36).slice(2,9);
                           if(!o.estado) o.estado='activo'; });
  if(!Array.isArray(f.reuniones)) f.reuniones=[{fecha:'',proxima:'',feedback:''}];
  if(!Array.isArray(f.jornadas)) f.jornadas=[];
  return f;
}
// ¿Tiene algo escrito? (para el puntito verde de la lista)
function tieneAlgo(id){
  const d=fichas[id]||{};
  const f=ooii[id]; if(!f && !Object.keys(d).length) return false;
  if([d.foto,d.mote,d.defectos,d.virtudes,d.razones,d.nacimiento].join('').trim()) return true;
  if(!f) return false;
  const txt=[f.defectos,f.virtudes,f.razones,f.destJug,f.mejJug,f.destCT,f.mejCT]
    .concat((f.objetivos||[]).map(a=>a&&a.titulo))
    .join('').trim();
  return !!txt;
}

// ── Lista de la plantilla ──────────────────────────────────────
function pintaLista(filtro){
  const c=document.getElementById('lista'); c.innerHTML='';
  const f=sinTildes(filtro||'');
  const vis=jugadores.filter(p=>!f || sinTildes(p.name).indexOf(f)>=0 || String(p.num).indexOf(f)>=0);
  if(!jugadores.length){
    c.innerHTML='<div style="padding:16px 10px;text-align:center;font-size:11px;color:var(--text3);line-height:1.6;">'
      +'No hay plantilla.<br>Cárgala desde la <a href="sesion.html" style="color:var(--gold);">planilla de sesión</a>.</div>';
    return;
  }
  if(!vis.length){ c.innerHTML='<div style="padding:16px 10px;text-align:center;font-size:11px;color:var(--text3);">Ningún jugador coincide.</div>'; return; }
  vis.forEach(p=>{
    const d=document.createElement('div');
    d.className='jug'+(actual===p.id?' activo':'');
    d.onclick=()=>abre(p.id);
    d.innerHTML='<span class="jug-dor">'+esc(p.num)+'</span>'
      +'<span class="jug-nom">'+esc(p.name||'(sin nombre)')+'</span>'
      +(tieneAlgo(p.id)?'<span class="jug-ok" title="Con objetivos"></span>':'');
    c.appendChild(d);
  });
}

// ── Abrir la ficha de un jugador ───────────────────────────────
function veTab(t){ tab=t; pintaFicha(); }

function abre(id){
  actual=id;
  const f=fichaDe(id);
  if(f.__mig){ delete f.__mig; guardaOoii(); }
  const d=datosDe(id);
  if(d.__migF){ delete d.__migF; guardaFichas(); }
  document.getElementById('vacio').style.display='none';
  document.getElementById('hoja').style.display='';
  document.getElementById('btn-imp').style.display='';
  pintaLista(document.getElementById('buscador').value);
  pintaFicha();
}

// Campo que escribe en la FICHA del jugador (compartida)
function campoF(ruta, ph, estilo){
  const v=valorEn(datosDe(actual),ruta);
  return '<div class="val" contenteditable="true" data-ph="'+esc(ph||'')+'"'
    +(estilo?' style="'+estilo+'"':'')
    +' oninput="ponF(\''+ruta+'\', this.textContent)">'+esc(v)+'</div>';
}
function valorEn(o,ruta){
  const p=ruta.split('.');
  for(let i=0;i<p.length;i++){
    const k=/^\d+$/.test(p[i])?parseInt(p[i],10):p[i];
    if(o==null) return ''; o=o[k];
  }
  return o==null?'':o;
}
function ponF(ruta,valor){
  const d=datosDe(actual); let o=d;
  const p=ruta.split('.');
  for(let i=0;i<p.length-1;i++){
    const k=p[i]; if(o[k]==null) o[k]={}; o=o[k];
  }
  o[p[p.length-1]]=valor;
  if(tGuardar) clearTimeout(tGuardar);
  tGuardar=setTimeout(()=>{ guardaFichas(); pintaLista(document.getElementById('buscador').value); },450);
}

// Campo que escribe en los OBJETIVOS
function campo(ruta, ph, estilo){
  const v=valorDe(ruta);
  return '<div class="val" contenteditable="true" data-ph="'+esc(ph||'')+'"'
    +(estilo?' style="'+estilo+'"':'')
    +' oninput="pon(\''+ruta+'\', this.textContent)">'+esc(v)+'</div>';
}
function valorDe(ruta){
  const f=fichaDe(actual); let o=f;
  const p=ruta.split('.');
  for(let i=0;i<p.length;i++){
    const k=/^\d+$/.test(p[i])?parseInt(p[i],10):p[i];
    if(o==null) return ''; o=o[k];
  }
  return o==null?'':o;
}
function pon(ruta,valor){
  const f=fichaDe(actual); let o=f;
  const p=ruta.split('.');
  for(let i=0;i<p.length-1;i++){
    const k=/^\d+$/.test(p[i])?parseInt(p[i],10):p[i];
    if(o[k]==null) o[k]={};
    o=o[k];
  }
  const ult=p[p.length-1];
  o[/^\d+$/.test(ult)?parseInt(ult,10):ult]=valor;
  guardaPronto();
}

function fechaCorta(iso){
  if(!iso) return '';
  const p=String(iso).slice(0,10).split('-');
  return p.length===3 ? (p[2]+'/'+p[1]+'/'+p[0].slice(2)) : iso;
}

// ── Conseguir, reabrir y quitar ──
function consigue(i){
  const f=fichaDe(actual), o=f.objetivos[i]; if(!o) return;
  if(!(o.titulo||'').trim()){ avisa('Escribe primero el objetivo'); return; }
  if(!confirm('¿Dar por conseguido "'+o.titulo+'"?\nPasa a la lista de conseguidos y se puede reabrir.')) return;
  o.estado='conseguido'; o.logro=hoyISO();
  if(!f.objetivos.some(x=>x.estado==='activo')) f.objetivos.push(objetivoNuevo());
  guardaOoii(); pintaFicha(); pintaLista(document.getElementById('buscador').value);
  avisa('Objetivo conseguido');
}
function reabre(id){
  const f=fichaDe(actual), o=f.objetivos.find(x=>x.id===id); if(!o) return;
  o.estado='activo'; o.logro='';
  guardaOoii(); pintaFicha(); avisa('Objetivo reabierto');
}
function masObjetivo(){
  fichaDe(actual).objetivos.push(objetivoNuevo());
  guardaOoii(); pintaFicha();
}
function quitaObjetivo(i){
  const f=fichaDe(actual), o=f.objetivos[i]; if(!o) return;
  if(!confirm('¿Quitar este objetivo del todo?\nSi lo que quieres es archivarlo, usa "Conseguido".')) return;
  f.objetivos.splice(i,1);
  if(!f.objetivos.some(x=>x.estado==='activo')) f.objetivos.push(objetivoNuevo());
  guardaOoii(); pintaFicha(); pintaLista(document.getElementById('buscador').value);
}
function borraConseguido(id){
  const f=fichaDe(actual);
  const o=f.objetivos.find(x=>x.id===id); if(!o) return;
  if(!confirm('¿Borrar del historial "'+o.titulo+'"?\nEsto sí que no se puede deshacer.')) return;
  f.objetivos=f.objetivos.filter(x=>x.id!==id);
  guardaOoii(); pintaFicha();
}

function pintaFicha(){
  const p=jugadores.find(x=>x.id===actual); if(!p) return;
  const h=document.getElementById('hoja');
  const pestanas=[['ficha','Ficha'],['ooii','Objetivos'],['entrenos','Entrenamientos'],['partidos','Partidos']];
  let html='<div class="tabs no-print">'
    +pestanas.map(x=>'<button class="tab'+(tab===x[0]?' sel':'')+'" onclick="veTab(\''+x[0]+'\')">'+x[1]+'</button>').join('')
    +'</div>';
  if(tab==='ficha')      html+=hojaFicha(p);
  else if(tab==='entrenos') html+=hojaEntrenos(p);
  else if(tab==='partidos') html+=hojaPartidos(p);
  else                   html+=hojaOoii(p);
  h.innerHTML=html;
}

// ══════════ PESTAÑA · FICHA DEL JUGADOR ══════════
function edad(iso){
  if(!iso) return '';
  const d=new Date(iso); if(isNaN(d)) return '';
  const h=new Date(); let a=h.getFullYear()-d.getFullYear();
  const m=h.getMonth()-d.getMonth();
  if(m<0 || (m===0 && h.getDate()<d.getDate())) a--;
  return (a>=0&&a<120)? a+' años' : '';
}
// ── Fecha de nacimiento ────────────────────────────────────────
// Se escribe en día/mes/año y las barras las pone la propia casilla.
// Por dentro se guarda en AAAA-MM-DD, que es lo que sabe restar edad(),
// y la edad se refresca en cuanto la fecha está completa.
function aDMA(v){
  const s=String(v||'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return ('0'+m[3]).slice(-2)+'/'+('0'+m[2]).slice(-2)+'/'+m[1];
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m) return ('0'+m[1]).slice(-2)+'/'+('0'+m[2]).slice(-2)+'/'+m[3];
  return '';
}
function aISO(dma){
  const m=String(dma||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return '';
  const dd=+m[1], mm=+m[2], aa=+m[3];
  if(mm<1||mm>12||dd<1||dd>31||aa<1900) return '';
  const f=new Date(Date.UTC(aa,mm-1,dd));
  if(f.getUTCDate()!==dd||f.getUTCMonth()!==mm-1||f.getUTCFullYear()!==aa) return '';
  if(f.getTime()>Date.now()) return '';
  return m[3]+'-'+m[2]+'-'+m[1];
}
let nacPrev='';   // la última fecha buena, para no perderla a medio escribir
function campoNacimiento(d){
  nacPrev = d.nacimiento||'';
  return '<input class="val" id="f-nac" type="text" inputmode="numeric" maxlength="10"'
    +' placeholder="DD/MM/AAAA" value="'+esc(aDMA(d.nacimiento))+'"'
    +' oninput="escribeNac(this)" onblur="cierraNac(this)">';
}
function ponEdad(iso){
  const e=document.getElementById('f-edad');
  if(e) e.textContent = iso ? edad(iso) : '';
}
function escribeNac(el){
  const alFinal = el.selectionStart===el.value.length;
  const n=el.value.replace(/\D/g,'').slice(0,8);   // sólo números: las barras las pone ella
  let t=n;
  if(n.length>4) t=n.slice(0,2)+'/'+n.slice(2,4)+'/'+n.slice(4);
  else if(n.length>2) t=n.slice(0,2)+'/'+n.slice(2);
  el.value=t;
  if(alFinal) el.setSelectionRange(t.length,t.length);
  const iso=aISO(t);
  if(iso){ nacPrev=iso; ponF('nacimiento',iso); ponEdad(iso); }
  else if(!t){ nacPrev=''; ponF('nacimiento',''); ponEdad(''); }
  // a medio escribir no se toca lo guardado: así no se pierde al corregir
  el.classList.toggle('mal', t.length===10 && !iso);
}
function cierraNac(el){
  if(!el.value || aISO(el.value)){ el.classList.remove('mal'); return; }
  avisa('La fecha va en día/mes/año: 14/03/1998');
  el.value=aDMA(nacPrev); el.classList.remove('mal');
  ponF('nacimiento',nacPrev); ponEdad(nacPrev);
}

// ══════════ PESTAÑA · ENTRENAMIENTOS ══════════
// Todo sale de las sesiones ya guardadas (pz_sessions): no hay que
// meter nada a mano. Cada sesión guarda su propia copia de la plantilla
// y la asistencia por dorsal, así que al jugador se le busca primero por
// id, luego por nombre y, en último caso, por dorsal.
const ESTADOS={E:'Entrena',L:'Lesión',En:'Enfermo',P:'Permiso',RA:'Readaptando',E2:'Otro equipo'};
function sesionesGuardadas(){
  const a=lee('pz_sessions',[]); return Array.isArray(a)?a:[];
}
function dorsalEnSesion(s,p){
  const lista=Array.isArray(s.players)&&s.players.length?s.players:null;
  if(lista){
    let q=lista.find(x=>x.id&&x.id===p.id);
    if(!q) q=lista.find(x=>sinTildes(x.name)&&sinTildes(x.name)===sinTildes(p.name));
    if(!q) q=lista.find(x=>String(x.num)===String(p.num));
    return q?String(q.num):null;
  }
  return String(p.num);
}
function minutosDe(s){
  let min=0, carga=0;
  (s.taskIds||[]).forEach(t=>{
    const d=(s.taskData||{})[t]||{};
    min  += parseFloat(d.tiempo)||0;
    carga+= parseFloat(d.carga)||0;
  });
  return {min:min, carga:carga};
}
function resumenEntrenos(p){
  const r={total:0, porEstado:{}, minutos:0, carga:0, filas:[]};
  Object.keys(ESTADOS).forEach(k=>r.porEstado[k]=0);
  sesionesGuardadas().forEach(s=>{
    const dor=dorsalEnSesion(s,p);
    if(dor===null) return;
    const st=(s.attendance||{})[dor];
    if(st===undefined) return;          // esa sesión no le incluía
    r.total++;
    if(r.porEstado[st]===undefined) r.porEstado[st]=0;
    r.porEstado[st]++;
    const m=minutosDe(s);
    if(st==='E'){ r.minutos+=m.min; r.carga+=m.carga; }
    r.filas.push({id:s.id, num:s.num, fecha:s.date, dia:s.dia, semana:s.semana,
                  estado:st, min:m.min, carga:m.carga, tareas:(s.taskIds||[]).length});
  });
  r.filas.sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));
  r.pct = r.total? Math.round((r.porEstado.E||0)/r.total*100) : 0;
  return r;
}
function tarjeta(valor,pie,color){
  return '<div class="kpi"><div class="kpi-v"'+(color?' style="color:'+color+';"':'')+'>'+valor+'</div>'
    +'<div class="kpi-p">'+pie+'</div></div>';
}
function tarjetasEntreno(r){
  return '<div class="kpis">'
    +tarjeta(r.total,'Sesiones')
    +tarjeta((r.porEstado.E||0),'Entrenadas','#00B050')
    +tarjeta(r.pct+'%','Asistencia',r.pct>=85?'#00B050':(r.pct>=60?'#FFC000':'#e05252'))
    +tarjeta(Math.round(r.minutos)+"'",'Minutos')
    +tarjeta(r.carga?r.carga.toFixed(1):'—','Carga')
    +'</div>';
}
function hojaEntrenos(p){
  const r=resumenEntrenos(p);
  let html='<div class="pag">';
  html+='<div class="cab-tit" style="margin-bottom:10px;">'+esc(p.name||'')+' · Entrenamientos</div>';
  html+='<div class="bloque"><div class="caja" style="padding:10px;border-top:1px solid var(--border);border-radius:4px;">'
    +tarjetasEntreno(r)+'</div></div>';

  // Desglose por estado
  html+='<div class="bloque"><div class="banda">Por qué faltó</div><div class="caja" style="padding:10px;">'
    +'<div class="kpis">'
    +Object.keys(ESTADOS).map(k=>tarjeta((r.porEstado[k]||0),ESTADOS[k])).join('')
    +'</div></div></div>';

  if(!r.filas.length){
    html+='<div class="bloque"><div class="caja" style="padding:20px;text-align:center;font-size:12px;color:var(--text3);">'
      +'Este jugador todavía no aparece en ninguna sesión guardada.<br>'
      +'Las sesiones se crean en la <a href="sesion.html" style="color:var(--gold);">planilla de sesión</a>.'
      +'</div></div>';
  } else {
    html+='<div class="bloque"><div class="banda">Sesión a sesión ('+r.filas.length+')</div>'
      +'<table class="t"><thead><tr>'
        +'<th style="width:60px;text-align:center;">Sesión</th><th style="width:110px;">Fecha</th>'
        +'<th style="width:110px;">Semana</th><th style="width:120px;">Estado</th>'
        +'<th style="width:80px;text-align:center;">Tareas</th>'
        +'<th style="width:80px;text-align:center;">Minutos</th>'
        +'<th style="width:80px;text-align:center;">Carga</th></tr></thead><tbody>'
      +r.filas.map(f=>'<tr>'
        +'<td class="tnum">'+esc(f.num||'—')+'</td>'
        +'<td><div class="val">'+esc(fechaCorta(f.fecha))+'</div></td>'
        +'<td><div class="val">'+esc(f.semana||'—')+'</div></td>'
        +'<td><div class="val"><span class="est est-'+esc(f.estado)+'">'+esc(f.estado)+'</span> '
          +esc(ESTADOS[f.estado]||f.estado)+'</div></td>'
        +'<td><div class="val" style="text-align:center;">'+f.tareas+'</div></td>'
        +'<td><div class="val" style="text-align:center;">'+(f.min?Math.round(f.min)+"'":'—')+'</div></td>'
        +'<td><div class="val" style="text-align:center;">'+(f.carga?f.carga.toFixed(1):'—')+'</div></td>'
      +'</tr>').join('')
      +'</tbody></table></div>';
  }
  html+='</div>';
  return html;
}

// ══════════════════════════════════════════════════════════════
//  PARTIDOS · LECTOR DE ACTAS DE LA RFEF
//  El acta oficial ("Ficha del Partido", el PDF que se descarga de
//  marcadores.rfef.es) es una plantilla fija de dos columnas: local a la
//  izquierda, visitante a la derecha y los datos del partido por el medio.
//  De ahí salen alineaciones, cambios, goles, tarjetas y, con eso, los
//  MINUTOS de cada jugador. Se guarda en 'oi_partidos' y sube a la nube.
// ══════════════════════════════════════════════════════════════
const K_PART='oi_partidos';
let partidos={}, actaPend=null;

function cargaPartidos(){ partidos = lee(K_PART,{}) || {}; }
function guardaPartidos(){
  try{ localStorage.setItem(K_PART,JSON.stringify(partidos)); }
  catch(e){ avisa('No se ha podido guardar: falta espacio'); }
}

// ── pdf.js, que se trae sólo cuando hace falta ──
const PDFJS_JS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WK='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfjsPide=null;
function cargaPdfJs(){
  if(pdfjsPide) return pdfjsPide;
  pdfjsPide=new Promise(function(ok,mal){
    const lib=window.pdfjsLib||window['pdfjs-dist/build/pdf'];
    if(lib){ lib.GlobalWorkerOptions.workerSrc=PDFJS_WK; return ok(lib); }
    const s=document.createElement('script'); s.src=PDFJS_JS;
    s.onload=function(){
      const l=window.pdfjsLib||window['pdfjs-dist/build/pdf'];
      if(!l) return mal(new Error('pdf.js no ha cargado'));
      l.GlobalWorkerOptions.workerSrc=PDFJS_WK; ok(l);
    };
    s.onerror=function(){ pdfjsPide=null; mal(new Error('sin conexión para leer el PDF')); };
    document.head.appendChild(s);
  });
  return pdfjsPide;
}
// Texto del PDF con su posición. La y de pdf.js va de abajo arriba: se le da la vuelta.
function itemsDelPdf(buf){
  return cargaPdfJs().then(function(lib){
    return lib.getDocument({data:new Uint8Array(buf)}).promise.then(function(doc){
      const items=[]; let cad=Promise.resolve();
      for(let n=1;n<=doc.numPages;n++){
        cad=cad.then(function(){ return doc.getPage(this.n); }.bind({n:n})).then(function(pg){
          const vp=pg.getViewport({scale:1});
          return pg.getTextContent().then(function(tc){
            tc.items.forEach(function(it){
              const t=(it.str||'').trim(); if(!t) return;
              items.push({p:pg.pageNumber, x:it.transform[4], y:vp.height-it.transform[5], t:t});
            });
          });
        });
      }
      return cad.then(function(){ return items; });
    });
  });
}

/* ------------------------------------------------------------------
   leeActa(items) → objeto partido. Ver cabecera de este apartado.
   ------------------------------------------------------------------ */
function leeActa(items){
  const IZQ=210, DER=395;                 // fronteras de las tres columnas
  const col = x => x<IZQ ? 'L' : (x<DER ? 'C' : 'R');
  const p1 = items.filter(i=>i.p===1);
  const p2 = items.filter(i=>i.p!==1);
  const limpia = s => String(s||'').replace(/\s+/g,' ').trim();

  function lineas(lista, holgura){
    const h = holgura||4.5;
    const ord=[...lista].sort((a,b)=> a.y-b.y || a.x-b.x);
    const out=[]; let act=null;
    for(const it of ord){
      if(!act || it.y-act.y0 > h){ act={y0:it.y, items:[it]}; out.push(act); }
      else act.items.push(it);
    }
    return out.map(l=>({ y:l.y0,
      items:l.items.sort((a,b)=>a.x-b.x),
      txt: limpia(l.items.map(i=>i.t).join(' ')) }));
  }
  const texto = lista => lineas(lista).map(l=>l.txt).join('\n');

  const tit = p1.filter(i=>/^TITULARES$/.test(i.t)).sort((a,b)=>a.y-b.y)[0];
  const yTit = tit ? tit.y : 190;
  const cab = lineas(p1.filter(i=>i.y < yTit-4));
  const tCab = cab.map(l=>l.txt).join('\n');

  const mCat = tCab.match(/Campeonato[^\n]*?de\s+Liga\s+de\s+([^\n(]+?)\s*(?:\(([^)]*)\))?\s*(?:\n|$)/i);
  const partido = {
    competicion: mCat ? limpia(mCat[1]) : '',
    grupo:       mCat && mCat[2] ? limpia(mCat[2]) : '',
    jornada: (tCab.match(/Jornada\s+(\d+)/i)||[])[1] || '',
    fecha:   (tCab.match(/Fecha:\s*(\d{2}-\d{2}-\d{4})/i)||[])[1] || '',
    hora:    (tCab.match(/Hora:\s*(\d{1,2}:\d{2})/i)||[])[1] || '',
    temporada:(tCab.match(/(\d{4}-\d{4})/)||[])[1] || '',
    estadio:'', ciudad:'', arbitros:[], nuestro:'',
    local:{nombre:'',goles:null,titulares:[],suplentes:[],cambios:[],tarjetas:[],ct:{},jugadores:[]},
    visitante:{nombre:'',goles:null,titulares:[],suplentes:[],cambios:[],tarjetas:[],ct:{},jugadores:[]},
    goles:[]
  };
  for(const l of cab.slice().reverse()){
    const iz=limpia(l.items.filter(i=>col(i.x)==='L').map(i=>i.t).join(' '));
    const de=limpia(l.items.filter(i=>col(i.x)==='R').map(i=>i.t).join(' '));
    if(iz && de && !/Fecha|Jornada|Temporada|\d{4}-\d{4}/i.test(iz+de)){
      partido.local.nombre=iz; partido.visitante.nombre=de; break;
    }
  }
  const lRes = lineas(p1.filter(i=>Math.abs(i.y-yTit)<6 && col(i.x)==='C'));
  const mRes = (lRes[0]?lRes[0].txt:'').match(/(\d+)\s*-\s*(\d+)/);
  if(mRes){ partido.local.goles=+mRes[1]; partido.visitante.goles=+mRes[2]; }

  const centro = texto(p1.filter(i=>col(i.x)==='C' && i.y>yTit+4));
  partido.estadio = limpia((centro.match(/ESTADIO:\s*([^\n]*?)(?:\s*Ciudad:|\n|$)/i)||[])[1]||'');
  partido.ciudad  = limpia((centro.match(/Ciudad:\s*([^\n]*)/i)||[])[1]||'');
  const reArb=/(Árbitro(?:\s+Asistente)?|Arbitro(?:\s+Asistente)?|Cuarto\s+Árbitro)\s+([A-ZÁÉÍÓÚÜÑ][^\n]*?)(?=\s*(?:Árbitro|Arbitro|Cuarto|GOLES|ESTADIO|\n|$))/g;
  let mA; while((mA=reArb.exec(centro))) partido.arbitros.push({cargo:limpia(mA[1]), nombre:limpia(mA[2])});
  const reGol=/(\d+)\s*-\s*(\d+)\s+([A-ZÁÉÍÓÚÜÑ][^()\n]*?)\s*\((\d+)'\)/g;
  let mG; while((mG=reGol.exec(centro)))
    partido.goles.push({marcador:mG[1]+'-'+mG[2], jugador:limpia(mG[3]), minuto:+mG[4]});

  const TITULOS=['TITULARES','SUPLENTES','CUERPO TÉCNICO','CUERPO TECNICO','SUSTITUCIONES','TARJETAS'];
  function apartados(lista){
    const ls=lineas(lista.filter(i=>i.y>yTit-6));
    const res={}; let act=null;
    for(const l of ls){
      const t=l.txt.toUpperCase();
      const hit=TITULOS.find(h=> t===h || t.indexOf(h+' ')===0 );
      if(hit){ act=hit.replace('TECNICO','TÉCNICO'); res[act]=res[act]||[];
               const resto=limpia(l.txt.slice(hit.length)); if(resto) res[act].push(resto); continue; }
      if(act) res[act].push(l.txt);
    }
    const o={}; for(const k in res) o[k]=res[k].join('\n');
    return o;
  }
  function porDorsal(txt){
    const s=limpia(String(txt||'').replace(/\n/g,' '));
    const re=/(?:^|\s)(\d{1,2})\s+(?=[A-ZÁÉÍÓÚÜÑ])/g;
    const cortes=[]; let m;
    while((m=re.exec(s))) cortes.push({i:m.index, ini:re.lastIndex, dorsal:m[1]});
    const out=[];
    for(let k=0;k<cortes.length;k++){
      const fin = k+1<cortes.length ? cortes[k+1].i : s.length;
      const resto = limpia(s.slice(cortes[k].ini, fin));
      const mm = resto.match(/\((\d+)'\)/);
      const nombre = limpia(resto.replace(/\((\d+)'\)/,''));
      if(nombre) out.push({dorsal:cortes[k].dorsal, nombre:nombre, minuto: mm?+mm[1]:null});
    }
    return out;
  }
  const mismo=(a,b)=>limpia(a).toUpperCase()===limpia(b).toUpperCase();

  function equipo(lado, lista){
    const ap = apartados(lista), eq = partido[lado];
    eq.titulares = porDorsal(ap['TITULARES']).map(j=>({dorsal:j.dorsal,nombre:j.nombre}));
    eq.suplentes = porDorsal(ap['SUPLENTES']).map(j=>({dorsal:j.dorsal,nombre:j.nombre}));
    const ent = porDorsal(ap['SUSTITUCIONES']);
    for(let k=0;k<ent.length;k++){
      if(ent[k].minuto==null && ent[k+1] && ent[k+1].minuto!=null){
        eq.cambios.push({ entra:{dorsal:ent[k].dorsal,nombre:ent[k].nombre},
                          sale: {dorsal:ent[k+1].dorsal,nombre:ent[k+1].nombre},
                          minuto: ent[k+1].minuto });
        k++;
      }
    }
    const reT=/([A-ZÁÉÍÓÚÜÑ][^()\n]*?)\s*\((\d+)'\)/g; let mT;
    while((mT=reT.exec(ap['TARJETAS']||'')))
      eq.tarjetas.push({dorsal:'', nombre:limpia(mT[1]), minuto:+mT[2], tipo:'amarilla'});
    const ct=(ap['CUERPO TÉCNICO']||'').split('\n').map(limpia).filter(Boolean);
    for(let k=0;k<ct.length-1;k++){
      if(ct[k].indexOf(',')<0 && ct[k+1].indexOf(',')>=0){ eq.ct[ct[k]]=ct[k+1]; k++; }
    }
  }
  equipo('local',     p1.filter(i=>col(i.x)==='L'));
  equipo('visitante', p1.filter(i=>col(i.x)==='R'));

  // Página 2: las incidencias traen el dorsal y el motivo, y distinguen roja de amarilla
  const t2 = texto(p2).replace(/\n/g,' ');
  const corte = t2.search(/DIRIGENTES\s+y\s+T[EÉ]CNICOS/i);
  const zona = corte>0 ? t2.slice(0,corte) : t2;
  const reInc=/-\s*([^:]{3,60}?)\s*:\s*En el minuto\s+(\d+)\s+el jugador\s+\((\d+)\)\s+(.+?)\s+fue\s+(amonestado|expulsado)\s+por el siguiente motivo:\s*(.*?)(?=\s*-\s*[^:]{3,60}?\s*:\s*En el minuto|\s*(?:EXPULSIONES|OTRAS INCIDENCIAS|AMONESTACIONES)\b|$)/gi;
  const inc=[]; let mI;
  while((mI=reInc.exec(zona)))
    inc.push({equipo:limpia(mI[1]), minuto:+mI[2], dorsal:mI[3], nombre:limpia(mI[4]),
              tipo:/expulsado/i.test(mI[5])?'roja':'amarilla', motivo:limpia(mI[6])});
  partido.incidencias=inc;
  for(const lado of ['local','visitante']){
    const eq=partido[lado];
    const mias=inc.filter(i=>mismo(i.equipo, eq.nombre));
    if(mias.length) eq.tarjetas = mias.map(i=>({dorsal:i.dorsal,nombre:i.nombre,minuto:i.minuto,tipo:i.tipo,motivo:i.motivo}));
  }

  // Minutos: el titular entra en el 0; el que sale, hasta el minuto del cambio
  const FIN=90;
  for(const lado of ['local','visitante']){
    const eq=partido[lado], fichas={};
    const mete=(j,titular)=>{ if(!fichas[j.dorsal]) fichas[j.dorsal]={dorsal:j.dorsal,nombre:j.nombre,
      titular:titular, entra:titular?0:null, sale:null, goles:0, amarillas:0, rojas:0, jid:''}; };
    eq.titulares.forEach(j=>mete(j,true));
    eq.suplentes.forEach(j=>mete(j,false));
    eq.cambios.forEach(c=>{
      if(fichas[c.entra.dorsal] && fichas[c.entra.dorsal].entra==null) fichas[c.entra.dorsal].entra=c.minuto;
      if(fichas[c.sale.dorsal]  && fichas[c.sale.dorsal].sale==null)   fichas[c.sale.dorsal].sale=c.minuto;
    });
    eq.tarjetas.forEach(t=>{
      const f = (t.dorsal && fichas[t.dorsal]) || Object.keys(fichas).map(k=>fichas[k]).find(x=>mismo(x.nombre,t.nombre));
      if(!f) return;
      if(t.tipo==='roja'){ f.rojas++; if(f.sale==null) f.sale=Math.min(t.minuto,FIN); }
      else f.amarillas++;
    });
    partido.goles.forEach(g=>{
      const f=Object.keys(fichas).map(k=>fichas[k]).find(x=>mismo(x.nombre,g.jugador));
      if(f) f.goles++;
    });
    eq.jugadores = Object.keys(fichas).map(k=>fichas[k]).map(f=>{
      const jugo=f.entra!=null, sale=f.sale==null?FIN:Math.min(f.sale,FIN);
      return Object.assign({},f,{minutos: jugo?Math.max(0,sale-f.entra):0, jugo:jugo});
    }).sort((a,b)=>(+a.dorsal)-(+b.dorsal));
  }
  return partido;
}

// ── Emparejar el acta con la plantilla ─────────────────────────
// Los nombres del acta vienen "APELLIDOS, NOMBRE" y la plantilla suele
// tener nombres cortos, así que se comparan palabra por palabra y se le
// suma peso al dorsal, que casi siempre coincide.
function trozos(n){ return sinTildes(n).replace(/[^A-ZÑ\s]/g,' ').split(/\s+/).filter(t=>t.length>=3); }
function puntua(jActa, p, unicas){
  const ta=trozos(jActa.nombre), tp=trozos(p.name);
  const com=tp.filter(t=>ta.indexOf(t)>=0);
  // Sin ninguna palabra en común no es él: el dorsal solo no vale, porque los
  // dos equipos del acta llevan los mismos dorsales.
  if(!com.length) return 0;
  let pts=com.length*2;
  if(String(p.num)===String(jActa.dorsal)) pts+=3;
  if(com.length===1 && unicas[com[0]]===1) pts+=1;
  return pts;
}
function cuentaUnicas(){
  const c={}; jugadores.forEach(p=>trozos(p.name).forEach(t=>c[t]=(c[t]||0)+1)); return c;
}
function emparejaActa(part){
  const eq=part[part.nuestro]; if(!eq) return 0;
  const unicas=cuentaUnicas(); const usado={}; let n=0;
  (eq.jugadores||[]).forEach(j=>{
    let mejor=null, pts=0;
    jugadores.forEach(p=>{ const q=puntua(j,p,unicas); if(q>pts){ pts=q; mejor=p; } });
    j.jid = (mejor && pts>=3) ? mejor.id : '';
    if(j.jid){
      if(usado[j.jid]!==undefined && usado[j.jid]>=pts){ j.jid=''; }
      else { usado[j.jid]=pts; n++; }
    }
  });
  return n;
}
function ladoProbable(part){
  const unicas=cuentaUnicas();
  const cuenta=lado=>(part[lado].jugadores||[]).filter(j=>
    jugadores.some(p=>puntua(j,p,unicas)>=3)).length;
  const l=cuenta('local'), v=cuenta('visitante');
  if(l===v) return '';
  return l>v ? 'local' : 'visitante';
}

// ── Importar un acta ──────────────────────────────────────────
function pideActa(){ document.getElementById('file-acta').click(); }
function actaElegida(ev){
  const f=ev.target.files&&ev.target.files[0]; ev.target.value='';
  if(!f) return;
  avisa('Leyendo el acta…');
  const r=new FileReader();
  r.onload=function(e){
    itemsDelPdf(e.target.result).then(function(items){
      const p=leeActa(items);
      if(!p.local.nombre || !p.visitante.nombre || p.local.titulares.length<7){
        avisa('Ese PDF no parece un acta de la RFEF'); return;
      }
      actaPend=p;
      p.nuestro=ladoProbable(p);
      ventanaElige(p);
    }).catch(function(err){ avisa(err&&err.message?err.message:'No se ha podido leer el PDF'); });
  };
  r.onerror=function(){ avisa('No se ha podido abrir el archivo'); };
  r.readAsArrayBuffer(f);
}
function idActa(p){
  return sinTildes(p.fecha+' '+p.local.nombre+' '+p.visitante.nombre).replace(/[^A-Z0-9]+/g,'_');
}
function confirmaLado(lado){
  const p=actaPend; if(!p) return;
  p.nuestro=lado;
  const n=emparejaActa(p);
  const total=(p[lado].jugadores||[]).length;
  partidos[idActa(p)]=p;
  guardaPartidos(); actaPend=null;
  avisa('Acta guardada · '+n+' de '+total+' jugadores reconocidos');
  if(actual){ tab='partidos'; pintaFicha(); }
  abreActas();
}
function borraActa(id){
  const p=partidos[id]; if(!p) return;
  if(!confirm('¿Quitar el acta de la jornada '+(p.jornada||'?')+' ('+p.local.nombre+' - '+p.visitante.nombre+')?')) return;
  delete partidos[id]; guardaPartidos();
  if(actual) pintaFicha();
  abreActas();
}

    +'<div class="mdl-cnt">'+cuerpo+'</div>';

}
function ventanaElige(p){

    +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:19px;letter-spacing:.04em;margin-bottom:10px;">'
    +esc(p.local.nombre)+' <span style="color:var(--gold);">'+p.local.goles+' - '+p.visitante.goles+'</span> '+esc(p.visitante.nombre)+'</div>'
    +'<div class="elige">'
    +'<button class="btn'+(p.nuestro==='local'?'':' btn-ghost')+'" onclick="confirmaLado(\'local\')">'+esc(p.local.nombre)+'</button>'

    +(p.nuestro?'<div style="font-size:11px;color:var(--text3);margin-top:8px;">Marcado el que encaja con tu plantilla. Si no es ése, pulsa el otro.</div>':''));
}
function abreActas(){
  const ids=Object.keys(partidos).sort((a,b)=>ordenActa(partidos[b])-ordenActa(partidos[a]));
  let c='<button class="btn" onclick="pideActa()">Elegir acta en PDF…</button>'
    +'<div style="font-size:11px;color:var(--text3);line-height:1.6;margin:8px 0 14px;">'
    +'El acta oficial se descarga de <b>marcadores.rfef.es</b> (en la ficha del partido, "Acta"). '
    +'De ella salen la alineación, los cambios, los goles, las tarjetas y los minutos de cada jugador.</div>';
  if(!ids.length) c+='<div style="font-size:12px;color:var(--text3);">Todavía no hay actas cargadas.</div>';
  else c+=ids.map(function(id){ const p=partidos[id]; const eq=p[p.nuestro]||{};
      return '<div class="acta-f"><b>J'+esc(p.jornada||'—')+'</b>'
        +'<span>'+esc(p.local.nombre)+' '+esc(p.local.goles)+'-'+esc(p.visitante.goles)+' '+esc(p.visitante.nombre)+'</span>'
        +'<span class="quien">'+esc(eq.nombre||'')+'</span>'
        +'<button class="acta-x" title="Quitar" onclick="borraActa(\''+id+'\')">×</button></div>';
    }).join('');
  ponMdl('Actas de partido', c);
}

// ── Lo que sale en la pestaña Partidos ────────────────────────
function fechaActa(f){   // 08-11-2026 → 08/11/2026
  const m=String(f||'').match(/^(\d{2})-(\d{2})-(\d{4})$/);
  return m? m[1]+'/'+m[2]+'/'+m[3] : (f||'—');
}
function ordenActa(p){
  const m=String(p.fecha||'').match(/^(\d{2})-(\d{2})-(\d{4})$/);
  return m? +(m[3]+m[2]+m[1]) : 0;
}
function suFila(part,p){
  const eq=part[part.nuestro]; if(!eq) return null;
  const js=eq.jugadores||[];
  let q=js.find(x=>x.jid && x.jid===p.id);
  if(!q) q=js.find(x=>sinTildes(x.nombre)===sinTildes(p.name));
  if(!q){ const tp=trozos(p.name);
    if(tp.length) q=js.find(x=>{ const t=trozos(x.nombre);
      return tp.filter(z=>t.indexOf(z)>=0).length >= Math.min(2,tp.length); }); }
  if(!q) q=js.find(x=>String(x.dorsal)===String(p.num));
  return q||null;
}
function resumenPartidos(p){
  const r={convocado:0, jugados:0, titular:0, minutos:0, goles:0, amarillas:0, rojas:0, filas:[]};
  Object.keys(partidos).map(k=>partidos[k]).forEach(function(part){
    if(!part.nuestro) return;
    const j=suFila(part,p); if(!j) return;
    r.convocado++;
    if(j.minutos>0){ r.jugados++; r.minutos+=j.minutos; }
    if(j.titular) r.titular++;
    r.goles+=j.goles||0; r.amarillas+=j.amarillas||0; r.rojas+=j.rojas||0;
    const casa = part.nuestro==='local';
    r.filas.push({ jornada:part.jornada, fecha:part.fecha,
      rival: casa? part.visitante.nombre : part.local.nombre, casa:casa,
      marcador: part.local.goles+'-'+part.visitante.goles,
      favor: casa? part.local.goles : part.visitante.goles,
      contra: casa? part.visitante.goles : part.local.goles,
      titular:j.titular, minutos:j.minutos, goles:j.goles, amarillas:j.amarillas, rojas:j.rojas,
      dorsal:j.dorsal });
  });
  r.filas.sort((a,b)=>ordenActa(b)-ordenActa(a));
  r.media = r.jugados? Math.round(r.minutos/r.jugados) : 0;
  return r;
}
function hojaPartidos(p){
  const r=resumenPartidos(p);
  const nActas=Object.keys(partidos).length;
  let html='<div class="pag">';
  html+='<div class="cab-tit" style="margin-bottom:10px;">'+esc(p.name||'')+' · Partidos</div>';
  if(!nActas){
    html+='<div class="bloque"><div class="caja" style="padding:22px;text-align:center;font-size:12px;color:var(--text3);line-height:1.7;">'
      +'Todavía no hay actas cargadas.<br>'
      +'Baja el acta del partido de <b>marcadores.rfef.es</b> y súbela aquí: la app saca sola la alineación, los cambios, los goles, las tarjetas y los minutos.'
      +'<div style="margin-top:12px;"><button class="btn" onclick="abreActas()">Importar un acta</button></div>'
      +'</div></div></div>';
    return html;
  }
  html+='<div class="bloque"><div class="caja" style="padding:10px;border-top:1px solid var(--border);border-radius:4px;">'
    +'<div class="kpis">'
    +tarjeta(r.convocado,'Convocado')
    +tarjeta(r.jugados,'Jugados','#00B050')
    +tarjeta(r.titular,'Titular')
    +tarjeta(Math.round(r.minutos)+"'",'Minutos')
    +tarjeta(r.media?r.media+"'":'—','Media')
    +tarjeta(r.goles,'Goles',r.goles?'#C8A84B':'')
    +'</div></div></div>';
  html+='<div class="bloque"><div class="banda">Disciplina</div><div class="caja" style="padding:10px;">'
    +'<div class="kpis">'
    +tarjeta(r.amarillas,'Amarillas',r.amarillas?'#FFC000':'')
    +tarjeta(r.rojas,'Rojas',r.rojas?'#e05252':'')
    +'</div></div></div>';
  if(!r.filas.length){
    html+='<div class="bloque"><div class="caja" style="padding:20px;text-align:center;font-size:12px;color:var(--text3);line-height:1.7;">'
      +'Este jugador no aparece en ninguna de las '+nActas+' actas cargadas.<br>'
      +'Si el nombre de tu plantilla no se parece al del acta, cámbialo y vuelve a importarla.'
      +'</div></div>';
  } else {
    html+='<div class="bloque"><div class="banda">Partido a partido ('+r.filas.length+')</div>'
      +'<table class="t"><thead><tr>'
      +'<th style="width:50px;text-align:center;">J</th><th style="width:90px;">Fecha</th>'
      +'<th>Rival</th><th style="width:70px;text-align:center;">Res.</th>'
      +'<th style="width:70px;text-align:center;">Rol</th>'
      +'<th style="width:70px;text-align:center;">Min.</th>'
      +'<th style="width:60px;text-align:center;">Goles</th>'
      +'<th style="width:80px;text-align:center;">Tarj.</th></tr></thead><tbody>'
      +r.filas.map(function(f){
        const sig = f.favor>f.contra? '#00B050' : (f.favor<f.contra? '#e05252' : '#FFC000');
        const rol = f.minutos>0 ? (f.titular?'Titular':'Suplente') : 'No jugó';
        return '<tr>'
        +'<td class="tnum">'+esc(f.jornada||'—')+'</td>'
        +'<td><div class="val">'+esc(fechaActa(f.fecha))+'</div></td>'
        +'<td><div class="val">'+(f.casa?'':'en ')+esc(f.rival)+'</div></td>'
        +'<td><div class="val" style="text-align:center;color:'+sig+';">'+esc(f.marcador)+'</div></td>'
        +'<td><div class="val" style="text-align:center;">'+rol+'</div></td>'
        +'<td><div class="val" style="text-align:center;">'+(f.minutos?f.minutos+"'":'—')+'</div></td>'
        +'<td><div class="val" style="text-align:center;">'+(f.goles||'—')+'</div></td>'
        +'<td><div class="val" style="text-align:center;">'
          +(f.amarillas?'<span class="est est-L" style="background:#FFC000;color:#222;">'+f.amarillas+'</span> ':'')
          +(f.rojas?'<span class="est est-L" style="background:#e05252;">'+f.rojas+'</span>':'')
          +(!f.amarillas&&!f.rojas?'—':'')
        +'</div></td></tr>';
      }).join('')
      +'</tbody></table></div>';
  }
  html+='<div class="no-print" style="margin-top:8px;"><button class="btn btn-ghost" onclick="abreActas()">Actas cargadas ('+nActas+')</button></div>';
  html+='</div>';
  return html;
}

// ── Filas ──
function masReunion(){ fichaDe(actual).reuniones.push({fecha:'',proxima:'',feedback:''}); guardaOoii(); pintaFicha(); }
function quitaReunion(i){
  const f=fichaDe(actual);
  if(f.reuniones.length<=1){ avisa('Tiene que quedar al menos una'); return; }
  if(!confirm('¿Quitar esta reunión?')) return;
  f.reuniones.splice(i,1); guardaOoii(); pintaFicha();
}
function masJornada(){
  const f=fichaDe(actual);
  f.jornadas.push({j:String(f.jornadas.length+1),partido:'',destacar:'',mejorar:''});
  guardaOoii(); pintaFicha();
}
function masJornadas(n){
  const f=fichaDe(actual);
  for(let i=0;i<n;i++) f.jornadas.push({j:String(f.jornadas.length+1),partido:'',destacar:'',mejorar:''});
  guardaOoii(); pintaFicha();
}
function quitaJornada(i){
  if(!confirm('¿Quitar esta jornada?')) return;
  fichaDe(actual).jornadas.splice(i,1); guardaOoii(); pintaFicha();
}

// ── Foto del jugador ──
function pideFoto(){ document.getElementById('file-foto').click(); }
function quitaFoto(ev){
  ev.stopPropagation();
  if(!confirm('¿Quitar la foto?')) return;
  datosDe(actual).foto=''; guardaFichas(); pintaFicha();
}
function fotoElegida(ev){
  const file=ev.target.files&&ev.target.files[0]; ev.target.value='';
  if(!file) return;
  if(!file.type.startsWith('image/')){ avisa('Eso no es una imagen'); return; }
  const r=new FileReader();
  r.onload=function(e){
    const img=new Image();
    img.onload=function(){
      // Se recorta cuadrada y se baja a 320 px: si no, cuatro fotos
      // llenan el almacenamiento del navegador.
      const L=320, lado=Math.min(img.width,img.height);
      const cv=document.createElement('canvas'); cv.width=L; cv.height=L;
      const c=cv.getContext('2d');
      c.drawImage(img,(img.width-lado)/2,(img.height-lado)/2,lado,lado,0,0,L,L);
      datosDe(actual).foto=cv.toDataURL('image/jpeg',0.82);
      guardaFichas(); pintaFicha(); avisa('Foto puesta');
    };
    img.onerror=function(){ avisa('No se ha podido leer la imagen'); };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

// ── Escudo del equipo en la barra ──
function pintaEscudo(){
  const d=localStorage.getItem('oi_team_crest');
  const c=document.querySelector('.oi-nav-crest'); if(!c) return;
  const img=c.querySelector('img'), svg=c.querySelector('svg');
  if(d){ img.src=d; img.style.display='block'; if(svg) svg.style.display='none'; }
  else { img.style.display='none'; if(svg) svg.style.display=''; }
}

// ── Cuando la nube trae datos ──
window.addEventListener('oi-datos', function(ev){
  const cl=(ev.detail&&ev.detail.claves)||[];
  const hay=k=>cl.indexOf(k)>=0;
  try{
    if(hay('pz_players')||hay('pz_plantilla_nombre')){ cargaPlantilla(); pintaLista(document.getElementById('buscador').value); }
    if(hay('pz_sessions') && actual && tab!=='ooii') pintaFicha();
    if(hay(K_FICHAS)){ cargaFichas(); if(actual) pintaFicha(); }
    if(hay(K_OOII)){
      cargaOoii();
      pintaLista(document.getElementById('buscador').value);
      if(actual) pintaFicha();
      avisa('Objetivos traídos de la nube');
    }
    if(hay(K_PART)){ cargaPartidos(); if(actual) pintaFicha(); }
    if(hay('oi_team_crest')) pintaEscudo();
  }catch(e){}
});

// ── Arranque ──
cargaPlantilla(); cargaOoii(); cargaFichas(); cargaPartidos(); pintaLista(''); pintaEscudo();
