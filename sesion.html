<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Once Inicial · Planilla de Sesión</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0d1a4a;--navy2:#1B2A6B;--gold:#C8A84B;
  --surface:#0c1828;--surface2:#0f1e30;--bg:#080e1a;--bg2:#0a1020;
  --border:rgba(200,168,75,0.15);--border2:rgba(200,168,75,0.3);
  --text:#c8c0b0;--text2:#8890a0;--text3:#556070;
  --radius:6px;--radius-lg:10px;
}

/* ── SCREEN LAYOUT ── */
@media screen {
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;}
  #topnav{height:44px;background:var(--navy);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;}
  #topnav .logo{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:1px;cursor:pointer;}
  #topnav .sep{color:var(--text3);font-size:12px;}
  #topnav .page-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text2);}
  /* ── ESCUDO DEL EQUIPO (esquina opuesta al logo) ── */
  #crest-nav{
    width:30px;height:30px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;position:relative;
  }
  #crest-nav img{width:100%;height:100%;object-fit:contain;display:none;}
  #crest-nav .crest-add-sm{
    width:100%;height:100%;
    border:1.5px dashed rgba(200,168,75,0.35);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    transition:background 0.15s,border-color 0.15s;
  }
  #crest-nav:hover .crest-add-sm{background:rgba(200,168,75,0.08);border-color:rgba(200,168,75,0.6);}
  #crest-nav .crest-add-sm svg{width:48%;height:48%;opacity:0.5;stroke:var(--gold);}
  #crest-nav:hover .crest-add-sm svg{opacity:0.85;}
  #crest-nav .crest-remove-sm{
    position:absolute;top:-5px;right:-5px;
    width:14px;height:14px;border-radius:50%;
    background:#7a1a1a;color:#fff;
    font-size:10px;line-height:14px;text-align:center;
    display:none;cursor:pointer;
  }
  #crest-nav:hover .crest-remove-sm{display:block;}
  @media print{ #crest-nav{display:none !important;} }
  .nav-btn{background:rgba(200,168,75,0.1);border:1px solid var(--border2);border-radius:5px;padding:5px 12px;font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:1px;color:var(--gold);cursor:pointer;text-transform:uppercase;transition:all .2s;}
  .nav-btn:hover{background:rgba(200,168,75,0.2);}
  .nav-btn.primary{background:var(--gold);color:#0d1530;border-color:var(--gold);}
  .nav-btn.primary:hover{background:#e0c068;}
  #app{display:flex;height:calc(100vh - 44px);overflow:hidden;}
  #sessions-panel{width:200px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  #sessions-panel .panel-hdr{padding:10px 12px;border-bottom:1px solid var(--border);font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  #session-list{flex:1;overflow-y:auto;padding:6px;}
  .session-item{padding:8px 10px;border-radius:var(--radius);cursor:pointer;margin-bottom:3px;border:1px solid transparent;transition:all .15s;}
  .session-item:hover{background:rgba(200,168,75,0.07);border-color:var(--border);}
  .session-item.active{background:rgba(27,42,107,0.4);border-color:rgba(200,168,75,0.3);}
  .si-num{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--gold);}
  .si-date{font-size:11px;color:var(--text);margin-top:1px;}
  .si-sub{font-size:10px;color:var(--text3);margin-top:1px;}
  #session-editor{flex:1;overflow-y:auto;padding:0;min-height:0;}
  #empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;gap:12px;color:var(--text3);}
  .empty-icon{font-size:48px;opacity:0.3;}
  .empty-text{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;}
}

/* ── TASK CARD (identical to librería) ── */
.lcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:all .15s;flex-shrink:0;}

/* Session header block */
.sess-hdr-block{
  background:var(--navy2);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:12px 16px;margin-bottom:10px;
}
.sess-hdr-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.shf label{font-size:8px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:2px;}
.shf .val{font-size:12px;color:#fff;font-weight:600;}

/* Attendance */
.att-block{background:#fff;border:1px solid rgba(27,42,107,0.25);border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:10px;}
.att-title{color:var(--navy2);font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.att-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;}
.att-player{display:flex;align-items:center;gap:4px;background:#f8f9fc;border:1px solid rgba(255,255,255,0.06);border-radius:3px;padding:3px 5px;}
.att-num{font-size:9px;font-weight:700;color:var(--gold);min-width:14px;font-family:'Barlow Condensed',sans-serif;}
.att-name{font-size:9px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.att-status{font-size:8px;font-weight:700;border-radius:2px;padding:1px 4px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;transition:all .15s;}
.att-E{background:#00B050;color:#fff;}
.att-L{background:#e05252;color:#fff;}
.att-En{background:#27ae60;color:#fff;}
.att-P{background:#7f8c8d;color:#fff;}
.att-RA{background:#e67e22;color:#fff;}
.att-E2{background:#2980b9;color:#fff;}

/* ITC + distrib added below each card */
.task-extra{
  background:#fff;
  border:1px solid rgba(27,42,107,0.25);border-top:none;
  border-radius:0 0 var(--radius-lg) var(--radius-lg);
  padding:10px 14px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  margin-bottom:14px;
}
.te-section-title{font-size:9px;font-weight:700;color:var(--navy2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.itc-row{display:flex;gap:8px;}
.itc-field{flex:1;display:flex;flex-direction:column;gap:2px;}
.itc-field label{font-size:8px;font-weight:700;color:var(--gold);text-transform:uppercase;text-align:center;}
.itc-field input{background:#f5f7fb;border:1px solid rgba(27,42,107,0.2);border-radius:4px;padding:5px;font-size:13px;font-weight:700;color:var(--navy2);font-family:'Barlow Condensed',sans-serif;text-align:center;width:100%;}
.itc-field input:focus{outline:none;border-color:var(--navy2);}
.distrib-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.distrib-cell{background:#f5f7fb;border:1px solid rgba(27,42,107,0.18);color:#111;border-radius:3px;padding:3px 6px;font-size:10px;color:var(--text3);min-height:22px;cursor:text;}
.distrib-cell:focus{outline:none;border-color:rgba(200,168,75,0.3);color:var(--text);}

/* Bottom tables */
.bottom-section{display:grid;grid-template-columns:1fr 280px;gap:12px;margin-bottom:20px;}
.bottom-card{background:#fff;border:1px solid rgba(27,42,107,0.25);border-radius:var(--radius-lg);overflow:hidden;}
.bottom-card-hdr{background:var(--navy2);padding:8px 14px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--border);}
.obj-table,.carga-table{width:100%;border-collapse:collapse;}
.obj-table th,.carga-table th{font-size:9px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px;padding:6px 10px;text-align:left;background:var(--navy2);border-bottom:1px solid rgba(27,42,107,0.3);}
.carga-table th{text-align:center;}
.obj-table td{padding:6px 10px;border-bottom:1px solid rgba(27,42,107,0.12);font-size:11px;vertical-align:top;}
.carga-table td{padding:6px 10px;border-bottom:1px solid rgba(27,42,107,0.12);font-size:11px;text-align:center;}
.obj-table tr:last-child td,.carga-table tr:last-child td{border-bottom:none;color:#222;}
.obj-task-num{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--gold);}
.carga-input{background:transparent;border:none;width:100%;text-align:center;font-size:11px;color:#111;font-family:'Barlow',sans-serif;}
.carga-input:focus{outline:none;color:var(--navy2);}
.total-row td{background:rgba(27,42,107,0.07);font-weight:700;color:var(--navy2);}

/* btn */
.btn{border-radius:5px;padding:7px 16px;font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:all .2s;border:1px solid;}
.btn-gold{background:var(--gold);color:#0d1530;border-color:var(--gold);}
.btn-gold:hover{background:#e0c068;}
.btn-ghost{background:transparent;color:var(--text2);border-color:rgba(255,255,255,0.15);}
.btn-ghost:hover{border-color:rgba(255,255,255,0.3);color:var(--text);}

/* Modal */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:100;}
#modal-overlay.open{display:flex;}
#modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:500px;max-height:85vh;overflow-y:auto;}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;justify-content:space-between;}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
.modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.mf{display:flex;flex-direction:column;gap:4px;}
.mf label{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;}
.mf input,.mf select{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:5px;padding:7px 10px;font-size:12px;color:var(--text);font-family:'Barlow',sans-serif;width:100%;}
.mf input:focus,.mf select:focus{outline:none;border-color:var(--gold);}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.task-pick-list{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);}
.task-pick-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background .15s;}
.task-pick-item:last-child{border-bottom:none;}
.task-pick-item:hover{background:rgba(200,168,75,0.06);}
.task-pick-item input[type=checkbox]{accent-color:var(--gold);width:14px;height:14px;flex-shrink:0;}
.tpi-name{font-size:11px;color:var(--text);flex:1;}
.tpi-phase{font-size:9px;color:var(--text3);}

/* Scrollbars */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(200,168,75,0.2);border-radius:3px;}

/* Session content padding */
#sess-content{padding:14px 20px;}

/* ── PRINT STYLES: DIN A4 landscape, 2 pages ── */
@media print {
  @page { size:A4 landscape; margin:5mm 5mm; }
  * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  html,body { overflow:visible !important; height:auto !important; }
  #topnav,#sessions-panel,#modal-overlay,#empty-state,#btn-print,
  .btn-ghost,.btn-danger,.sess-hdr-arrow { display:none !important; }
  #app { display:block !important; height:auto !important; overflow:visible !important; }
  #session-editor { overflow:visible !important; height:auto !important; padding:0 !important; }
  #sess-content { padding:0 !important; }

  /* ── 2 PÁGINAS A4 HORIZONTAL ── */
  .print-page {
    width:287mm; height:200mm;
    page-break-after:always; page-break-inside:avoid;
    overflow:hidden; display:flex; flex-direction:column; gap:1mm;
    border:1.2pt solid #C8A84B; padding:1.5mm; box-sizing:border-box;
  }
  .print-page:last-child { page-break-after:avoid; }

  /* Escudo del equipo: esquina superior derecha, no afecta al resto del layout */
  .print-crest {
    position:absolute;
    top:2mm; right:2mm;
    width:13mm; height:13mm;
    object-fit:contain;
    z-index:50;
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
  }

  /* Cabecera */
  .sess-hdr-block { flex-shrink:0; padding:1.5mm 2mm !important; border-radius:2pt !important; overflow:hidden !important; }
  .sess-hdr-block > div { gap:2mm !important; flex-wrap:nowrap !important; }
  .sess-hdr-block [style*="height:40px"] { height:8mm !important; width:auto !important; flex-shrink:0 !important; }
  .sess-hdr-block [style*="font-size:24px"] { font-size:9.5pt !important; white-space:nowrap !important; }
  .sess-hdr-block [style*="font-size:10px"] { display:none !important; }
  .sess-hdr-grid { display:flex !important; flex-direction:row !important; flex-wrap:nowrap !important; align-items:center !important; gap:1mm 2.5mm !important; flex:1 !important; }
  .shf { display:flex !important; flex-direction:row !important; align-items:center !important; gap:0.5mm !important; flex-shrink:0 !important; }
  .shf label { font-size:5pt !important; font-weight:700 !important; text-transform:uppercase !important; white-space:nowrap !important; margin:0 !important; color:rgba(200,168,75,0.7) !important; }
  .shf .val   { font-size:6.5pt !important; font-weight:700 !important; color:white !important; white-space:nowrap !important; }

  /* Asistencia */
  .att-block { flex-shrink:0; padding:1mm 2mm !important; border-radius:2pt !important; overflow:hidden !important; background:#fff !important; border-color:rgba(27,42,107,0.2) !important; }
  .att-title { font-size:6.5pt !important; margin-bottom:1mm !important; display:flex !important; align-items:flex-start !important; gap:2mm !important; }
  .att-title > div { display:flex !important; flex-wrap:wrap !important; gap:0.3mm 1.5mm !important; margin-left:auto !important; max-width:100mm !important; }
  .att-title > div > div { display:flex !important; align-items:center !important; gap:0.8mm !important; }
  .att-title > div > div span:first-child { font-size:5pt !important; padding:0 1.5px !important; }
  .att-title > div > div span:last-child  { font-size:5pt !important; }
  .att-grid { grid-template-columns:repeat(12,1fr) !important; gap:1px !important; }
  .att-player { padding:0.5px 1.5px !important; gap:1px !important; border-radius:1px !important; }
  .att-num    { font-size:5.5pt !important; min-width:6px !important; flex-shrink:0 !important; }
  .att-name   { font-size:5.5pt !important; overflow:hidden !important; text-overflow:ellipsis !important; white-space:nowrap !important; }
  .att-status { font-size:5pt !important; padding:0 1px !important; flex-shrink:0 !important; }

  /* Etiqueta tarea */
  .task-lbl { margin:0.5mm 0 0.2mm !important; flex-shrink:0; height:3.5mm !important; }
  .task-lbl span { font-size:6pt !important; padding:1px 5px !important; }

  /* Fila 2 tareas */
  .print-tasks-row {
    display:grid !important; grid-template-columns:142mm 142mm !important;
    gap:3mm !important; flex:1 !important; overflow:hidden !important; min-height:0 !important;
  }
  .print-task-wrap {
    width:142mm !important; overflow:hidden !important;
    display:flex !important; flex-direction:column !important; min-height:0 !important;
  }
  .lcard-scale-wrap { flex:1; overflow:hidden !important; min-height:0 !important; display:flex !important; flex-direction:column !important; }

  /* Card + extra: zoom juntos dentro del wrapper
     960px → 142mm ≈ 537px → zoom = 537/960 = 0.559 */
  .lcard-scale-wrap {
    zoom: 0.559;
    width: 960px;
    display: block;
  }
  /* Reducir campo SVG para ahorrar tinta */
  .lcard [style*="height:380px"] {
    height: 260px !important;
  }
  /* Fondos oscuros → blanco para ahorrar tinta EXCEPTO banners de fase */
  .lcard [style*="background:#0c1828"],
  .lcard [style*="background:#0a1520"],
  .lcard [style*="background:#0a1020"],
  .lcard [style*="background:#0d1a24"] {
    background: #ffffff !important;
  }
  /* Textos legibles sobre blanco — EXCEPTO dentro de banners de fase */
  .lcard [style*="color:#b8b0a0"] { color: #333 !important; }
  .lcard [style*="color:var(--gold)"] { color: #1B2A6B !important; }
  .lcard [style*="color:var(--text3)"] { color: #555 !important; }
  /* color:#fff solo en header (nombre tarea), NO en banners */
  .lcard > div > div:first-child [style*="color:#fff"] { color: #111 !important; }
  .lcard > div > div:first-child [style*="color:white"] { color: #111 !important; }
  /* Contenedor del campo: blanco en los márgenes (no verde) */
  .lcard [style*="background:#0d1a0d"] {
    background: #ffffff !important;
    -webkit-print-color-adjust: exact !important;
  }
  .lcard [style*="border-bottom:3px solid #2ecc40"] { background: #1a5c1a !important; -webkit-print-color-adjust:exact !important; }
  .lcard [style*="border-bottom:3px solid #5ddd5d"] { background: #2d7a2d !important; -webkit-print-color-adjust:exact !important; }
  .lcard [style*="border-bottom:3px solid #e05252"] { background: #7a1a1a !important; -webkit-print-color-adjust:exact !important; }
  .lcard [style*="border-bottom:3px solid #ff9500"] { background: #7a3d00 !important; -webkit-print-color-adjust:exact !important; }
  .lcard [style*="border-bottom:3px solid #C8A84B"] { background: #1a3060 !important; -webkit-print-color-adjust:exact !important; }
  /* Todo el texto dentro de los banners: blanco */
  .lcard [style*="border-bottom:3px solid"] * { color: rgba(255,255,255,0.9) !important; }
  /* task-extra en print también blanco */
  .task-extra { background: #fff !important; border-color: rgba(27,42,107,0.2) !important; }
  .distrib-cell { background: #f5f7fb !important; border-color: rgba(27,42,107,0.18) !important; color: #333 !important; }
  .te-section-title { color: var(--navy2) !important; }
  .itc-field input { background: #f5f7fb !important; color: var(--navy2) !important; }
  /* Bordes visibles sobre blanco */
  .lcard [style*="border:1px solid rgba(200,168,75,0.2)"] { border-color: rgba(27,42,107,0.35) !important; }
  .lcard [style*="border-bottom:1px solid rgba(255,255,255,0.1)"] { border-color: rgba(0,0,0,0.1) !important; }
  .lcard [style*="border-right:1px solid rgba(255,255,255,0.07)"] { border-color: rgba(0,0,0,0.1) !important; }
  .lcard [style*="border-top:2px solid rgba(200,168,75,0.3)"] { border-color: rgba(27,42,107,0.35) !important; }

  /* ITC + distrib: compacto para ahorrar espacio e ink */
  .task-extra {
    flex-shrink:0; padding:1px 3px !important; gap:1.5mm !important;
    border:0.3pt solid rgba(200,168,75,0.3) !important; border-top:none !important;
    display:grid !important; grid-template-columns:1fr 1fr !important;
    margin-top:0 !important;
  }
  .te-section-title { font-size:5pt !important; margin-bottom:1px !important; }
  .itc-field label  { font-size:5pt !important; }
  .itc-field input  { font-size:6.5pt !important; padding:1px !important; }
  .distrib-grid { grid-template-columns:repeat(5,1fr) !important; gap:1px !important; }
  .distrib-cell { font-size:5pt !important; padding:0.5px 2px !important; min-height:8px !important; }

  /* Objetivos + Carga */
  .bottom-section { flex-shrink:0; display:grid !important; grid-template-columns:1fr 155px !important; gap:2mm !important; overflow:visible !important; }
  .print-page:last-child .print-task-wrap { max-height:148mm !important; overflow:hidden !important; }
  .bottom-card { border:0.4pt solid rgba(27,42,107,0.25) !important; border-radius:2pt !important; overflow:hidden !important; background:#fff !important; }
  .bottom-card-hdr { padding:2px 6px !important; font-size:7pt !important; }
  .obj-table th,.carga-table th { font-size:5.5pt !important; padding:1.5px 4px !important; }
  .obj-table td  { font-size:6.5pt !important; padding:1.5px 4px !important; line-height:1.3 !important; }
  .obj-task-num  { font-size:6pt !important; }
  .carga-table td { font-size:6.5pt !important; padding:1.5px 3px !important; text-align:center !important; }
  .total-row td  { font-size:6pt !important; }
  .obj-table [contenteditable] { font-size:6.5pt !important; }
  .carga-input   { font-size:6.5pt !important; }
}

.topnav{
  height:54px;background:#0d1530;
  border-bottom:2px solid #C8A84B;
  display:flex;align-items:center;padding:0 14px;gap:10px;
  flex-shrink:0;z-index:100;
}
.nav-back{

}

.nav-logo-circle{

  flex-shrink:0;overflow:hidden;
}

.nav-logo-text{display:flex;flex-direction:column;line-height:1.15;}

.nav-logo-main{font-size:13px;font-weight:700;letter-spacing:1px;color:#ddd8cc;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;}
.nav-sep{flex:1;}
.nav-section-title{
  font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;

/* ══ IMPRESIÓN SESIÓN — Amigable con la tinta ══ */
@media print {
  @page { size: A4 landscape; margin: 8mm; }
  
  .oi-topnav, #sessions-panel { display: none !important; }
  
  *, *::before, *::after {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  
  body, html { background: white !important; overflow: visible !important; }
  
  /* Header de sesión */
  .sess-header {
    background: #1B2A6B !important;
    color: white !important;
    border-radius: 0 !important;
  }
  
  /* Fondos oscuros → blanco */
  .task-card { 
    background: white !important; 
    border: 1px solid #ccc !important;
    box-shadow: none !important;
  }
  
  /* Campo SVG — fondo blanco */
  .field-wrap, .field-bg { background: white !important; }
  .field-line { stroke: #333 !important; }
  
  /* Texto legible */
  * { color: #222 !important; }
  .phase-banner { -webkit-print-color-adjust: exact !important; }
  
  /* Evitar cortes */
  .task-card { page-break-inside: avoid !important; }
}

  </div>
</div>

function makeFieldSVG(t){
    const VW=900,VH=Math.round(900*(68/105)); // 900x583 viewBox, 105:68 ratio
    const ratio=105/68;
    const PAD=20;
    const fw=VW-PAD*2, fh=VH-PAD*2;
    const m=fw/105; // pixels per metre
    const cx=PAD+fw/2, cy=PAD+fh/2;
    const G1='#1e3d1e',G2='#183318';
    let s=`<rect width="${VW}" height="${VH}" fill="#0d1a0d"/>`;
    // Stripes
    for(let i=0;i<10;i++)s+=`<rect x="${PAD+i*fw/10}" y="${PAD}" width="${fw/10}" height="${fh}" fill="${i%2===0?G1:G2}"/>`;
    // Boundary
    s+=`<rect x="${PAD}" y="${PAD}" width="${fw}" height="${fh}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>`;
    // Halfway
    s+=`<line x1="${cx}" y1="${PAD}" x2="${cx}" y2="${PAD+fh}" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>`;
    // Centre circle R=9.15m
    s+=`<circle cx="${cx}" cy="${cy}" r="${9.15*m}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="3" fill="rgba(255,255,255,0.85)"/>`;
    // Penalty areas (40.32m wide, 16.5m deep)
    const paW=40.32*m, paD=16.5*m;
    s+=`<rect x="${PAD}" y="${cy-paW/2}" width="${paD}" height="${paW}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2"/>`;
    s+=`<rect x="${PAD+fw-paD}" y="${cy-paW/2}" width="${paD}" height="${paW}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2"/>`;
    // Goal areas (18.32m wide, 5.5m deep)
    const gaW=18.32*m, gaD=5.5*m;
    s+=`<rect x="${PAD}" y="${cy-gaW/2}" width="${gaD}" height="${gaW}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1"/>`;
    s+=`<rect x="${PAD+fw-gaD}" y="${cy-gaW/2}" width="${gaD}" height="${gaW}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1"/>`;
    // Goals (7.32m)
    const gW=7.32*m, gDep=6;
    s+=`<rect x="${PAD-gDep}" y="${cy-gW/2}" width="${gDep}" height="${gW}" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>`;
    s+=`<rect x="${PAD+fw}" y="${cy-gW/2}" width="${gDep}" height="${gW}" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>`;
    // Penalty spots at 11m
    const psXL=PAD+11*m, psXR=PAD+fw-11*m;
    s+=`<circle cx="${psXL}" cy="${cy}" r="2.5" fill="rgba(255,255,255,0.85)"/>`;
    s+=`<circle cx="${psXR}" cy="${cy}" r="2.5" fill="rgba(255,255,255,0.85)"/>`;
    // Penalty arcs — clip to outside box
    // Left arc
    s+=`<clipPath id="larc"><rect x="${PAD+paD}" y="${PAD}" width="${fw-paD*2}" height="${fh}"/></clipPath>`;
    s+=`<circle cx="${psXL}" cy="${cy}" r="${9.15*m}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" clip-path="url(#larc)"/>`;
    s+=`<circle cx="${psXR}" cy="${cy}" r="${9.15*m}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" clip-path="url(#larc)"/>`;
    // Corner arcs R=1m
    const cr=1*m;
    [[PAD,PAD,0,90],[PAD+fw,PAD,90,180],[PAD,PAD+fh,-90,0],[PAD+fw,PAD+fh,180,270]].forEach(([ax,ay,sa,ea])=>{
      const r1=sa*Math.PI/180,r2=ea*Math.PI/180;
      const x1=ax+cr*Math.cos(r1),y1=ay+cr*Math.sin(r1),x2=ax+cr*Math.cos(r2),y2=ay+cr*Math.sin(r2);
      s+=`<path d="M${x1},${y1} A${cr},${cr} 0 0,1 ${x2},${y2}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2"/>`;
    });

    // --- SCALE ELEMENTS ---
    // The editor uses canvas coords. We need to map canvas → SVG viewBox
    // Canvas was approx 900wide x 580tall based on typical window
    // But elements are stored in raw canvas px. We scale to our VW×VH viewBox
    // using the same fieldRect logic: field is centred with 30px padding
    // Editor canvas ~1200x700 typical, field 105:68 ratio inside
    // We'll use the same approach: assume field occupies full VW×VH minus PAD
    const scx=fw/105/m; // = 1, since m=fw/105 — elements stored in canvas px
    // Actually elements are in canvas pixels. The editor field uses:
    // horiz=true: fw = canvasW-60, fh = fw/ratio. fieldX=(canvasW-fw)/2=30, fieldY=(canvasH-fh)/2
    // We need to map: elX -> (elX - fieldOriginX_editor) / m_editor * m_svg + PAD
    // Since we don't know the exact canvas size at save time, we approximate:
    // Assume editor was ~900px wide canvas. fieldW=840, fieldH=840*(68/105)=544
    // fieldOriginX=30, fieldOriginY=(canvasH-544)/2
    const allEls=t.ELS||[], allLns=t.LINES||[];
    // Use saved canvas dimensions if available, else estimate from element positions
    // The editor saves elements in raw canvas px with horiz=true field
    // fieldRect(horiz=true, PAD=30): fw=min(canvasW-60, (canvasH-60)*ratio), fh=fw/ratio
    // fieldX=(canvasW-fw)/2=30, fieldY=(canvasH-fh)/2
    // We reconstruct from bounding box of all points
    const allPts=[...allEls.map(e=>({x:e.x,y:e.y})),...allLns.flatMap(l=>[{x:l.x1,y:l.y1},{x:l.x2,y:l.y2}])];
    let estCW=1200, estCH=650; // defaults
    if(t.canvasW&&t.canvasH){estCW=t.canvasW;estCH=t.canvasH;}
    else if(allPts.length){
      const xs=allPts.map(p=>p.x),ys=allPts.map(p=>p.y);
      const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
      // Elements are inside the field. Field is centred in canvas.
      // Estimate canvas from element spread + margins
      const spreadX=maxX-minX, spreadY=maxY-minY;
      // Field is at least as large as the spread + some padding
      // Assume elements use ~60-80% of field dimensions
      const estFW=Math.max(spreadX*1.6,400), estFH=estFW/ratio;
      estCW=estFW+60; estCH=estFH+60;
    }
    // Compute fieldRect same as editor
    const edPAD=30,avW=estCW-edPAD*2,avH=estCH-edPAD*2;
    let edFW,edFH;
    if(avW/avH>=ratio){edFH=avH;edFW=edFH*ratio;}else{edFW=avW;edFH=edFW/ratio;}
    const edFX=(estCW-edFW)/2,edFY=(estCH-edFH)/2;
    // Map: editor canvas px → SVG px (same ratio)
    function toSVGx(ex){return PAD+(ex-edFX)/edFW*fw;}
    function toSVGy(ey){return PAD+(ey-edFY)/edFH*fh;}

    // Draw zones
    allEls.filter(el=>el.type==='zone').forEach(el=>{
      const ex=toSVGx(el.x),ey=toSVGy(el.y);
      const rot=el.rot||0, zw=(el.zw||80)/edFW*fw, zh=(el.zh||60)/edFH*fh;
      if(Math.abs(rot)<0.01){
        s+=`<rect x="${ex-zw/2}" y="${ey-zh/2}" width="${zw}" height="${zh}" fill="${el.fillC||'rgba(200,168,75,0.12)'}" stroke="${el.strokeC||'#C8A84B'}" stroke-width="1.2" stroke-dasharray="5,2.5"/>`;
      } else {
        const co=Math.cos(rot),si=Math.sin(rot);
        const pts=[[-zw/2,-zh/2],[zw/2,-zh/2],[zw/2,zh/2],[-zw/2,zh/2]].map(([lx,ly])=>`${ex+lx*co-ly*si},${ey+lx*si+ly*co}`).join(' ');
        s+=`<polygon points="${pts}" fill="${el.fillC||'rgba(200,168,75,0.12)'}" stroke="${el.strokeC||'#C8A84B'}" stroke-width="1.2" stroke-dasharray="5,2.5"/>`;
      }
    });

    // Lines
    const LC={pass:'#3366CC',run:'#00B050',dribble:'#C8A84B',shot:'#FF0000',pressure:'#FFC000',dots:'#ffffff'};
    allLns.forEach(l=>{
      const lx1=toSVGx(l.x1),ly1=toSVGy(l.y1),lx2=toSVGx(l.x2),ly2=toSVGy(l.y2);
      const lc=l.customColor||LC[l.lt]||'#3366CC', lw=l.lt==='shot'?2.5:2;
      const da=l.lt==='run'?'stroke-dasharray="8,4"':l.lt==='pressure'?'stroke-dasharray="3,2.5"':l.lt==='dots'?'stroke-dasharray="2,5"':'';
      if(l.lt==='dribble'){
        const dx=lx2-lx1,dy=ly2-ly1,len=Math.sqrt(dx*dx+dy*dy)||1;
        const steps=Math.max(2,Math.floor(len/16));const amp=5;
        let d=`M${lx1},${ly1}`;
        for(let i=1;i<=steps;i++){const tt=i/steps,t2=(i-.5)/steps,sg=i%2?1:-1;const cpx=lx1+dx*t2-dy/len*amp*sg,cpy=ly1+dy*t2+dx/len*amp*sg;d+=` Q${cpx.toFixed(1)},${cpy.toFixed(1)} ${(lx1+dx*tt).toFixed(1)},${(ly1+dy*tt).toFixed(1)}`;}
        s+=`<path d="${d}" fill="none" stroke="${lc}" stroke-width="${lw}"/>`;
      } else {
        s+=`<line x1="${lx1.toFixed(1)}" y1="${ly1.toFixed(1)}" x2="${lx2.toFixed(1)}" y2="${ly2.toFixed(1)}" stroke="${lc}" stroke-width="${lw}" ${da}/>`;
      }
      if(l.lt!=='dots'){const a=Math.atan2(ly2-ly1,lx2-lx1),sz=8;s+=`<polygon points="${lx2},${ly2} ${lx2-sz*Math.cos(a-.38)},${ly2-sz*Math.sin(a-.38)} ${lx2-sz*Math.cos(a+.38)},${ly2-sz*Math.sin(a+.38)}" fill="${lc}"/>`;}
    });

    // Goals/hurdles/ladders
    allEls.filter(el=>['goal-big','goal-mini','hurdle-s','hurdle-l','ladder'].includes(el.type)).forEach(el=>{
      const ex=toSVGx(el.x),ey=toSVGy(el.y);
      const rot=el.rot||0,gw=(el.gw||70)/edFW*fw,gh=(el.gh||28)/edFH*fh;
      const co=Math.cos(rot),si=Math.sin(rot);
      const pts=[[-gw/2,-gh/2],[gw/2,-gh/2],[gw/2,gh/2],[-gw/2,gh/2]].map(([lx,ly])=>`${ex+lx*co-ly*si},${ey+lx*si+ly*co}`).join(' ');
      const sc=el.strokeC||(el.type.startsWith('goal')?'rgba(220,220,220,0.9)':el.type==='ladder'?'#ffdd57':'#ff9500');
      s+=`<polygon points="${pts}" fill="rgba(255,255,255,0.04)" stroke="${sc}" stroke-width="1.5"/>`;
      if(el.type==='goal-big'||el.type==='goal-mini'){
        const d=el.type==='goal-big'?9/edFH*fh:6/edFH*fh;
        const bpts=[[-gw/2,-gh/2-d],[gw/2,-gh/2-d],[gw/2,-gh/2],[-gw/2,-gh/2]].map(([lx,ly])=>`${ex+lx*co-ly*si},${ey+lx*si+ly*co}`).join(' ');
        s+=`<polygon points="${bpts}" fill="none" stroke="#C8A84B" stroke-width="2"/>`;
      }
    });

    // Hoops
    allEls.filter(el=>el.type==='hoop').forEach(el=>{
      const ex=toSVGx(el.x),ey=toSVGy(el.y),r=(el.size||22)/edFW*fw*0.5;
      s+=`<circle cx="${ex}" cy="${ey}" r="${r}" fill="none" stroke="${el.strokeC||'#ff6b6b'}" stroke-width="1.5"/>`;
    });

    // Cones flat
    allEls.filter(el=>el.type==='cone-flat').forEach(el=>{
      const ex=toSVGx(el.x),ey=toSVGy(el.y),rx=(el.size||6)/edFW*fw,ry=(el.sizeY||6)/edFH*fh;
      s+=`<ellipse cx="${ex}" cy="${ey}" rx="${rx}" ry="${ry}" fill="${el.coneColor||'#ff9500'}" stroke="${el.coneDark||'#cc7000'}" stroke-width="0.8"/>`;
    });

    // Cones 3D
    allEls.filter(el=>el.type==='cone').forEach(el=>{
      const ex=toSVGx(el.x),ey=toSVGy(el.y),sz=(el.size||9)/edFW*fw;
      s+=`<polygon points="${ex},${ey-sz} ${ex-sz*0.75},${ey+sz*0.55} ${ex+sz*0.75},${ey+sz*0.55}" fill="${el.coneColor||'#ff9500'}" stroke="${el.coneDark||'#cc7000'}" stroke-width="0.6"/>`;
    });

    // Poles
    allEls.filter(el=>el.type==='pole').forEach(el=>{
      const ex=toSVGx(el.x),ey=toSVGy(el.y);
      s+=`<rect x="${ex-2}" y="${ey-10}" width="4" height="20" rx="2" fill="#ff6b6b"/>`;
    });

    // Balls
    allEls.filter(el=>el.type==='ball').forEach(el=>{
      const ex=toSVGx(el.x),ey=toSVGy(el.y),r=6;
      s+=`<circle cx="${ex}" cy="${ey}" r="${r}" fill="#f0f0f0" stroke="#333" stroke-width="0.8"/>`;
      s+=`<circle cx="${ex-r*0.25}" cy="${ey-r*0.25}" r="${r*0.35}" fill="#222"/>`;
    });

    // Labels
    allEls.filter(el=>el.type==='label').forEach(el=>{
      s+=`<text x="${toSVGx(el.x)}" y="${toSVGy(el.y)}" text-anchor="middle" fill="#C8A84B" font-size="11" font-family="sans-serif">${el.text||''}</text>`;
    });

    // CT (before players so players draw on top)
    allEls.filter(el=>el.type==='ct').forEach(el=>{
      const ex=toSVGx(el.x),ey=toSVGy(el.y),sz=13;
      s+=`<rect x="${ex-sz}" y="${ey-sz}" width="${sz*2}" height="${sz*2}" rx="3" fill="${el.fill||'#0a1f0a'}" stroke="${el.stroke||'#00B050'}" stroke-width="1.5"/>`;
      s+=`<text x="${ex}" y="${ey+4}" text-anchor="middle" fill="${el.stroke||'#00B050'}" font-size="${(el.label||'').length>2?7:9}" font-weight="bold" font-family="sans-serif">${el.label||'?'}</text>`;
    });

    // Players (on top of everything)
    allEls.filter(el=>el.type==='player').forEach(el=>{
      const ex=toSVGx(el.x),ey=toSVGy(el.y),r=16;
      s+=`<circle cx="${ex}" cy="${ey}" r="${r}" fill="${el.fill||'#1a3060'}" stroke="${el.stroke||'#3366CC'}" stroke-width="2"/>`;
      s+=`<text x="${ex}" y="${ey+4.5}" text-anchor="middle" fill="#fff" font-size="${(el.num||'').length>2?9:12}" font-weight="bold" font-family="sans-serif">${el.num||'?'}</text>`;
    });

    return {svg:s, vw:VW, vh:VH};
  }

const FL={'OF-ORG-SB':'Salida de Balón','OF-ORG-PR':'Progresión','OF-ORG-FI':'Finalización',
  'OF-TR-CA':'Contrataque','OF-TR-IO':'Iniciar Org. Ofensiva',
  'DEF-ORG-SB':'Def. Salida de Balón','DEF-ORG-PR':'Def. Progresión','DEF-ORG-FI':'Def. Finalización',
  'DEF-TR-PR':'Presionar','DEF-TR-PP':'Presionar y Replegar','DEF-TR-RE':'Replegar',
  'ABP-OF':'ABP Ofensiva','ABP-DEF':'ABP Defensiva',
  'OF-ORG':'Org. Ofensiva','OF-TR':'Trans. Ofensiva','DEF-ORG':'Org. Defensiva','DEF-TR':'Trans. Defensiva'};

const FCOLS={'OF-ORG':{bg:'#1a5c1a',brd:'#2ecc40',tx:'#fff',lbl:'ORG. OFENSIVA'},'OF-TR':{bg:'#2d7a2d',brd:'#5ddd5d',tx:'#fff',lbl:'TRANS. OFENSIVA'},'DEF-ORG':{bg:'#7a1a1a',brd:'#e05252',tx:'#fff',lbl:'ORG. DEFENSIVA'},'DEF-TR':{bg:'#7a3d00',brd:'#ff9500',tx:'#fff',lbl:'TRANS. DEFENSIVA'},'ABP':{bg:'#1a3060',brd:'#C8A84B',tx:'#fff',lbl:'ABP'}};






function fc(k){
  if(!k)return{bg:'#111',brd:'#333',tx:'#888',lbl:'—'};
  if(k.startsWith('OF-ORG'))return FCOLS['OF-ORG'];
  if(k.startsWith('OF-TR'))return FCOLS['OF-TR'];
  if(k.startsWith('DEF-ORG'))return FCOLS['DEF-ORG'];
  if(k.startsWith('DEF-TR'))return FCOLS['DEF-TR'];
  return FCOLS['ABP'];
}

// ── STATE ──
let sessions=JSON.parse(localStorage.getItem('pz_sessions')||'[]');
let tasks=JSON.parse(localStorage.getItem('pz_tasks_v3')||'[]');

// ── SESSION LIST ──
function renderSessionList(){
  const list=document.getElementById('session-list');
  list.innerHTML='';
  document.getElementById('sess-count').textContent=sessions.length;
  if(!sessions.length){
    list.innerHTML='<div style="padding:20px 12px;text-align:center;font-size:11px;color:var(--text3);">Sin sesiones.<br>Crea la primera.</div>';
    return;
  }
  [...sessions].reverse().forEach(s=>{
    const el=document.createElement('div');
    el.className='session-item'+(s.id===curSessionId?' active':'');
    el.onclick=()=>loadSession(s.id);
    const dateStr=s.date?new Date(s.date+'T12:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'}):'';
    el.innerHTML=`<div class="si-num">SESIÓN ${s.num||'—'}</div>
      <div class="si-date">${s.dia||''} ${dateStr?'· '+dateStr:''}</div>
      <div class="si-sub">${s.semana||''} ${s.taskIds&&s.taskIds.length?'· '+s.taskIds.length+' tareas':''}</div>`;
    list.appendChild(el);
  });
}

// ── MODAL ──
function openNewSession(){
  const nextNum=sessions.length?Math.max(...sessions.map(s=>s.num||0))+1:1;
  document.getElementById('m-num').value=nextNum;
  document.getElementById('m-date').value=new Date().toISOString().split('T')[0];
  const picker=document.getElementById('task-picker');
  picker.innerHTML='';
  if(!tasks.length){
    picker.innerHTML='<div style="padding:12px;text-align:center;font-size:11px;color:var(--text3);">No hay tareas en la librería.</div>';
  } else {
    tasks.forEach(t=>{
      const fp=fc(t.fasePrincipal||'');
      const item=document.createElement('div');item.className='task-pick-item';
      item.innerHTML=`<input type="checkbox" value="${t.id}"/>
        <div style="flex:1;min-width:0;">
          <div class="tpi-name">${t.name||'Sin nombre'}</div>
          <div class="tpi-phase" style="color:${fp.brd};">${FL[t.fasePrincipal||'']||'—'} ${t.socio?'· '+t.socio:''}</div>
        </div>`;
      picker.appendChild(item);
    });
  }
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

function saveSession(){
  const checkedIds=[...document.querySelectorAll('#task-picker input:checked')].map(c=>c.value);
  const s={
    id:Date.now().toString(),
    num:parseInt(document.getElementById('m-num').value)||1,
    date:document.getElementById('m-date').value,
    dia:document.getElementById('m-dia').value,
    semana:document.getElementById('m-semana').value,
    jornada:document.getElementById('m-jornada').value,
    campo:document.getElementById('m-campo').value,
    material:document.getElementById('m-material').value,
    rival:document.getElementById('m-rival').value,
    taskIds:checkedIds,
    taskData:Object.fromEntries(checkedIds.map(id=>([id,{indice:'',tiempo:'',carga:'',distrib:Array(20).fill('')}]))),
    attendance:Object.fromEntries(players.map(p=>[p.num,'E'])),
    objectives:Object.fromEntries(checkedIds.map(id=>{
      const t=tasks.find(t=>t.id===id)||{};
      return [id,{
        principal:(t.iP&&t.iP.length)?t.iP.join(' · '):'',
        secundario:(t.iS&&t.iS.length)?t.iS.join(' · '):''
      }];
    })),
    pctPartido:''
  };
  sessions.push(s);saveSessions();
  closeModal();renderSessionList();loadSession(s.id);
}

// ── LOAD SESSION ──
function loadSession(id){
  curSessionId=id;
  const s=sessions.find(s=>s.id===id);if(!s)return;
  renderSessionList();
  document.getElementById('empty-state').style.display='none';
  document.getElementById('sess-content').style.display='block';
  document.getElementById('btn-print').style.display='';
  renderSession(s);
}

    </div>

    <!-- RIGHT COLUMN: CT + materiales + botones -->
    <div style="display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,0.07);">

      <!-- CT (azul) — flex:2 ocupa la mayor parte -->

        <div style="font-size:9px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Cuerpo Técnico</div>
        ${rolesArr.map(r=>`<div style="display:flex;gap:6px;align-items:flex-start;margin-bottom:7px;"><span style="background:#00B050;color:#0a1a08;font-size:8px;font-weight:800;padding:2px 5px;border-radius:3px;flex-shrink:0;margin-top:1px;">${r.l}</span><span style="font-size:10px;color:#b8b0a0;line-height:1.4;">${r.v}</span></div>`).join('')||'<span style="font-size:10px;color:var(--text3);">—</span>'}

        <div style="font-size:9px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;">Materiales</div>
        <div style="font-size:10px;color:#b8b0a0;line-height:1.6;">${matList}</div>

  </div>

</div>
`;
  return card;
}

// ── RENDER FULL SESSION ──
function renderSession(s){
  try {
  const c=document.getElementById('sess-content');c.innerHTML='';
  const taskObjs=s.taskIds.map(id=>tasks.find(t=>t.id===id)).filter(Boolean);

  // ── Auto-fill objectives desde iP/iS de cada tarea ──
  let objChanged = false;
  taskObjs.forEach(t=>{
    // Garantizar que existe la entrada para esta tarea
    if(!s.objectives) s.objectives = {};
    if(!s.objectives[t.id]) { s.objectives[t.id]={principal:'',secundario:''}; objChanged=true; }
    // Auto-rellenar si está vacío
    if(!s.objectives[t.id].principal && t.iP && t.iP.length){
      s.objectives[t.id].principal = t.iP.join(' · '); objChanged=true;
    }
    if(!s.objectives[t.id].secundario && t.iS && t.iS.length){
      s.objectives[t.id].secundario = t.iS.join(' · '); objChanged=true;
    }
  });
  if(objChanged) saveSessions();

  // ── Helper: build task block (card + ITC + distrib) ──
  function buildTaskWrap(t, num){
    const td=s.taskData[t.id]||{indice:'',tiempo:'',carga:'',distrib:Array(20).fill('')};
    if(!td.distrib || td.distrib.length < 20) td.distrib=(td.distrib||[]).concat(Array(20).fill('')).slice(0,20);

    const wrap=document.createElement('div');wrap.className='print-task-wrap';

    // Label
    const lbl=document.createElement('div');
    lbl.className='task-lbl';
    lbl.style.cssText="display:flex;align-items:center;gap:6px;margin:8px 0 3px;";
    lbl.innerHTML=`<span style="background:var(--gold);color:#0d1530;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;padding:2px 10px;border-radius:4px;letter-spacing:1px;">TAREA ${num}</span>`;
    wrap.appendChild(lbl);

    // Card (exact librería) + extra dentro del wrapper de escala
    const extra=document.createElement('div');extra.className='task-extra';
    extra.innerHTML=`
      <div>
        <div class="te-section-title">Distribución Jugadores</div>
        <div class="distrib-grid" style="grid-template-columns:repeat(5,1fr);gap:3px;margin-top:4px;">
          ${td.distrib.map((v,di)=>`<div class="distrib-cell" contenteditable="true" style="color:#111;"
            oninput="updateDistrib('${s.id}','${t.id}',${di},this.textContent)">${v||''}</div>`).join('')}
        </div>
      </div>
      <div>
        <div class="te-section-title">Índice · Tiempo · Carga</div>
        <div class="itc-row">
          <div class="itc-field"><label>Índice</label>
            <input type="number" value="${td.indice||''}" placeholder="—"
              oninput="updateITC('${s.id}','${t.id}','indice',this.value)"/>
          </div>
          <div class="itc-field"><label>Tiempo (min)</label>
            <input type="number" value="${td.tiempo||''}" placeholder="—"
              oninput="updateITC('${s.id}','${t.id}','tiempo',this.value)"/>
          </div>
          <div class="itc-field"><label>Carga</label>
            <input type="number" value="${td.carga||''}" placeholder="—"
              oninput="updateITC('${s.id}','${t.id}','carga',this.value)"/>
          </div>
        </div>
      </div>`;
    const card=makeTaskCard(t);
    // Wrap card+extra together so zoom applies to both uniformly
    const scaleWrap=document.createElement('div');
    scaleWrap.className='lcard-scale-wrap';
    scaleWrap.appendChild(card);
    scaleWrap.appendChild(extra);
    wrap.appendChild(scaleWrap);
    return wrap;
  }

  // ════════════════════════════════
  //  PÁGINA 1: cabecera + asistencia + tareas 1 y 2
  // ════════════════════════════════
  const page1=document.createElement('div');page1.className='print-page';
  page1.style.position='relative';
  const crestData1=localStorage.getItem('oi_team_crest');
  page1.innerHTML=`
    ${crestData1?`<img src="${crestData1}" class="print-crest" alt="Escudo"/>`:''}
  `;

  // Cabecera sesión
  const dateStr=s.date?new Date(s.date+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):'';
  const hdrBlock=document.createElement('div');hdrBlock.className='sess-hdr-block';
  hdrBlock.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;width:100%;">
      <img src="${LOGO_CIRC}" style="height:40px;width:auto;flex-shrink:0;" alt="El Once Inicial"/>
      <div style="flex-shrink:0;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:#fff;letter-spacing:1px;white-space:nowrap;">SESIÓN ${s.num||'—'}</div>
        <div style="font-size:10px;color:rgba(200,168,75,0.6);">${dateStr}</div>
      </div>
      <div class="sess-hdr-grid" style="flex:1;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;">
        <div class="shf"><label>Día</label><div class="val">${s.dia||'—'}</div></div>
        <div class="shf"><label>Semana</label><div class="val">${s.semana||'—'}</div></div>
        <div class="shf"><label>Jornada</label><div class="val">${s.jornada||'—'}</div></div>
        <div class="shf"><label>Campo</label><div class="val">${s.campo||'—'}</div></div>
        <div class="shf"><label>Grupo Mat.</label><div class="val">${s.material||'—'}</div></div>
        <div class="shf"><label>Rival</label><div class="val">${s.rival||'—'}</div></div>
      </div>
      <button class="btn btn-ghost" onclick="deleteSession('${s.id}')" style="flex-shrink:0;">🗑 Eliminar</button>
    </div>`;
  page1.appendChild(hdrBlock);

  // Asistencia
  const attBlock=document.createElement('div');attBlock.className='att-block';
  attBlock.innerHTML=`<div class="att-title">Asistencia
    <div style="margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;">
      ${['E','L','En','P','RA','E2'].map(st=>`<div style="display:flex;align-items:center;gap:2px;">
        <span class="att-status att-${st}">${st}</span>
        <span style="font-size:9px;color:var(--text3);">${{E:'Asistencia',L:'Lesión',En:'Enfermo',P:'Permiso',RA:'Readaptando',E2:'Otro equipo'}[st]}</span>
      </div>`).join('')}
    </div>
  </div>
  <div class="att-grid" id="att-${s.id}"></div>`;
  page1.appendChild(attBlock);
  const ag=attBlock.querySelector('#att-'+s.id);
  players.forEach(p=>{
    const st=s.attendance[p.num]||'E';
    const cell=document.createElement('div');cell.className='att-player';
    cell.innerHTML=`<span class="att-num">${p.num}</span>
      <input style="background:transparent;border:none;font-size:9px;color:var(--text);width:55px;font-family:'Barlow',sans-serif;padding:0;"
        value="${p.name||''}" placeholder="Jugador ${p.num}" onchange="updatePlayerName(${p.num},this.value)"/>
      <span class="att-status att-${st}" data-player="${p.num}" onclick="cycleAtt(this,'${s.id}')">${st}</span>`;
    ag.appendChild(cell);
  });

  // Tareas 1 y 2
  const row1=document.createElement('div');row1.className='print-tasks-row';
  [0,1].forEach(i=>{
    if(taskObjs[i]) row1.appendChild(buildTaskWrap(taskObjs[i],i+1));
    else {
      const empty=document.createElement('div');empty.className='print-task-wrap';
      empty.innerHTML=`<div style="border:1px dashed rgba(200,168,75,0.2);border-radius:4px;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:11px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;">SIN TAREA</div>`;
      row1.appendChild(empty);
    }
  });
  page1.appendChild(row1);
  c.appendChild(page1);

  // ════════════════════════════════
  //  PÁGINA 2: tareas 3 y 4 + objetivos + carga
  // ════════════════════════════════
  const page2=document.createElement('div');page2.className='print-page';
  page2.style.position='relative';
  const crestData2=localStorage.getItem('oi_team_crest');
  page2.innerHTML=crestData2?`<img src="${crestData2}" class="print-crest" alt="Escudo"/>`:'';




  // Tareas 3 y 4
  const row2=document.createElement('div');row2.className='print-tasks-row';
  [2,3].forEach(i=>{
    if(taskObjs[i]) row2.appendChild(buildTaskWrap(taskObjs[i],i+1));
    else {
      const empty=document.createElement('div');empty.className='print-task-wrap';
      empty.innerHTML=`<div style="border:1px dashed rgba(200,168,75,0.2);border-radius:4px;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:11px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;">SIN TAREA</div>`;
      row2.appendChild(empty);
    }
  });
  page2.appendChild(row2);

  // Objetivos + Carga externa
  const bot=document.createElement('div');bot.className='bottom-section';

  // Objetivos (auto-rellenos con iP/iS)
  const objCard=document.createElement('div');objCard.className='bottom-card';
  objCard.innerHTML=`<div class="bottom-card-hdr">Objetivos de Sesión</div>
    <table class="obj-table">
      <thead><tr><th style="width:45px;">Tarea</th><th>Principal</th><th>Secundario</th></tr></thead>
      <tbody>${taskObjs.map((t,i)=>{
        const obj=s.objectives[t.id]||{};
        return `<tr>
          <td><span class="obj-task-num">T${i+1}</span></td>
          <td><div contenteditable="true" style="min-height:18px;font-size:11px;color:#111;outline:none;padding:1px;"
            oninput="updateObj('${s.id}','${t.id}','principal',this.textContent)"
            >${obj.principal||''}</div></td>
          <td><div contenteditable="true" style="min-height:18px;font-size:11px;color:#111;outline:none;padding:1px;"
            oninput="updateObj('${s.id}','${t.id}','secundario',this.textContent)"
            >${obj.secundario||''}</div></td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;

  // Carga externa
  const cargaCard=document.createElement('div');cargaCard.className='bottom-card';
  cargaCard.innerHTML=`<div class="bottom-card-hdr">Carga Externa Sesión</div>
    <table class="carga-table">
      <thead><tr><th>Tarea</th><th>Índice</th><th>Min</th><th>Carga</th></tr></thead>
      <tbody>
        ${taskObjs.map((t,i)=>{
          const td=s.taskData[t.id]||{};
          return `<tr>
            <td style="color:var(--gold);font-weight:700;font-family:'Barlow Condensed',sans-serif;">T${i+1}</td>
            <td><input class="carga-input" value="${td.indice||''}" placeholder="—" oninput="updateITC('${s.id}','${t.id}','indice',this.value)"/></td>
            <td><input class="carga-input" value="${td.tiempo||''}" placeholder="—" oninput="updateITC('${s.id}','${t.id}','tiempo',this.value)"/></td>
            <td><input class="carga-input" value="${td.carga||''}" placeholder="—" oninput="updateITC('${s.id}','${t.id}','carga',this.value)"/></td>
          </tr>`;
        }).join('')}
        <tr class="total-row">
          <td>TOTAL</td><td>—</td>
          <td id="tot-min-${s.id}">—</td>
          <td id="tot-car-${s.id}">—</td>
        </tr>
        <tr style="background:rgba(200,168,75,0.04);">
          <td colspan="2" style="text-align:left;font-size:9px;color:var(--gold);font-weight:700;text-transform:uppercase;">% Partido</td>
          <td colspan="2"><input class="carga-input" value="${s.pctPartido||''}" placeholder="—" oninput="updateSessField('${s.id}','pctPartido',this.value)"/></td>
        </tr>
      </tbody>
    </table>`;

  bot.appendChild(objCard);bot.appendChild(cargaCard);
  page2.appendChild(bot);
  c.appendChild(page2);

  updateTotals(s);
  updateTotals(s);
  } catch(e) {
    console.error('renderSession error:', e, e.stack);
    document.getElementById('sess-content').innerHTML = '<div style="padding:20px;color:#e05252;">Error al cargar sesión: '+e.message+'<br><small>'+e.stack+'</small></div>';
  }
}

// ── DATA UPDATES ──
function updatePlayerName(num,name){const p=players.find(p=>p.num===num);if(p){p.name=name;savePlayers();}}
function cycleAtt(el,sid){
  const s=sessions.find(s=>s.id===sid);if(!s)return;
  const num=parseInt(el.getAttribute('data-player'));
  const cur=s.attendance[num]||'E';
  const next=ATT_NEXT[cur]||'E';
  s.attendance[num]=next;
  el.className=`att-status att-${next}`;el.textContent=next;
  saveSessions();
}
function updateITC(sid,tid,field,val){
  const s=sessions.find(s=>s.id===sid);if(!s)return;
  if(!s.taskData[tid])s.taskData[tid]={};
  s.taskData[tid][field]=val;
  saveSessions();updateTotals(s);
}
function updateDistrib(sid,tid,idx,val){
  const s=sessions.find(s=>s.id===sid);if(!s)return;
  if(!s.taskData[tid])s.taskData[tid]={distrib:Array(6).fill('')};
  if(!s.taskData[tid].distrib)s.taskData[tid].distrib=Array(6).fill('');
  s.taskData[tid].distrib[idx]=val;saveSessions();
}
function updateObj(sid,tid,field,val){
  const s=sessions.find(s=>s.id===sid);if(!s)return;
  if(!s.objectives[tid])s.objectives[tid]={};
  s.objectives[tid][field]=val;saveSessions();
}
function updateSessField(sid,field,val){
  const s=sessions.find(s=>s.id===sid);if(!s)return;
  s[field]=val;saveSessions();
}
function updateTotals(s){
  let totMin=0,totCar=0,hMin=false,hCar=false;
  (s.taskIds||[]).forEach(id=>{
    const td=s.taskData[id]||{};
    if(td.tiempo){totMin+=parseFloat(td.tiempo)||0;hMin=true;}
    if(td.carga){totCar+=parseFloat(td.carga)||0;hCar=true;}
  });
  const tm=document.getElementById('tot-min-'+s.id);
  const tc=document.getElementById('tot-car-'+s.id);
  if(tm)tm.textContent=hMin?(totMin+"'"):'—';
  if(tc)tc.textContent=hCar?totCar.toFixed(1):'—';
}
function deleteSession(id){
  if(!confirm('¿Eliminar esta sesión?'))return;
  sessions=sessions.filter(s=>s.id!==id);saveSessions();curSessionId=null;
  renderSessionList();
  document.getElementById('empty-state').style.display='';
  document.getElementById('sess-content').style.display='none';
  document.getElementById('btn-print').style.display='none';
}
function printSession(){window.print();}

// ── ESCUDO DEL EQUIPO (compartido vía localStorage: 'oi_team_crest') ──
const CREST_KEY='oi_team_crest';
function crestNavLoad(){
  const data=localStorage.getItem(CREST_KEY);
  const img=document.getElementById('crest-nav-img');
  const addIcon=document.getElementById('crest-add-sm-icon');
  if(!img||!addIcon) return;
  if(data){
    img.src=data;
    img.style.display='block';
    addIcon.style.display='none';
  }else{
    img.style.display='none';
    addIcon.style.display='flex';
  }
}
function crestNavClick(e){
  document.getElementById('crest-nav-file-input').click();
}
function crestNavFileChosen(e){
  const file=e.target.files&&e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Selecciona un archivo de imagen.'); return; }
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const MAX=320;
      let w=img.width, h=img.height;
      if(w>h){ if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; } }
      else{ if(h>MAX){ w=Math.round(w*MAX/h); h=MAX; } }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.clearRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL('image/png');
      try{
        localStorage.setItem(CREST_KEY, dataUrl);
        crestNavLoad();
      }catch(err){
        alert('La imagen es demasiado grande incluso tras comprimir. Prueba con otra.');
      }
    };
    img.onerror=function(){ alert('No se pudo leer la imagen.'); };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
}
function crestNavRemove(e){
  e.stopPropagation();
  localStorage.removeItem(CREST_KEY);
  crestNavLoad();
}
crestNavLoad();

// ── INIT ──
renderSessionList();

// ── PRINT: scale cards to fit exactly ──
function beforePrint(){
  document.querySelectorAll('.lcard-scale-wrap').forEach(wrap=>{
    const parent = wrap.closest('.print-task-wrap');
    if(!parent) return;
    const availW = parent.offsetWidth || 537;
    const cardW = 960;
    const z = availW / cardW;
    wrap.style.zoom = z.toFixed(4);
  });
}
function afterPrint(){
  document.querySelectorAll('.lcard-scale-wrap').forEach(wrap=>{
    wrap.style.zoom = '';
  });
}
if(window.matchMedia){
  const mq = window.matchMedia('print');
  mq.addListener(e=>{ if(e.matches) beforePrint(); else afterPrint(); });
}
window.addEventListener('beforeprint', beforePrint);
window.addEventListener('afterprint', afterPrint);
</script>
<script>
function _loadOiCrest(){
  var c=localStorage.getItem('oi_team_crest');
  if(!c) return;
  var imgs=document.querySelectorAll('.oi-nav-crest img');
  imgs.forEach(function(img){
    img.src=c; img.style.display='block';
    if(img.previousElementSibling) img.previousElementSibling.style.display='none';
  });
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',_loadOiCrest);}
else{_loadOiCrest();}
</script>
