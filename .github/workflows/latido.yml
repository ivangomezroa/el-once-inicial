# ══════════════════════════════════════════════════════════════════
# EL ONCE INICIAL — Latido diario a Supabase
#
# Para qué: el plan gratuito pausa el proyecto tras 7 días de poca
# actividad, y desde que la pizarra y la planilla guardan en la nube,
# un proyecto pausado significa que dejan de sincronizar. Su
# documentación dice que basta con unas pocas peticiones a la base de
# datos al día, así que esto llama una vez al día a la función
# `latido()`, que solo devuelve la hora del servidor.
#
# La clave que usa es la PUBLICABLE, la misma que ya va dentro de la
# app y que se puede leer en el navegador de cualquiera. No es un
# secreto: lo que protege los datos es RLS, no esconder esta clave.
# La clave secreta no aparece aquí ni hace falta.
#
# Si el latido falla, la Action falla y GitHub manda un correo.
#
# OJO: GitHub desactiva las tareas programadas de un repositorio que
# lleva 60 días sin actividad. Avisa por correo antes de hacerlo, y se
# vuelve a activar con un clic en la pestaña Actions. También se puede
# lanzar a mano desde ahí (Run workflow).
# ══════════════════════════════════════════════════════════════════
name: Latido a Supabase

on:
  schedule:
    # Todos los días a las 06:12 UTC. Minuto raro a propósito: en punto
    # se acumulan las tareas de todo GitHub y se retrasan.
    - cron: '12 6 * * *'
  workflow_dispatch:

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a la base de datos
        run: |
          URL="https://npaddnmffepnuidekynb.supabase.co"
          KEY="sb_publishable_YfvyI8taXsUNCcun0kYUnw_BlxCbPR9"

          # Se reintenta: un fallo de red puntual no debe dar la alarma.
          for intento in 1 2 3; do
            echo "── Intento $intento"
            CUERPO=$(curl -sS --max-time 25 \
              -w $'\n%{http_code}' \
              -X POST "$URL/rest/v1/rpc/latido" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -d '{}' || true)

            CODIGO=$(printf '%s' "$CUERPO" | tail -n1)
            RESPUESTA=$(printf '%s' "$CUERPO" | sed '$d')
            echo "HTTP $CODIGO — $RESPUESTA"

            # Tiene que ser 200 Y traer una fecha: así se sabe que la
            # peticion ha llegado a Postgres y no a una cache.
            if [ "$CODIGO" = "200" ] && printf '%s' "$RESPUESTA" | grep -qE '20[0-9]{2}-[0-9]{2}-[0-9]{2}'; then
              echo "✓ El proyecto responde. Hora del servidor: $RESPUESTA"
              exit 0
            fi

            [ "$intento" -lt 3 ] && sleep 20
          done

          echo "✗ El proyecto no responde como debería después de 3 intentos."
          echo "  Si está pausado: supabase.com → el-once-inicial → Restore project."
          echo "  Los datos se conservan hasta un año después de pausarse."
          exit 1
